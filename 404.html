<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- GitHub Pages shows this page for any address that does not exist,
     so every path here starts from the site root (/assets/…, /fonts/…). -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5D5143">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Page not found | NOEASY</title>
<style>
@font-face { font-family:'Mekzantine'; src:url('/fonts/MEKZANTINE.woff2') format('woff2'), url('/fonts/MEKZANTINE-Regular.otf') format('opentype'); font-display:swap; }
@font-face { font-family:'DotGothic16'; src:url('/fonts/DotGothic16.woff2') format('woff2'), url('/fonts/DotGothic16-Regular.ttf') format('truetype'); font-display:swap; }

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* Same chrome as Links and Privacy: header, Win95 window; here the window is an error dialog. */
:root{
  --bg:#e8e0c4; --desk:#5D5143; --tb:#5D5143;
  --ttxt:#f6f1da; --btn:#AFA191; --blt:#d4cdc4; --bdk:#3d3830; --bsh:#2a2520;
  --ink:#1e1a12;
  --header-pill-h:44px;
  --header-total-h:calc(env(safe-area-inset-top,0px) + var(--header-pill-h));
}

html{background:#5D5143;}
body{min-height:100vh;font-family:'DotGothic16',monospace;background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;}
body::before{content:'';position:fixed;top:-100vh;left:0;right:0;height:100vh;background:#5D5143;z-index:9001;pointer-events:none;}
/* film grain and the ring cursor: /assets/site.js */
#grain{z-index:9998;}
::selection{background:var(--desk);color:var(--ttxt);}
a:focus-visible,button:focus-visible{outline:1px dotted var(--ink);outline-offset:2px;}

/* ══ HEADER (matches site) ══ */
header{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .7s ease;background:var(--desk);}
header.visible{opacity:1;}
header>*{pointer-events:auto;}
.header-safe-top{height:env(safe-area-inset-top,0px);background:var(--desk);}
.header-pill{display:flex;align-items:center;position:relative;height:var(--header-pill-h);background:var(--btn);border-top:1px solid var(--blt);border-bottom:2px solid #7a7068;box-shadow:0 1px 0 #404040;padding:0 4px;}
.pill-divider{width:2px;height:26px;background:#808080;border-right:1px solid var(--blt);margin:0 2px;flex-shrink:0;}
.pill-center{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;user-select:none;white-space:nowrap;}
.pill-section{margin:0;font-family:'Mekzantine',serif;font-size:19px;font-weight:400;line-height:normal;letter-spacing:.08em;opacity:.9;color:#000;}
.sword-btn{height:calc(100% - 10px);padding:0 12px;margin:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--btn);border-top:2px solid var(--blt);border-left:2px solid var(--blt);border-right:2px solid var(--bdk);border-bottom:2px solid var(--bdk);box-shadow:inset 1px 1px 0 var(--blt),inset -1px -1px 0 #7a7068;cursor:pointer;flex-shrink:0;}
.sword-btn:active,.sword-btn.open{border-top:2px solid var(--bdk);border-left:2px solid var(--bdk);border-right:2px solid var(--blt);border-bottom:2px solid var(--blt);box-shadow:inset 1px 1px 0 #7a7068;}
.sword-btn .line{position:relative;height:2px;background:#000;opacity:.8;transition:transform .38s cubic-bezier(.16,1,.3,1),opacity .25s,width .38s cubic-bezier(.16,1,.3,1);width:18px;}
.sword-btn.open .line:nth-child(1){transform:translateY(6px) rotate(45deg);}
.sword-btn.open .line:nth-child(2){opacity:0;transform:scaleX(0);}
.sword-btn.open .line:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.burger-wrap{position:relative;height:100%;display:flex;align-items:center;}
/* closed menu = visibility:hidden too, so Tab and screen readers skip it; it hides only after the fade-out */
.nav-overlay{position:absolute;top:calc(100% + 4px);right:0;z-index:8999;min-width:170px;padding:2px;background:var(--btn);border-top:2px solid var(--blt);border-left:2px solid var(--blt);border-right:2px solid var(--bdk);border-bottom:2px solid var(--bdk);box-shadow:2px 2px 0 var(--bsh);display:flex;flex-direction:column;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-4px);transform-origin:top right;transition:opacity .15s,transform .15s,visibility 0s linear .15s;}
.nav-overlay.open{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);transition-delay:0s;}
.nav-overlay a{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#000;text-decoration:none;padding:9px 12px 9px 8px;display:flex;align-items:center;}
.nav-overlay a::before{content:'/';margin-right:7px;opacity:.5;}
.nav-overlay a + a{border-top:1px solid #7a7068;}
.nav-overlay a:hover,.nav-overlay a:focus-visible{background:var(--desk);color:var(--ttxt);outline:none;}

/* ══ ERROR DIALOG ══ */
main{min-height:100vh;min-height:100dvh;padding:calc(var(--header-total-h) + 22px) 12px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;align-items:center;justify-content:center;}
.win{width:100%;max-width:420px;display:flex;flex-direction:column;border-top:2px solid var(--blt);border-left:2px solid var(--blt);border-right:2px solid var(--bdk);border-bottom:2px solid var(--bdk);box-shadow:2px 2px 0 var(--bsh);opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);background:var(--btn);}
.win.visible{opacity:1;transform:none;}
.tbar{height:22px;background:var(--btn);display:flex;align-items:stretch;padding:1px;flex-shrink:0;user-select:none;}
.tbar-inner{flex:1;background:var(--tb);display:flex;align-items:center;padding:0 1px 0 6px;gap:2px;overflow:hidden;min-width:0;}
.tbar-t{flex:1;font-size:10px;font-weight:700;letter-spacing:.11em;color:var(--ttxt);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1;min-width:0;}
.tbbtns{display:flex;gap:1px;flex-shrink:0;align-items:center;}
.tbbtn{width:16px;height:16px;background:var(--btn);border-top:1px solid var(--blt);border-left:1px solid var(--blt);border-right:1px solid var(--bdk);border-bottom:1px solid var(--bdk);display:flex;align-items:center;justify-content:center;cursor:default;flex-shrink:0;padding:0;line-height:0;}
.con-body{padding:20px 18px 18px;border-top:2px solid #7a7068;}
.msg{display:flex;gap:16px;align-items:flex-start;}
.msg-icon{flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--desk);border-top:2px solid var(--bdk);border-left:2px solid var(--bdk);border-right:2px solid var(--blt);border-bottom:2px solid var(--blt);}
.msg-icon svg{display:block;width:20px;height:20px;image-rendering:pixelated;shape-rendering:crispEdges;}
.msg-t{font-family:'Mekzantine',serif;font-weight:400;font-size:22px;letter-spacing:.03em;line-height:1.15;color:#1e1a12;}
.msg-p{margin-top:8px;font-size:13px;line-height:1.6;color:#2a2520;}
.msg-code{margin-top:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#3d3830;}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}
.b95{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:36px;padding:0 16px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:var(--btn);border-top:2px solid var(--blt);border-left:2px solid var(--blt);border-right:2px solid var(--bdk);border-bottom:2px solid var(--bdk);box-shadow:inset 1px 1px 0 var(--blt),inset -1px -1px 0 #7a7068;-webkit-tap-highlight-color:transparent;}
.b95:active{border-top:2px solid var(--bdk);border-left:2px solid var(--bdk);border-right:2px solid var(--blt);border-bottom:2px solid var(--blt);box-shadow:inset 1px 1px 0 #7a7068;padding:2px 15px 0 17px;}
/* the default button of a Win95 dialog wears a black frame */
.b95.default{outline:1px solid #000;outline-offset:0;}
.b95.default:focus-visible{outline:1px dotted var(--ink);outline-offset:2px;}

@media (max-width:400px){main{padding-left:6px;padding-right:6px;}.con-body{padding:16px 12px 14px;}.msg{gap:12px;}.b95{flex:1;min-width:0;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important;}}
</style>
<!-- NOEASY visit counter (no cookies) + newsletter helper; the Mindgate bot publishes assets/door.js -->
<script src="/assets/door.js" defer></script>
<!-- film grain + ring cursor, shared by every page -->
<script src="/assets/site.js" defer></script>
</head>
<body>

<div id="grain" aria-hidden="true" data-alpha="20"></div>
<header id="siteHeader">
  <div class="header-safe-top"></div>
  <div class="header-pill">
    <div class="pill-center"><span class="pill-section">404</span></div>
    <div style="flex:1"></div>
    <div class="pill-divider"></div>
    <div class="burger-wrap">
      <button class="sword-btn" id="swordBtn" aria-label="Menu" aria-expanded="false" aria-controls="navOverlay">
        <span class="line"></span><span class="line"></span><span class="line"></span>
      </button>
      <div class="nav-overlay" id="navOverlay">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/gallery/">Gallery</a>
        <a href="/links/">Links</a>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="win" id="exWin">
    <div class="tbar"><div class="tbar-inner"><div class="tbar-t">FILE_NOT_FOUND.EXE</div><div class="tbbtns" id="tbtns"></div></div></div>
    <div class="con-body">
      <div class="msg">
        <div class="msg-icon" aria-hidden="true">
          <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="0" width="2" height="10" fill="#f6f1da"/><rect x="3" y="1" width="4" height="1" fill="#f6f1da"/><rect x="3" y="8" width="4" height="1" fill="#f6f1da"/><rect x="2" y="0" width="6" height="1" fill="#f6f1da"/><rect x="2" y="9" width="6" height="1" fill="#f6f1da"/><rect x="0" y="4" width="10" height="2" fill="#f6f1da"/><rect x="1" y="3" width="1" height="4" fill="#f6f1da"/><rect x="8" y="3" width="1" height="4" fill="#f6f1da"/><rect x="0" y="2" width="1" height="6" fill="#f6f1da"/><rect x="9" y="2" width="1" height="6" fill="#f6f1da"/></svg>
        </div>
        <div>
          <h1 class="msg-t" id="msgT">Page not found</h1>
          <p class="msg-p" id="msgP">This page does not exist. It may have moved, or the link has a typo.</p>
          <p class="msg-code">Error 404</p>
        </div>
      </div>
      <div class="btns">
        <a class="b95" href="/gallery/">Gallery</a>
        <a class="b95 default" href="/">Home</a>
      </div>
    </div>
  </div>
</main>

<script>
function $(id){return document.getElementById(id);}
var CROSS='<svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;image-rendering:pixelated;shape-rendering:crispEdges"><rect x="4" y="0" width="2" height="10" fill="#1a1612"/><rect x="3" y="1" width="4" height="1" fill="#1a1612"/><rect x="3" y="8" width="4" height="1" fill="#1a1612"/><rect x="2" y="0" width="6" height="1" fill="#1a1612"/><rect x="2" y="9" width="6" height="1" fill="#1a1612"/><rect x="0" y="4" width="10" height="2" fill="#1a1612"/><rect x="1" y="3" width="1" height="4" fill="#1a1612"/><rect x="8" y="3" width="1" height="4" fill="#1a1612"/><rect x="0" y="2" width="1" height="6" fill="#1a1612"/><rect x="9" y="2" width="1" height="6" fill="#1a1612"/></svg>';
['Minimize','Maximize','Close'].forEach(function(t){var b=document.createElement('div');b.className='tbbtn';b.title=t;b.innerHTML=CROSS;$('tbtns').appendChild(b);});

/* iOS: without this Safari does not show the pressed state of buttons (:active) */
document.addEventListener('touchstart',function(){},{passive:true});

/* Menu (the film grain and the ring cursor: /assets/site.js) */
(function(){
  var btn=$('swordBtn'),nav=$('navOverlay');
  function set(open){btn.classList.toggle('open',open);nav.classList.toggle('open',open);btn.setAttribute('aria-expanded',open?'true':'false');}
  btn.addEventListener('click',function(e){e.stopPropagation();set(!nav.classList.contains('open'));});
  document.addEventListener('click',function(e){if(!nav.contains(e.target)&&e.target!==btn)set(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&nav.classList.contains('open')){set(false);btn.focus();}});
})();
setTimeout(function(){$('siteHeader').classList.add('visible');$('exWin').classList.add('visible');},100);
</script>
</body>
</html>
