<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5D5143">
<title>Shop | NOEASY</title>
<style>
@font-face { font-family:'Alkhemikal'; src:url('../fonts/Alkhemikal.ttf') format('truetype'); }
@font-face { font-family:'DotGothic16'; src:url('../fonts/DotGothic16-Regular.ttf') format('truetype'); }
@font-face { font-family:'Fixedsys'; src:url('../fonts/Fixedsys.ttf') format('truetype'); }

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#e8e0c4; --text:#353535; --desk:#5D5143;
  --tb:#5D5143; --ttxt:#f6f1da;
  --btn:#AFA191; --blt:#d4cdc4; --bdk:#3d3830; --bsh:#2a2520;
  --lbg:#1e1a12; --ta:#D6D5A9; --tdim:#7a6a52;
  --header-titlebar-h:22px; --header-pill-h:44px;
  --header-total-h:calc(env(safe-area-inset-top,0px) + var(--header-titlebar-h) + var(--header-pill-h));
}

html,body{overflow-x:hidden;}
html{background:#5D5143;}
body::before{content:'';position:fixed;top:-100vh;left:0;right:0;height:100vh;background:#5D5143;z-index:9001;pointer-events:none;}
body{background:var(--bg);font-family:'DotGothic16',monospace;color:var(--text);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;}

#grain{position:fixed;top:-60px;bottom:-60px;left:-10px;right:-10px;z-index:9998;pointer-events:none;}

/* ══════════════ HEADER ══════════════ */
header{
  position:fixed; top:0; left:0; right:0; z-index:500;
  display:flex; flex-direction:column;
  background:var(--desk);
  opacity:0; transition:opacity .7s ease;
  pointer-events:none;
}
header.visible{opacity:1;}
header>*{pointer-events:auto;}

.header-safe{ height:env(safe-area-inset-top,0px); background:var(--desk); flex-shrink:0; }

.header-strip{
  height:var(--header-titlebar-h); flex-shrink:0;
  background:var(--desk); border-bottom:1px solid #3e352d;
  display:flex; align-items:center; padding:0 8px;
}
.header-strip-text{
  font-family:'DotGothic16',monospace; font-size:9px; font-weight:700;
  letter-spacing:.14em; color:var(--ttxt); line-height:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.header-toolbar{
  height:var(--header-pill-h); flex-shrink:0;
  background:var(--btn);
  border-top:1px solid var(--blt); border-bottom:2px solid #7a7068;
  box-shadow:0 1px 0 #404040;
  display:flex; align-items:center; padding:0 4px;
}
.tdiv{ width:2px; height:26px; flex-shrink:0; background:#808080; border-right:1px solid var(--blt); margin:0 2px; }

.tbtn{
  height:calc(100% - 10px); display:flex; align-items:center; gap:6px;
  padding:0 10px; margin:0 2px;
  font-family:'DotGothic16',monospace; font-size:9px; font-weight:700;
  letter-spacing:.10em; text-transform:uppercase; color:#000;
  background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:inset 1px 1px 0 var(--blt), inset -1px -1px 0 #7a7068;
  cursor:pointer; user-select:none; white-space:nowrap; flex-shrink:0;
}
.tbtn:active, .tbtn.open{
  border-top:2px solid var(--bdk); border-left:2px solid var(--bdk);
  border-right:2px solid var(--blt); border-bottom:2px solid var(--blt);
  box-shadow:inset 1px 1px 0 #7a7068;
  padding-top:2px; padding-left:12px;
}
.tdot{ width:5px; height:5px; background:var(--text); opacity:0; transition:opacity .2s; flex-shrink:0; }
.tdot.on{ opacity:.7; }

.cart-count{
  min-width:13px; height:13px; padding:0 3px;
  background:var(--desk); color:var(--ttxt);
  font-size:8px; font-weight:700; letter-spacing:0;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}

.toolbar-center{
  position:absolute; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; pointer-events:none; user-select:none; white-space:nowrap;
}
.toolbar-title{ font-family:'Alkhemikal',serif; font-size:14px; letter-spacing:.08em; opacity:.9; color:#000; }
.toolbar-sub{ font-family:'DotGothic16',monospace; font-size:8px; letter-spacing:.2em; opacity:.5; color:#000; }
.header-toolbar{ position:relative; }
.toolbar-spacer{ flex:1; }

.burger-wrap{ position:relative; height:100%; display:flex; align-items:center; }
.sword-btn{
  height:calc(100% - 10px); padding:0 12px; margin:0 2px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:inset 1px 1px 0 var(--blt), inset -1px -1px 0 #7a7068;
  cursor:pointer; -webkit-tap-highlight-color:transparent; transition:none; flex-shrink:0;
}
.sword-btn:active, .sword-btn.open{
  border-top:2px solid var(--bdk); border-left:2px solid var(--bdk);
  border-right:2px solid var(--blt); border-bottom:2px solid var(--blt);
  box-shadow:inset 1px 1px 0 #7a7068;
}
.sword-btn .line{ height:2px; width:18px; background:#000; opacity:.8; transition:transform .38s cubic-bezier(.16,1,.3,1),opacity .25s; }
.sword-btn.open .line:nth-child(1){ transform:translateY(6px) rotate(45deg); }
.sword-btn.open .line:nth-child(2){ opacity:0; transform:scaleX(0); }
.sword-btn.open .line:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }

.nav-overlay{
  position:absolute; top:calc(100% + 4px); right:0; z-index:8999; min-width:160px; padding:2px;
  background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:2px 2px 0 var(--bsh);
  display:flex; flex-direction:column;
  opacity:0; pointer-events:none; transform:translateY(-4px); transform-origin:top right;
  transition:opacity .15s ease, transform .15s ease;
}
.nav-overlay.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
.nav-overlay a{
  font-family:'DotGothic16',monospace; font-size:10px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:#000; text-decoration:none; padding:8px 12px 8px 8px;
  display:flex; align-items:center;
}
.nav-overlay a::before{ content:'/'; margin-right:7px; }
.nav-overlay a:hover{ background:var(--desk); color:var(--ttxt); }
.nav-overlay a+a{ border-top:1px solid #7a7068; }
.nav-overlay a.current{ background:#c8c2ba; }

/* ── Filter dropdown ── */
.filter-dropdown{
  position:absolute; top:calc(100% + 4px); left:4px; z-index:600; min-width:140px; padding:2px;
  background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:2px 2px 0 var(--bsh);
  display:flex; flex-direction:column;
  opacity:0; pointer-events:none; transform:translateY(-4px); transform-origin:top left;
  transition:opacity .15s ease, transform .15s ease;
}
.filter-dropdown.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
.filter-dropdown button{
  font-family:'DotGothic16',monospace; font-size:10px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:#000; background:none; border:none; cursor:pointer;
  text-align:left; padding:8px 12px 8px 8px; display:flex; align-items:center;
}
.filter-dropdown button::before{ content:'/'; margin-right:7px; opacity:.6; }
.filter-dropdown button:hover{ background:var(--desk); color:var(--ttxt); }
.filter-dropdown button+button{ border-top:1px solid #7a7068; }
.filter-dropdown button.active{ background:#c8c2ba; }

/* ── Cart dropdown ── */
.cart-dropdown{
  position:absolute; top:calc(100% + 4px); right:4px; z-index:600; width:min(280px,86vw); padding:2px;
  background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:2px 2px 0 var(--bsh);
  opacity:0; pointer-events:none; transform:translateY(-4px); transform-origin:top right;
  transition:opacity .15s ease, transform .15s ease;
}
.cart-dropdown.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
.cart-list{ max-height:240px; overflow-y:auto; }
.cart-empty{
  font-family:'DotGothic16',monospace; font-size:10px; letter-spacing:.08em; color:#1e1a12;
  opacity:.55; padding:14px 10px; text-align:center;
}
.cart-row{ display:flex; align-items:center; gap:8px; padding:8px 8px; border-top:1px solid #7a7068; }
.cart-row:first-child{ border-top:none; }
.cart-row-name{ flex:1; font-family:'DotGothic16',monospace; font-size:9px; letter-spacing:.06em; color:#1e1a12; line-height:1.3; }
.cart-row-name small{ display:block; font-size:8px; opacity:.55; letter-spacing:.1em; text-transform:uppercase; margin-top:2px; }
.cart-row-price{ font-family:'Fixedsys',monospace; font-size:11px; color:#3d3020; flex-shrink:0; }
.cart-row-x{
  width:16px; height:16px; flex-shrink:0; cursor:pointer; background:none; border:none;
  font-family:'DotGothic16',monospace; font-size:11px; color:#1e1a12; opacity:.5;
}
.cart-row-x:hover{ opacity:1; }
.cart-foot{
  border-top:1px solid var(--bdk); padding:10px 10px; display:flex; flex-direction:column; gap:8px;
}
.cart-total{ display:flex; justify-content:space-between; font-family:'Fixedsys',monospace; font-size:11px; color:#1e1a12; }
.cart-checkout-btn{
  height:30px; background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:inset 1px 1px 0 var(--blt);
  font-family:'Alkhemikal',serif; font-size:15px; letter-spacing:.04em; color:#1e1a12; cursor:pointer;
}

/* ── Win95 окно ── */
.win{ display:flex; flex-direction:column; overflow:hidden;
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:2px 2px 0 var(--bsh);
}
.tbar{ height:22px; background:var(--btn); display:flex; align-items:stretch; padding:1px; flex-shrink:0; user-select:none; }
.tbar-inner{ flex:1; background:var(--tb); display:flex; align-items:center; padding:0 1px 0 6px; gap:2px; overflow:hidden; min-width:0; }
.tbar-t{ flex:1; font-size:8px; font-weight:700; letter-spacing:.12em; color:var(--ttxt); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; line-height:1; }
.tbbtns{ display:flex; gap:1px; flex-shrink:0; align-items:stretch; }
.tbbtn{ width:16px; height:16px; background:var(--btn);
  border-top:1px solid var(--blt); border-left:1px solid var(--blt);
  border-right:1px solid var(--bdk); border-bottom:1px solid var(--bdk);
  display:flex; align-items:center; justify-content:center; cursor:default; flex-shrink:0; padding:0; line-height:0;
}

/* ══════════════ MAIN / GRID ══════════════ */
main{ min-height:100vh; padding:calc(var(--header-total-h) + 20px) 16px 80px; display:flex; flex-direction:column; align-items:center; }

.product-grid{
  width:100%; max-width:900px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,240px));
  justify-content:center; gap:20px;
}

/* ── PRODUCT CARD ── */
.product-card{
  display:flex; flex-direction:column; cursor:pointer;
  opacity:0; transform:translateY(14px);
  transition:opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
}
.product-card.visible{ opacity:1; transform:none; }

/* Рамка вокруг фото — без тайтлбара */
.product-img-win{
  background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:2px 2px 0 var(--bsh);
  overflow:hidden; transition:box-shadow .15s;
}
.product-card:hover .product-img-win{ box-shadow:3px 3px 0 #1a1510; }

.product-img-wrap{ position:relative; overflow:hidden; background:#2a2218; aspect-ratio:1/1; }
.product-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s cubic-bezier(.16,1,.3,1); filter:saturate(.9); }
.product-card:hover .product-img-wrap img{ transform:scale(1.03); }

.product-sold-overlay{ position:absolute; inset:0; background:rgba(14,12,10,.72); display:flex; align-items:center; justify-content:center; pointer-events:none; }
.product-sold-label{ font-family:'DotGothic16',monospace; font-size:8px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(214,213,169,.6); border:1px solid rgba(214,213,169,.2); padding:4px 10px; }

/* Свотчи внутри фото */
.swatch-overlay{
  position:absolute; bottom:0; left:0; right:0;
  padding:20px 8px 8px;
  background:linear-gradient(transparent, rgba(10,8,6,.65));
  display:flex; gap:5px; align-items:flex-end; justify-content:flex-end;
}
.swatch{
  width:13px; height:13px; flex-shrink:0; cursor:pointer; padding:0;
  border-top:1px solid rgba(255,255,255,.28);
  border-left:1px solid rgba(255,255,255,.28);
  border-right:1px solid rgba(0,0,0,.5);
  border-bottom:1px solid rgba(0,0,0,.5);
}
.swatch.active{ outline:1.5px solid var(--ta); outline-offset:2px; }

/* Кнопка-подпись — точно как .tbtn из шапки */
.product-action-btn{
  margin-top:5px;
  display:flex; align-items:center; gap:6px;
  padding:0 10px;
  height:34px;
  font-family:'DotGothic16',monospace; font-size:9px; font-weight:700;
  letter-spacing:.10em; text-transform:uppercase; color:#000;
  background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:inset 1px 1px 0 var(--blt), inset -1px -1px 0 #7a7068;
  cursor:pointer; user-select:none; width:100%; text-align:left;
}
.product-action-btn:active{
  border-top:2px solid var(--bdk); border-left:2px solid var(--bdk);
  border-right:2px solid var(--blt); border-bottom:2px solid var(--blt);
  box-shadow:inset 1px 1px 0 #7a7068;
  padding-top:2px; padding-left:12px;
}
.product-action-btn:disabled{ opacity:.45; pointer-events:none; }
.btn-name{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:'Alkhemikal',serif; font-size:15px; letter-spacing:.03em; text-transform:none; font-weight:400; }
.btn-price{ font-family:'Fixedsys',monospace; font-size:11px; letter-spacing:.02em; color:#3d3020; flex-shrink:0; }
.btn-sep{ width:1px; height:14px; background:#808080; opacity:.5; flex-shrink:0; }

/* ══════════════ PRODUCT MODAL ══════════════ */
.modal-overlay{
  display:none; position:fixed; inset:0; z-index:8500; background:rgba(14,12,10,.88);
  align-items:center; justify-content:center; padding:16px;
}
.modal-overlay.show{ display:flex; }
.modal-win{ width:min(480px,94vw); max-height:90vh; }
.modal-body{ background:var(--btn); display:flex; flex-direction:column; max-height:calc(90vh - 22px); overflow-y:auto; }

.pm-gallery{ position:relative; background:#2a2218; aspect-ratio:1/1; flex-shrink:0; }
.pm-gallery img{ width:100%; height:100%; object-fit:cover; display:block; }
.pm-arrow{
  position:absolute; top:50%; transform:translateY(-50%); width:26px; height:26px;
  display:flex; align-items:center; justify-content:center;
  background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:inset 1px 1px 0 var(--blt);
  font-family:'DotGothic16',monospace; font-size:11px; color:#1e1a12; cursor:pointer; user-select:none;
}
.pm-prev{ left:8px; } .pm-next{ right:8px; }
.pm-dots{ position:absolute; bottom:8px; left:0; right:0; display:flex; justify-content:center; gap:5px; }
.pm-dot{ width:5px; height:5px; background:#f6f1da; opacity:.35; }
.pm-dot.active{ opacity:.95; }

.pm-info{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; }
.pm-info-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.pm-info-name{ font-family:'Alkhemikal',serif; font-size:22px; color:#1e1a12; }
.pm-info-price{ font-family:'Fixedsys',monospace; font-size:13px; color:#3d3020; flex-shrink:0; }
.pm-info-text{ font-family:'DotGothic16',monospace; font-size:9px; letter-spacing:.05em; color:#1e1a12; opacity:.6; line-height:1.6; }
.pm-swatch-row{ display:flex; gap:6px; }
.pm-actions{ display:flex; gap:8px; margin-top:4px; }
.pm-btn{
  flex:1; height:32px; background:var(--btn);
  border-top:2px solid var(--blt); border-left:2px solid var(--blt);
  border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk);
  box-shadow:inset 1px 1px 0 var(--blt);
  font-family:'DotGothic16',monospace; font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:#1e1a12; cursor:pointer;
}
.pm-btn-primary{ font-family:'Alkhemikal',serif; font-size:14px; letter-spacing:.04em; text-transform:none; font-weight:400; }
.pm-btn:disabled{ opacity:.4; pointer-events:none; }

/* Свотчи в модале — те же что в шапке, но внутри модала */
.pm-swatch{
  width:15px; height:15px; flex-shrink:0; cursor:pointer; padding:0;
  border-top:1px solid var(--blt); border-left:1px solid var(--blt);
  border-right:1px solid var(--bdk); border-bottom:1px solid var(--bdk);
}
.pm-swatch.active{ outline:2px solid var(--text); outline-offset:1px; }

/* ══════════════ Mobile ══════════════ */
@media(max-width:680px){
  main{ padding-top:calc(var(--header-total-h) + 14px); }
  .product-grid{ grid-template-columns:repeat(auto-fit,minmax(140px,160px)); justify-content:center; gap:10px; }
}
</style>
</head>
<body>

<canvas id="grain"></canvas>

<!-- ══════════════ HEADER ══════════════ -->
<header id="siteHeader">
  <div class="header-safe"></div>
  <div class="header-strip">
    <span class="header-strip-text">noeasy.xyz/shop</span>
  </div>
  <div class="header-toolbar">
    <div style="position:relative;height:100%;display:flex;align-items:center;">
      <button class="tbtn" id="filterBtn">Filter<span class="tdot" id="filterDot"></span></button>
      <div class="filter-dropdown" id="filterDropdown"></div>
    </div>
    <div class="tdiv"></div>

    <span class="toolbar-center"><span class="toolbar-title">Shop</span><span class="toolbar-sub" id="prodCount"></span></span>
    <div class="toolbar-spacer"></div>

    <div style="position:relative;height:100%;display:flex;align-items:center;">
      <button class="tbtn cart-btn" id="cartBtn">
        <svg width="12" height="11" viewBox="0 0 12 11" style="flex-shrink:0;shape-rendering:crispEdges">
          <rect x="1" y="3" width="1" height="6" fill="#000"/>
          <rect x="10" y="3" width="1" height="6" fill="#000"/>
          <rect x="1" y="8" width="10" height="1" fill="#000"/>
          <rect x="2" y="3" width="8" height="1" fill="#000"/>
          <rect x="3" y="0" width="1" height="3" fill="#000"/>
          <rect x="8" y="0" width="1" height="3" fill="#000"/>
        </svg>
        Cart<span class="cart-count" id="cartCount">0</span>
      </button>
      <div class="cart-dropdown" id="cartDropdown">
        <div class="cart-list" id="cartList"></div>
        <div class="cart-foot">
          <div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
          <button class="cart-checkout-btn" id="cartCheckoutBtn">Checkout →</button>
        </div>
      </div>
    </div>
    <div class="tdiv"></div>

    <div class="burger-wrap">
      <button class="sword-btn" id="swordBtn" aria-label="Menu">
        <span class="line"></span><span class="line"></span><span class="line"></span>
      </button>
      <div class="nav-overlay" id="navOverlay">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/gallery/">Gallery</a>
        <a href="/links/">Links</a>
        <a href="/shop/" class="current">Shop</a>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="product-grid" id="productGrid"></div>
</main>

<!-- ══════════════ PRODUCT MODAL ══════════════ -->
<div class="modal-overlay" id="productModal">
  <div class="win modal-win">
    <div class="tbar">
      <div class="tbar-inner">
        <div class="tbar-t" id="pmTitleBar">PRODUCT.EXE</div>
        <div class="tbbtns" id="pmBtns"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="pm-gallery">
        <img id="pmImg" src="" alt="">
        <button class="pm-arrow pm-prev" id="pmPrev">←</button>
        <button class="pm-arrow pm-next" id="pmNext">→</button>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());

// ── Grain ──
const grain = document.getElementById('grain');
const gc = grain.getContext('2d');
let gw, gh;
function resizeGrain() { gw = grain.width = window.innerWidth+20; gh = grain.height = window.innerHeight+120; }
resizeGrain();
window.addEventListener('resize', resizeGrain);
(function tick() {
  const img = gc.createImageData(gw, gh);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random()*255|0;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3]=Math.random()*22|0;
  }
  gc.putImageData(img,0,0);
  requestAnimationFrame(tick);
})();

// ── Cross icon for window buttons ──
function crossSVG(size){
  size = size || 8;
  return `<svg width="${size}" height="${size}" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;image-rendering:pixelated;shape-rendering:crispEdges"><rect x="4" y="0" width="2" height="10" fill="#1a1612"/><rect x="3" y="1" width="4" height="1" fill="#1a1612"/><rect x="3" y="8" width="4" height="1" fill="#1a1612"/><rect x="2" y="0" width="6" height="1" fill="#1a1612"/><rect x="2" y="9" width="6" height="1" fill="#1a1612"/><rect x="0" y="4" width="10" height="2" fill="#1a1612"/><rect x="1" y="3" width="1" height="4" fill="#1a1612"/><rect x="8" y="3" width="1" height="4" fill="#1a1612"/><rect x="0" y="2" width="1" height="6" fill="#1a1612"/><rect x="9" y="2" width="1" height="6" fill="#1a1612"/></svg>`;
}
function makeBtns(el) {
  if (!el || el.dataset.filled) return;
  el.dataset.filled = '1';
  ['Minimize','Maximize','Close'].forEach(t => {
    const b = document.createElement('div');
    b.className='tbbtn'; b.title=t; b.innerHTML=crossSVG(10);
    el.appendChild(b);
  });
}
['pmBtns','checkoutBtns'].forEach(id => makeBtns(document.getElementById(id)));

// ════════════════════ STATE ════════════════════
let activeCategory = 'all';
let cart = [];

function fmtPrice(p){ return p === null ? 'TBA' : '$' + p; }

// ════════════════════ FILTER ════════════════════
const filterBtn = document.getElementById('filterBtn');
const filterDropdown = document.getElementById('filterDropdown');
const filterDot = document.getElementById('filterDot');

function buildFilter(){
  const cats = ['all', ...new Set(PRODUCTS.map(p => p.category))];
  const labels = { all:'All', hoodies:'Hoodies', tees:'Tees', bottoms:'Bottoms', accessories:'Accessories', 'coming-soon':'Coming Soon' };
  filterDropdown.innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = labels[c] || c;
    b.className = c === activeCategory ? 'active' : '';
    b.addEventListener('click', () => {
      activeCategory = c;
      filterDot.classList.toggle('on', activeCategory !== 'all');
      closeFilter();
      renderGrid();
    });
    filterDropdown.appendChild(b);
  });
}
function toggleFilter(){
  const open = filterDropdown.classList.toggle('open');
  filterBtn.classList.toggle('open', open);
  closeCart();
}
function closeFilter(){ filterDropdown.classList.remove('open'); filterBtn.classList.remove('open'); }
filterBtn.addEventListener('click', e => { e.stopPropagation(); toggleFilter(); });

// ════════════════════ CART ════════════════════
const cartBtn = document.getElementById('cartBtn');
const cartDropdown = document.getElementById('cartDropdown');
const cartCount = document.getElementById('cartCount');
const cartList = document.getElementById('cartList');
const cartTotal = document.getElementById('cartTotal');

function addToCart(product, colorIdx){
  const color = product.colors[colorIdx];
  const existing = cart.find(it => it.productId === product.id && it.color === color.name);
  if (existing) existing.qty++;
  else cart.push({ productId:product.id, title:product.title, color:color.name, price:product.price, qty:1 });
  renderCart();
}
function removeFromCart(idx){ cart.splice(idx,1); renderCart(); }

function renderCart(){
  const totalQty = cart.reduce((s,i)=>s+i.qty,0);
  cartCount.textContent = totalQty;
  cartList.innerHTML = '';
  if (!cart.length){
    cartList.innerHTML = '<div class="cart-empty">Cart is empty</div>';
  } else {
    cart.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'cart-row';
      row.innerHTML = `
        <div class="cart-row-name">${item.title}<small>${item.color} · ×${item.qty}</small></div>
        <div class="cart-row-price">${fmtPrice(item.price)}</div>
        <button class="cart-row-x" title="Remove">×</button>
      `;
      row.querySelector('.cart-row-x').addEventListener('click', () => removeFromCart(idx));
      cartList.appendChild(row);
    });
  }
  const total = cart.reduce((s,i)=> s + (i.price||0)*i.qty, 0);
  cartTotal.textContent = '$' + total;
}
function toggleCart(){
  const open = cartDropdown.classList.toggle('open');
  cartBtn.classList.toggle('open', open);
  closeFilter();
}
function closeCart(){ cartDropdown.classList.remove('open'); cartBtn.classList.remove('open'); }
cartBtn.addEventListener('click', e => { e.stopPropagation(); toggleCart(); });

document.getElementById('cartCheckoutBtn').addEventListener('click', () => {
  if (!cart.length) return;
  closeCart();
  const total = cart.reduce((s,i)=> s + (i.price||0)*i.qty, 0);
  const summary = cart.length === 1 ? `${cart[0].title} — ${cart[0].color}` : `Cart — ${cart.length} items`;
  openCheckout(summary, total);
});

document.addEventListener('click', e => {
  if (!filterDropdown.contains(e.target) && e.target !== filterBtn) closeFilter();
  if (!cartDropdown.contains(e.target) && e.target !== cartBtn && !cartBtn.contains(e.target)) closeCart();
});

// ════════════════════ BURGER MENU ════════════════════
const swordBtn = document.getElementById('swordBtn');
const navOverlay = document.getElementById('navOverlay');
swordBtn.addEventListener('click', e => {
  e.stopPropagation();
  swordBtn.classList.toggle('open');
  navOverlay.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!navOverlay.contains(e.target) && e.target !== swordBtn) {
    swordBtn.classList.remove('open');
    navOverlay.classList.remove('open');
  }
});

// ════════════════════ GRID RENDER ════════════════════
const grid = document.getElementById('productGrid');
const prodCount = document.getElementById('prodCount');

function renderGrid(){
  grid.innerHTML = '';
  const list = PRODUCTS.filter(p => activeCategory === 'all' || p.category === activeCategory);
  prodCount.textContent = list.length + (list.length === 1 ? ' item' : ' items');

  list.forEach((p, i) => {
    const colorIdx = selectedColor[p.id] || 0;
    const card = document.createElement('div');
    card.className = 'product-card';

    // Рамка с фото (без тайтлбара)
    const imgWin = document.createElement('div');
    imgWin.className = 'product-img-win';

    const imgWrap = document.createElement('div');
    imgWrap.className = 'product-img-wrap';
    imgWrap.innerHTML = `<img src="${p.colors[colorIdx].gallery[0]}" alt="${p.title} — ${p.colors[colorIdx].name}">`;

    // Sold out overlay
    if (p.soldOut) {
      const sol = document.createElement('div');
      sol.className = 'product-sold-overlay';
      sol.innerHTML = `<div class="product-sold-label">${p.category === 'coming-soon' ? 'NOT YET' : 'SOLD OUT'}</div>`;
      imgWrap.appendChild(sol);
    }

    // Свотчи внутри фото (только если >1 цвета)
    if (p.colors.length > 1) {
      const swOverlay = document.createElement('div');
      swOverlay.className = 'swatch-overlay';
      p.colors.forEach((c, ci) => {
        const sw = document.createElement('button');
        sw.className = 'swatch' + (ci === colorIdx ? ' active' : '');
        sw.style.background = c.swatch;
        sw.title = c.name;
        sw.addEventListener('click', e => {
          e.stopPropagation();
          selectedColor[p.id] = ci;
          // Обновляем только эту карточку — без перерисовки грида
          const img = imgWrap.querySelector('img');
          img.src = p.colors[ci].gallery[0];
          img.alt = p.title + ' — ' + p.colors[ci].name;
          swOverlay.querySelectorAll('.swatch').forEach((s, si) => {
            s.classList.toggle('active', si === ci);
          });
        });
        swOverlay.appendChild(sw);
      });
      imgWrap.appendChild(swOverlay);
    }

    imgWin.appendChild(imgWrap);
    card.appendChild(imgWin);

    // Кнопка-подпись (стиль .tbtn из шапки)
    const actionBtn = document.createElement('button');
    actionBtn.className = 'product-action-btn';
    if (p.soldOut) actionBtn.disabled = true;
    actionBtn.innerHTML = `
      <span class="btn-name">${p.title}</span>
      <span class="btn-sep"></span>
      <span class="btn-price">${fmtPrice(p.price)}</span>
    `;
    actionBtn.addEventListener('click', e => { e.stopPropagation(); openProduct(p.id); });
    card.appendChild(actionBtn);

    // Клик по фото тоже открывает модал
    imgWin.addEventListener('click', () => { if (!p.soldOut) openProduct(p.id); });

    grid.appendChild(card);
    requestAnimationFrame(() => setTimeout(() => card.classList.add('visible'), 60 + i*70));
  });
}

// ════════════════════ PRODUCT MODAL ════════════════════
const productModal = document.getElementById('productModal');
const pmImg = document.getElementById('pmImg');
const pmTitleBar = document.getElementById('pmTitleBar');
const pmName = document.getElementById('pmName');
const pmPrice = document.getElementById('pmPrice');
const pmDots = document.getElementById('pmDots');
const pmSwatches = document.getElementById('pmSwatches');
const pmAddCart = document.getElementById('pmAddCart');
const pmBuyNow = document.getElementById('pmBuyNow');

let pmProduct = null, pmColorIdx = 0, pmSlide = 0;

function openProduct(id){
  pmProduct = PRODUCTS.find(p => p.id === id);
  pmColorIdx = selectedColor[id] || 0;
  pmSlide = 0;
  renderProductModal();
  productModal.classList.add('show');
}
function closeProductModal(){ productModal.classList.remove('show'); }

function renderProductModal(){
  const color = pmProduct.colors[pmColorIdx];
  pmTitleBar.textContent = (pmProduct.title + ' — ' + color.name).toUpperCase() + '.EXE';
  pmName.textContent = pmProduct.title;
  pmPrice.textContent = fmtPrice(pmProduct.price);
  pmImg.src = color.gallery[pmSlide];
  pmImg.alt = pmProduct.title + ' — ' + color.name;

  pmDots.innerHTML = '';
  color.gallery.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'pm-dot' + (i === pmSlide ? ' active' : '');
    pmDots.appendChild(d);
  });

  pmSwatches.innerHTML = '';
  if (pmProduct.colors.length > 1){
    pmProduct.colors.forEach((c, ci) => {
      const sw = document.createElement('button');
      sw.className = 'pm-swatch' + (ci === pmColorIdx ? ' active' : '');
      sw.style.background = c.swatch;
      sw.title = c.name;
      sw.addEventListener('click', () => {
        pmColorIdx = ci; pmSlide = 0;
        selectedColor[pmProduct.id] = ci;
        renderProductModal();
      });
      pmSwatches.appendChild(sw);
    });
  }

  const disabled = pmProduct.soldOut;
  pmAddCart.disabled = disabled;
  pmBuyNow.disabled = disabled;
  pmAddCart.textContent = disabled ? 'Unavailable' : 'Add to Cart';
  pmBuyNow.textContent = disabled ? 'Coming Soon' : 'Purchase — Pay Crypto →';
}

document.getElementById('pmPrev').addEventListener('click', () => {
  const g = pmProduct.colors[pmColorIdx].gallery;
  pmSlide = (pmSlide - 1 + g.length) % g.length;
  renderProductModal();
});
document.getElementById('pmNext').addEventListener('click', () => {
  const g = pmProduct.colors[pmColorIdx].gallery;
  pmSlide = (pmSlide + 1) % g.length;
  renderProductModal();
});
pmAddCart.addEventListener('click', () => { addToCart(pmProduct, pmColorIdx); });
pmBuyNow.addEventListener('click', () => {
  closeProductModal();
  openCheckout(pmProduct.title + ' — ' + pmProduct.colors[pmColorIdx].name, pmProduct.price);
});
productModal.addEventListener('click', e => { if (e.target === productModal) closeProductModal(); });

// ════════════════════ CHECKOUT ════════════════════
const SIZES = ['XS','S','M','L','XL','XXL'];
let selectedSize = null;

function buildSizes() {
  const container = document.getElementById('sizeButtons');
  container.innerHTML = '';
  SIZES.forEach(sz => {
    const btn = document.createElement('button');
    btn.textContent = sz;
    btn.dataset.size = sz;
    btn.style.cssText = `
      height:30px;padding:0 12px;
      background:#AFA191;
      border-top:2px solid #d4cdc4;border-left:2px solid #d4cdc4;
      border-right:2px solid #3d3830;border-bottom:2px solid #3d3830;
      box-shadow:inset 1px 1px 0 #d4cdc4;
      font-family:'DotGothic16',monospace;font-size:9px;font-weight:700;
      letter-spacing:.1em;cursor:pointer;color:#1e1a12;
      transition:none;
    `;
    btn.addEventListener('click', () => {
      selectedSize = sz;
      container.querySelectorAll('button').forEach(b => {
        const active = b.dataset.size === sz;
        b.style.background = active ? '#5D5143' : '#AFA191';
        b.style.color = active ? '#f6f1da' : '#1e1a12';
        b.style.borderTopColor = active ? '#3d3830' : '#d4cdc4';
        b.style.borderLeftColor = active ? '#3d3830' : '#d4cdc4';
        b.style.borderRightColor = active ? '#d4cdc4' : '#3d3830';
        b.style.borderBottomColor = active ? '#d4cdc4' : '#3d3830';
        b.style.boxShadow = active ? 'inset 1px 1px 0 #7a7068' : 'inset 1px 1px 0 #d4cdc4';
      });
    });
    container.appendChild(btn);
  });
}

function openCheckout(productName, price) {
  selectedSize = null;
  buildSizes();
  document.getElementById('checkoutProduct').textContent = productName;
  document.getElementById('checkoutPrice').textContent = (price===null ? 'TBA' : '$' + price + ' ≈ USDT');
  document.getElementById('checkoutTitle').textContent = 'CHECKOUT.EXE — ' + productName.toUpperCase();
  document.getElementById('checkoutEmail').value = '';
  document.getElementById('checkoutAddress').value = '';
  document.getElementById('checkoutOverlay').style.display = 'flex';
}
function closeCheckout() { document.getElementById('checkoutOverlay').style.display = 'none'; }
function proceedToPayment() {
  const email = document.getElementById('checkoutEmail').value.trim();
  const address = document.getElementById('checkoutAddress').value.trim();
  if (!selectedSize) { alert('Please select a size'); return; }
  if (!email) { alert('Please enter your email'); return; }
  if (!address) { alert('Please enter your shipping address'); return; }
  // TODO: POST to Railway backend → NOWPayments
  alert('Proceeding to crypto payment...\n\nThis will connect to NOWPayments in production.');
}
document.getElementById('checkoutOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('checkoutOverlay')) closeCheckout();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCheckout(); closeProductModal(); }
});

// ════════════════════ INIT ════════════════════
buildFilter();
