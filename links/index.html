<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../assets/icon.png">
<link rel="apple-touch-icon" href="../assets/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5D5143">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Links | NOEASY</title>
<style>
@font-face { font-family:'Mekzantine'; src:url('../fonts/MEKZANTINE-Regular.otf') format('opentype'); font-display:swap; }
@font-face { font-family:'DotGothic16'; src:url('../fonts/DotGothic16-Regular.ttf') format('truetype'); font-display:swap; }

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:#e8e0c4; --text:#353535; --desk:#5D5143;
  --btn:#AFA191; --blt:#d4cdc4; --bdk:#3d3830; --bsh:rgba(0,0,0,.45);
  --ttxt:#f6f1da; --tdim:#7a6a52;
  --header-titlebar-h:22px; --header-pill-h:44px;
  --header-total-h:calc(env(safe-area-inset-top,0px) + var(--header-titlebar-h) + var(--header-pill-h));
}

html { background:#5D5143; }
body::before { content:''; position:fixed; top:-100vh; left:0; right:0; height:100vh; background:#5D5143; z-index:9001; pointer-events:none; }
body { background:var(--bg); font-family:'DotGothic16',monospace; color:var(--text); overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
#grain { position:fixed; top:-60px; bottom:-60px; left:-10px; right:-10px; z-index:15; pointer-events:none; }

/* ── Header ── */
header { position:fixed; top:0; left:0; z-index:500; width:100vw; display:flex; flex-direction:column; pointer-events:none; opacity:0; transition:opacity .7s ease; background:var(--desk); }
header.visible { opacity:1; }
header > * { pointer-events:auto; }
.header-safe-top { height:env(safe-area-inset-top,0px); background:var(--desk); }
.header-titlebar-strip { width:100%; height:var(--header-titlebar-h); background:#5D5143; display:flex; align-items:center; padding:0 8px; border-bottom:1px solid #3e352d; }
.header-titlebar-strip-text { font-family:'DotGothic16',monospace; font-size:9px; font-weight:700; letter-spacing:.14em; color:var(--ttxt); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-pill { display:flex; align-items:center; position:relative; width:100%; height:var(--header-pill-h); background:var(--btn); border-top:1px solid var(--blt); border-bottom:2px solid #7a7068; box-shadow:0 1px 0 #404040; padding:0 4px; overflow:visible; }
.pill-divider { width:2px; height:26px; background:#808080; border-right:1px solid var(--blt); margin:0 2px; flex-shrink:0; }
.pill-center { position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; white-space:nowrap; }
.pill-section { font-family:'Mekzantine',serif; font-size:14px; letter-spacing:.08em; color:#000; opacity:.9; }
.sword-btn { height:calc(100% - 10px); padding:0 12px; margin:0 2px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; background:var(--btn); border-top:2px solid var(--blt); border-left:2px solid var(--blt); border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk); box-shadow:inset 1px 1px 0 var(--blt),inset -1px -1px 0 #7a7068; cursor:pointer; flex-shrink:0; overflow:visible; }
.sword-btn:active,.sword-btn.open { border-top:2px solid var(--bdk); border-left:2px solid var(--bdk); border-right:2px solid var(--blt); border-bottom:2px solid var(--blt); box-shadow:inset 1px 1px 0 #7a7068; }
.sword-btn .line { position:relative; height:2px; background:#1e1a12; opacity:.85; transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .2s,width .35s cubic-bezier(.16,1,.3,1); display:block; }
.sword-btn .line:nth-child(1) { width:20px; }
.sword-btn .line:nth-child(2) { width:14px; align-self:flex-start; }
.sword-btn .line:nth-child(3) { width:20px; }
.sword-btn.open .line { opacity:1; }
.sword-btn.open .line:nth-child(1) { width:20px; transform:translateY(7px) rotate(45deg); }
.sword-btn.open .line:nth-child(2) { width:20px; opacity:0; transform:scaleX(0); }
.sword-btn.open .line:nth-child(3) { width:20px; transform:translateY(-7px) rotate(-45deg); }
.burger-wrap { position:relative; height:100%; display:flex; align-items:center; }
.nav-overlay { position:absolute; top:calc(100% + 4px); right:0; z-index:8999; min-width:160px; padding:2px; background:var(--btn); border-top:2px solid var(--blt); border-left:2px solid var(--blt); border-right:2px solid var(--bdk); border-bottom:2px solid var(--bdk); box-shadow:2px 2px 0 #2a2520; display:flex; flex-direction:column; opacity:0; pointer-events:none; transform:translateY(-4px); transition:opacity .15s,transform .15s; }
.nav-overlay.open { opacity:1; pointer-events:auto; transform:translateY(0); }
.nav-overlay a { font-family:'DotGothic16',monospace; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#000; text-decoration:none; padding:8px 12px 8px 8px; display:flex; align-items:center; }
.nav-overlay a::before { content:'/'; margin-right:7px; opacity:.5; }
.nav-overlay a:hover { background:#5D5143; color:var(--ttxt); }
.nav-overlay a + a { border-top:1px solid #7a7068; }
.nav-overlay a.current { background:#c8c2ba; }

/* ── Main layout ── */
main {
  min-height:100vh;
  padding:calc(var(--header-total-h) + 60px) 24px calc(env(safe-area-inset-bottom,0px) + 80px);
  display:flex; flex-direction:column; align-items:center;
}

/* ── Content ── */
.page-wrap {
  width:100%; max-width:440px;
  display:flex; flex-direction:column;
  gap:0;
}

/* ── Секция ── */
.section {
  padding:40px 0;
  border-bottom:1px solid rgba(53,53,53,.1);
  opacity:0; transform:translateY(20px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
}
.section:last-child { border-bottom:none; }
.section.visible { opacity:1; transform:none; }

.section-label {
  display:block;
  font-family:'DotGothic16',monospace;
  font-size:8px; font-weight:700;
  letter-spacing:.22em; text-transform:uppercase;
  color:var(--tdim); opacity:.7;
  margin-bottom:14px;
}

.section-title {
  display:block;
  font-family:'Mekzantine',serif;
  font-size:clamp(28px,7vw,38px);
  letter-spacing:.03em; line-height:1.05;
  color:#2a2118;
  margin-bottom:20px;
}

/* ── Ссылки внутри секции ── */
.links-list {
  display:flex; flex-direction:column; gap:0;
}

.link-row {
  display:flex; align-items:center;
  padding:10px 0;
  border-bottom:1px solid rgba(53,53,53,.07);
  text-decoration:none;
  color:#3d3020;
  gap:10px;
  transition:color .1s;
  -webkit-tap-highlight-color:transparent;
}
.link-row:last-child { border-bottom:none; }
.link-row:hover { color:#1e1a12; }
.link-row:hover .link-arrow { opacity:1; transform:translateX(2px); }

.link-name {
  font-family:'DotGothic16',monospace;
  font-size:11px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
  flex:1;
}

.link-arrow {
  font-size:10px; opacity:.3;
  transition:opacity .1s, transform .15s;
  flex-shrink:0;
}

/* ── Support кнопка — особая секция ── */
.section-support {
  padding:40px 0;
}
.support-link {
  display:inline-flex; align-items:center; gap:10px;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.support-link:hover .support-text { color:#1e1a12; }
.support-link:hover .support-arrow { opacity:.7; transform:translateX(3px); }

.support-text {
  font-family:'Mekzantine',serif;
  font-size:clamp(24px,6vw,32px);
  letter-spacing:.03em;
  color:#3d3020;
  transition:color .1s;
}
.support-arrow {
  font-family:'DotGothic16',monospace;
  font-size:10px; letter-spacing:.1em;
  color:var(--tdim); opacity:.4;
  transition:opacity .1s, transform .15s;
  padding-top:4px;
}

/* ── Форма — встроена в страницу без окна ── */
.form-section { padding:40px 0 0; }

.form-section-title {
  font-family:'Mekzantine',serif;
  font-size:clamp(28px,7vw,38px);
  letter-spacing:.03em;
  color:#2a2118; margin-bottom:24px;
}

.form-fields { display:flex; flex-direction:column; gap:14px; }

.field-label {
  display:block;
  font-family:'DotGothic16',monospace;
  font-size:8px; font-weight:700;
  letter-spacing:.20em; text-transform:uppercase;
  color:var(--tdim); margin-bottom:5px;
}

.field-input, .field-textarea {
  width:100%;
  background:#d8d0b8;
  color:#1e1a12;
  border:none;
  border-bottom:2px solid rgba(53,53,53,.25);
  padding:10px 0;
  font-family:'DotGothic16',monospace;
  font-size:11px; letter-spacing:.06em;
  outline:none; display:block;
  border-radius:0; -webkit-appearance:none; appearance:none;
  background:transparent;
  border-top:none; border-left:none; border-right:none;
}
.field-input:focus, .field-textarea:focus {
  border-bottom-color:rgba(53,53,53,.7);
}
.field-input::placeholder, .field-textarea::placeholder {
  color:var(--tdim); opacity:.5;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase;
}
.field-textarea { min-height:90px; resize:none; }

.form-footer { display:flex; align-items:center; justify-content:space-between; margin-top:24px; }

.submit-btn {
  font-family:'Mekzantine',serif;
  font-size:20px; letter-spacing:.04em;
  color:#2a2118; background:transparent;
  border:none; cursor:pointer; padding:0;
  display:inline-flex; align-items:center; gap:8px;
  transition:opacity .15s;
}
.submit-btn:active { opacity:.5; }
.submit-arrow { font-family:'DotGothic16',monospace; font-size:10px; color:var(--tdim); opacity:.5; padding-top:3px; }

.form-status {
  font-family:'DotGothic16',monospace;
  font-size:8px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--tdim); opacity:0; transition:opacity .4s;
}
.form-status.show { opacity:.7; }

@media (max-width:480px) {
  main { padding-top:calc(var(--header-total-h) + 40px); }
  .section { padding:32px 0; }
}
</style>
</head>
<body>

<canvas id="grain"></canvas>

<header id="siteHeader">
  <div class="header-safe-top"></div>
  <div class="header-inner">
    <div class="header-titlebar-strip">
      <span class="header-titlebar-strip-text">noeasy.xyz/links</span>
    </div>
    <div class="header-pill">
      <span class="pill-center"><span class="pill-section">Links</span></span>
      <div style="flex:1"></div>
      <div class="pill-divider"></div>
      <div class="burger-wrap">
        <button class="sword-btn" id="swordBtn" aria-label="Menu">
          <span class="line"></span><span class="line"></span><span class="line"></span>
        </button>
        <div class="nav-overlay" id="navOverlay">
          <a href="/">Home</a>
          <a href="/about/">About</a>
          <a href="/gallery/">Gallery</a>
          <a href="/links/" class="current">Links</a>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="page-wrap" id="pageWrap">

    <div class="section">
      <span class="section-label">01 — Social</span>
      <span class="section-title">Find Me</span>
      <div class="links-list">
        <a class="link-row" href="https://instagram.com/noeasyvision" target="_blank" rel="noopener">
          <span class="link-name">Instagram</span><span class="link-arrow">→</span>
        </a>
        <a class="link-row" href="https://x.com/noeasyvision" target="_blank" rel="noopener">
          <span class="link-name">X</span><span class="link-arrow">→</span>
        </a>
        <a class="link-row" href="https://t.me/noeasyeye" target="_blank" rel="noopener">
          <span class="link-name">Telegram</span><span class="link-arrow">→</span>
        </a>
      </div>
    </div>

    <div class="section">
      <span class="section-label">02 — Portfolio</span>
      <span class="section-title">See the Work</span>
      <div class="links-list">
        <a class="link-row" href="https://www.behance.net/noeasyvision" target="_blank" rel="noopener">
          <span class="link-name">Behance</span><span class="link-arrow">→</span>
        </a>
      </div>
    </div>

    <div class="section">
      <span class="section-label">03 — Prints</span>
      <span class="section-title">Own a Print</span>
      <div class="links-list">
        <a class="link-row" href="https://www.inprnt.com/profile/noeasy" target="_blank" rel="noopener">
          <span class="link-name">INPRNT</span><span class="link-arrow">→</span>
        </a>
      </div>
    </div>

    <div class="section">
      <span class="section-label">04 — Digital Collectibles</span>
      <span class="section-title">Collect</span>
      <div class="links-list">
        <a class="link-row" href="https://superrare.com/noeasy" target="_blank" rel="noopener">
          <span class="link-name">SuperRare</span><span class="link-arrow">→</span>
        </a>
        <a class="link-row" href="https://objkt.com/profile/noeasy" target="_blank" rel="noopener">
          <span class="link-name">Objkt</span><span class="link-arrow">→</span>
        </a>
      </div>
    </div>

    <div class="section section-support">
      <span class="section-label">05 — Support</span>
      <a class="support-link" href="https://buymeacoffee.com/noeasyvision" target="_blank" rel="noopener">
        <span class="support-text">Support the Work</span>
        <span class="support-arrow">→</span>
      </a>
    </div>

    <div class="section form-section">
      <span class="section-label">06 — Contact</span>
      <div class="form-section-title">Write to Me</div>
      <form id="contact-form" action="https://formspree.io/f/xqewvwkv" method="POST">
        <div class="form-fields">
          <div>
            <label class="field-label">Name</label>
            <input class="field-input" type="text" name="name" placeholder="Your name" required autocomplete="off">
          </div>
          <div>
            <label class="field-label">Email</label>
            <input class="field-input" type="email" name="email" placeholder="Your email" required autocomplete="off">
          </div>
          <div>
            <label class="field-label">Message</label>
            <textarea class="field-textarea" name="message" placeholder="Write something..." required></textarea>
          </div>
        </div>
        <div class="form-footer">
          <button class="submit-btn" type="submit">
            Send <span class="submit-arrow">→</span>
          </button>
          <div class="form-status" id="form-status"></div>
        </div>
      </form>
    </div>

  </div>
</main>

<script>
/* Grain */
(function(){
  const g=document.getElementById('grain'),ctx=g.getContext('2d');
  let w,h;
  function resize(){w=g.width=window.innerWidth+20;h=g.height=window.innerHeight+120;}
  resize(); window.addEventListener('resize',resize);
  (function tick(){
    const img=ctx.createImageData(w,h);
    for(let i=0;i<img.data.length;i+=4){const v=Math.random()*255|0;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=Math.random()*18|0;}
    ctx.putImageData(img,0,0);requestAnimationFrame(tick);
  })();
})();

/* Burger */
(function(){
  const btn=document.getElementById('swordBtn'),nav=document.getElementById('navOverlay');
  btn.addEventListener('click',e=>{e.stopPropagation();btn.classList.toggle('open');nav.classList.toggle('open');});
  document.addEventListener('click',e=>{if(!nav.contains(e.target)&&e.target!==btn){btn.classList.remove('open');nav.classList.remove('open');}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){btn.classList.remove('open');nav.classList.remove('open');}});
})();

/* Header reveal */
setTimeout(()=>document.getElementById('siteHeader').classList.add('visible'),80);

/* Section reveal on scroll */
const sections = document.querySelectorAll('.section');
const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
},{threshold:0.08,rootMargin:'0px 0px -40px 0px'});
sections.forEach((s,i)=>{
  s.style.transitionDelay = (i*0.06)+'s';
  obs.observe(s);
});

/* Form */
document.getElementById('contact-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.target,btn=form.querySelector('.submit-btn'),st=document.getElementById('form-status');
  btn.style.opacity='.3'; btn.style.pointerEvents='none';
  try{
    const r=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});
    st.textContent=r.ok?'Sent — talk soon':'Something went wrong';
    if(r.ok)form.reset();
  }catch{st.textContent='No connection';}
  st.classList.add('show');
  btn.style.opacity=''; btn.style.pointerEvents='';
});
</script>
</body>
</html>
