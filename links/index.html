<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5D5143">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Links | NOEASY</title>
<meta name="description" content="NOEASY — Instagram, X, Telegram, Behance, prints on INPRNT, collectibles on SuperRare and Objkt. Write to me.">
<style>
@font-face { font-family:'Mekzantine'; src:url('../fonts/MEKZANTINE-Regular.otf') format('opentype'); font-display:swap; }
@font-face { font-family:'DotGothic16'; src:url('../fonts/DotGothic16-Regular.ttf') format('truetype'); font-display:swap; }

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* Same chrome as Commissions: header, Explorer-style window, dialog. */
:root{
  --bg:#e8e0c4; --desk:#5D5143; --tb:#5D5143;
  --ttxt:#f6f1da; --btn:#AFA191; --blt:#d4cdc4; --bdk:#3d3830; --bsh:#2a2520;
  --ink:#1e1a12; --tdim:#7a6a52; --field:#c8c2b8; --red:#8b2020;
  --header-titlebar-h:22px; --header-pill-h:44px;
  --header-total-h:calc(env(safe-area-inset-top,0px) + var(--header-titlebar-h) + var(--header-pill-h));
}

html{background:#5D5143;}
body{min-height:100vh;font-family:'DotGothic16',monospace;background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;}
body::before{content:'';position:fixed;top:-100vh;left:0;right:0;height:100vh;background:#5D5143;z-index:9001;pointer-events:none;}
#grain{position:fixed;top:-60px;bottom:-60px;left:-10px;right:-10px;z-index:9998;pointer-events:none;}
::selection{background:var(--desk);color:var(--ttxt);}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px dotted var(--ink);outline-offset:2px;}

/* ══ HEADER (matches site) ══ */
header{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .7s ease;background:var(--desk);}
header.visible{opacity:1;}
header>*{pointer-events:auto;}
.header-safe-top{height:env(safe-area-inset-top,0px);background:var(--desk);}
.header-titlebar-strip{height:var(--header-titlebar-h);background:#5D5143;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid #3e352d;}
.header-titlebar-strip-text{font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--ttxt);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.strip-cursor{display:inline-block;width:5px;height:9px;background:var(--ttxt);margin-left:5px;vertical-align:baseline;animation:blink 1.15s steps(2,start) infinite;}
@keyframes blink{to{visibility:hidden;}}
.header-pill{display:flex;align-items:center;position:relative;height:var(--header-pill-h);background:var(--btn);border-top:1px solid var(--blt);border-bottom:2px solid #7a7068;box-shadow:0 1px 0 #404040;padding:0 4px;}
.pill-divider{width:2px;height:26px;background:#808080;border-right:1px solid var(--blt);margin:0 2px;flex-shrink:0;}
.pill-center{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;user-select:none;white-space:nowrap;}
.pill-section{font-family:'Mekzantine',serif;font-size:19px;letter-spacing:.08em;opacity:.9;color:#000;}
.sword-btn{height:calc(100% - 10px);padding:0 12px;margin:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--btn);border-top:2px solid var(--blt);border-left:2px solid var(--blt);border-right:2px solid var(--bdk);border-bottom:2px solid var(--bdk);box-shadow:inset 1px 1px 0 var(--blt),inset -1px -1px 0 #7a7068;cursor:pointer;flex-shrink:0;}
.sword-btn:active,.sword-btn.open{border-top:2px solid var(--bdk);border-left:2px solid var(--bdk);border-right:2px solid var(--blt);border-bottom:2px solid var(--blt);box-shadow:inset 1px 1px 0 #7a7068;}
.sword-btn .line{position:relative;height:2px;background:#000;opacity:.8;transition:transform .38s cubic-bezier(.16,1,.3,1),opacity .25s,width .38s cubic-bezier(.16,1,.3,1);width:18px;}
.sword-btn.open .line:nth-child(1){transform:translateY(6px) rotate(45deg);}
.sword-btn.open .line:nth-child(2){opacity:0;transform:scaleX(0);}
.sword-btn.open .line:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.burger-wrap{position:relative;height:100%;display:flex;align-items:center;}
.nav-overlay{position:absolute;top:calc(100% + 4px);right:0;z-index:8999;min-width:170px;padding:2px;background:var(--btn);border-top:2px solid var(--blt);border-left:2px solid var(--blt);border-right:2px solid var(--bdk);border-bottom:2px solid var(--bdk);box-shadow:2px 2px 0 var(--bsh);display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(-4px);transform-origin:top right;transition:opacity .15s,transform .15s;}
.nav-overlay.open{opacity:1;pointer-events:auto;transform:translateY(0);}
.nav-overlay a{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#000;text-decoration:none;padding:8px 12px 8px 8px;display:flex;align-items:center;}
.nav-overlay a::before{content:'/';margin-right:7px;opacity:.5;}
.nav-overlay a:hover{background:var(--desk);color:var(--ttxt);}
.nav-overlay a + a{border-top:1px solid #7a7068;}
.nav-overlay a.current{background:#c8c2ba;}

/* ══ WINDOW (as Commissions, without the address bar and status bar) ══ */
main{min-height:100vh;min-height:100dvh;padding:calc(var(--header-total-h) + 22px) 12px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;align-items:center;justify-content:center;}
.win{width:100%;max-width:460px;display:flex;flex-direction:column;border-top:2px solid var(--blt);border-left:2px solid var(--blt);border-right:2px solid var(--bdk);border-bottom:2px solid var(--bdk);opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);background:var(--btn);}
.win.visible{opacity:1;transform:none;}
.tbar{height:22px;background:var(--btn);display:flex;align-items:stretch;padding:1px;flex-shrink:0;user-select:none;}
.tbar-inner{flex:1;background:var(--tb);display:flex;align-items:center;padding:0 1px 0 6px;gap:2px;overflow:hidden;min-width:0;}
.tbar-t{flex:1;font-size:8px;font-weight:700;letter-spacing:.12em;color:var(--ttxt);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1;min-width:0;}
.tbbtns{display:flex;gap:1px;flex-shrink:0;align-items:center;}
.tbbtn{width:16px;height:16px;background:var(--btn);border-top:1px solid var(--blt);border-left:1px solid var(--blt);border-right:1px solid var(--bdk);border-bottom:1px solid var(--bdk);display:flex;align-items:center;justify-content:center;cursor:default;flex-shrink:0;padding:0;line-height:0;}
.con-body{padding:16px 16px 18px;border-top:2px solid #7a7068;}

/* ══ Flat link buttons ══ */
.links{display:flex;flex-direction:column;gap:6px;}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 14px;background:#bcb1a1;border:1px solid var(--desk);color:var(--ink);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;}
.lnk .t{font-family:'Mekzantine',serif;font-size:20px;letter-spacing:.03em;line-height:1.1;}
.lnk .s{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--tdim);white-space:nowrap;}
.lnk:active{background:var(--desk);color:var(--ttxt);}
.lnk:active .s{color:#cfc4a8;}
@media (hover:hover){.lnk:hover{background:var(--desk);color:var(--ttxt);}.lnk:hover .s{color:#cfc4a8;}}

/* ══ Write to me — right under the buttons ══ */
.write{margin:26px 0 0;padding:22px 0 0;border-top:1px solid #8a7e6f;box-shadow:inset 0 1px 0 var(--blt);scroll-margin-top:calc(var(--header-total-h) + 12px);}
.write-t{margin:0 0 16px;font-family:'Mekzantine',serif;font-weight:400;font-size:24px;letter-spacing:.03em;line-height:1.2;color:#2a2118;}
.f-label{display:block;font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--tdim);margin:0 0 4px;}
.f-input,.f-area{width:100%;display:block;background:var(--field);color:var(--ink);border-top:2px solid var(--bdk);border-left:2px solid var(--bdk);border-right:2px solid var(--blt);border-bottom:2px solid var(--blt);box-shadow:inset 1px 1px 0 #7a7068;padding:9px 10px;font-family:'DotGothic16',monospace;font-size:16px;letter-spacing:.03em;outline:none;border-radius:0;-webkit-appearance:none;appearance:none;margin:0 0 12px;}
.f-input:focus,.f-area:focus{background:#d4cec8;}
.f-area{min-height:110px;resize:vertical;}
/* Send — точно такая же кнопка, как ссылки; в правой подписи — «отправляю…» и ошибки */
button.lnk{width:100%;margin:4px 0 0;font:inherit;text-align:left;-webkit-appearance:none;appearance:none;border-radius:0;}
button.lnk[disabled]{opacity:.55;pointer-events:none;}
.lnk .s.err{color:var(--red);}
.lnk:active .s.err{color:#f0a08a;}
@media (hover:hover){.lnk:hover .s.err{color:#f0a08a;}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.sent{display:none;flex-direction:column;align-items:flex-start;gap:8px;padding:2px 0 4px;}
.sent .big{font-family:'Mekzantine',serif;font-size:24px;color:#2a2118;}
.sent .small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tdim);line-height:1.8;}

@media (max-width:400px){main{padding-left:6px;padding-right:6px;}.con-body{padding:12px 10px 14px;}.lnk{padding:0 12px;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important;}}
</style>
<!-- NOEASY visit counter (no cookies) + newsletter helper; the Mindgate bot publishes assets/door.js -->
<script src="/assets/door.js" defer></script>
</head>
<body>

<canvas id="grain"></canvas>
<header id="siteHeader">
  <div class="header-safe-top"></div>
  <div class="header-titlebar-strip">
    <span class="header-titlebar-strip-text">noeasy.xyz/links</span><span class="strip-cursor" aria-hidden="true"></span>
  </div>
  <div class="header-pill">
    <span class="pill-center"><span class="pill-section">Links</span></span>
    <div style="flex:1"></div>
    <div class="pill-divider"></div>
    <div class="burger-wrap">
      <button class="sword-btn" id="swordBtn" aria-label="Menu">
        <span class="line"></span><span class="line"></span><span class="line"></span>
      </button>
      <div class="nav-overlay" id="navOverlay">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/gallery/">Gallery</a>
        <a href="/links/" class="current">Links</a>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="win" id="exWin">
    <div class="tbar"><div class="tbar-inner"><div class="tbar-t">LINKS.EXE — NOEASY</div><div class="tbbtns" id="tbtns"></div></div></div>
    <div class="con-body">
      <nav class="links" aria-label="Links">
        <a class="lnk" href="https://instagram.com/noeasyvision" target="_blank" rel="noopener"><span class="t">Instagram</span><span class="s">@noeasyvision</span></a>
        <a class="lnk" href="https://x.com/noeasyvision" target="_blank" rel="noopener"><span class="t">X</span><span class="s">@noeasyvision</span></a>
        <a class="lnk" href="https://t.me/noeasyeye" target="_blank" rel="noopener"><span class="t">Telegram</span><span class="s">@noeasyeye</span></a>
        <a class="lnk" href="https://www.behance.net/noeasyvision" target="_blank" rel="noopener"><span class="t">Behance</span><span class="s">portfolio</span></a>
        <a class="lnk" href="https://www.inprnt.com/profile/noeasy" target="_blank" rel="noopener"><span class="t">INPRNT</span><span class="s">prints</span></a>
        <a class="lnk" href="https://superrare.com/noeasy" target="_blank" rel="noopener"><span class="t">SuperRare</span><span class="s">collect</span></a>
        <a class="lnk" href="https://objkt.com/profile/noeasy" target="_blank" rel="noopener"><span class="t">Objkt</span><span class="s">collect</span></a>
        <a class="lnk" href="https://buymeacoffee.com/noeasyvision" target="_blank" rel="noopener"><span class="t">Support the Work</span><span class="s">buy me a coffee</span></a>
      </nav>

      <section class="write" id="write" aria-labelledby="writeT">
        <h2 class="write-t" id="writeT">Write to me</h2>
        <form id="msgForm" action="https://formspree.io/f/xqewvwkv" method="POST" novalidate>
          <input type="hidden" name="_subject" value="Message from noeasy.xyz/links">
          <label class="f-label" for="mName">Name</label>
          <input class="f-input" id="mName" type="text" name="name" required autocomplete="name">
          <label class="f-label" for="mMail">Email</label>
          <input class="f-input" id="mMail" type="email" name="email" required autocomplete="email">
          <label class="f-label" for="mMsg">Message</label>
          <textarea class="f-area" id="mMsg" name="message" required></textarea>
          <button class="lnk" type="submit" id="sendBtn"><span class="t">Send</span><span class="s" id="sendHint" aria-hidden="true"></span></button>
          <span class="sr" id="msgStatus" role="status"></span>
        </form>
        <div class="sent" id="msgSent">
          <div class="big">Message sent ☩</div>
          <div class="small">Thank you. Talk soon.</div>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
function $(id){return document.getElementById(id);}
var CROSS='<svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;image-rendering:pixelated;shape-rendering:crispEdges"><rect x="4" y="0" width="2" height="10" fill="#1a1612"/><rect x="3" y="1" width="4" height="1" fill="#1a1612"/><rect x="3" y="8" width="4" height="1" fill="#1a1612"/><rect x="2" y="0" width="6" height="1" fill="#1a1612"/><rect x="2" y="9" width="6" height="1" fill="#1a1612"/><rect x="0" y="4" width="10" height="2" fill="#1a1612"/><rect x="1" y="3" width="1" height="4" fill="#1a1612"/><rect x="8" y="3" width="1" height="4" fill="#1a1612"/><rect x="0" y="2" width="1" height="6" fill="#1a1612"/><rect x="9" y="2" width="1" height="6" fill="#1a1612"/></svg>';
['Minimize','Maximize','Close'].forEach(function(t){var b=document.createElement('div');b.className='tbbtn';b.title=t;b.innerHTML=CROSS;$('tbtns').appendChild(b);});

/* Write to me */
var form=$('msgForm'), sent=$('msgSent'), st=$('msgStatus'), hint=$('sendHint'), btn=$('sendBtn');
function say(t,err){hint.textContent=t;st.textContent=t;hint.classList.toggle('err',!!err);}
form.addEventListener('submit',function(e){
  e.preventDefault();
  if(!form.reportValidity())return;
  btn.disabled=true; say('sending…');
  fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}})
  .then(function(r){ if(r.ok){form.style.display='none';sent.style.display='flex';form.reset();say('');st.textContent='Message sent';} else say('error — try again',true); })
  .catch(function(){say('no connection',true);})
  .finally(function(){btn.disabled=false;});
});

/* Chrome: grain, burger */
(function(){
  var g=$('grain'),ctx=g.getContext('2d'),w,h;
  function rs(){w=g.width=window.innerWidth+20;h=g.height=window.innerHeight+120;}
  rs();window.addEventListener('resize',rs);
  (function tick(){var img=ctx.createImageData(w,h);for(var i=0;i<img.data.length;i+=4){var v=Math.random()*255|0;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=Math.random()*20|0;}ctx.putImageData(img,0,0);requestAnimationFrame(tick);})();
})();
(function(){
  var btn=$('swordBtn'),nav=$('navOverlay');
  btn.addEventListener('click',function(e){e.stopPropagation();btn.classList.toggle('open');nav.classList.toggle('open');});
  document.addEventListener('click',function(e){if(!nav.contains(e.target)&&e.target!==btn){btn.classList.remove('open');nav.classList.remove('open');}});
})();
setTimeout(function(){$('siteHeader').classList.add('visible');$('exWin').classList.add('visible');},100);
</script>
</body>
</html>
