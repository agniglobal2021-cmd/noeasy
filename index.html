<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOEASY</title>
<style>
@font-face {
  font-family: 'Alkhemikal';
  src: url('../fonts/Alkhemikal.ttf') format('truetype');
}
@font-face {
  font-family: 'DotGothic16';
  src: url('fonts/DotGothic16-Regular.ttf') format('truetype');
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  background: #e8e0c4;
  color: #353535;
  font-family: 'DotGothic16', monospace;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

#grain {
  position:fixed; inset:0; z-index:99; pointer-events:none;
}

.stage {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding: 20px;
}

.layout {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: clamp(16px, 4vw, 48px);
  opacity: 0;
  animation: appear 1s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  max-width: 100%;
  max-height: 100%;
}

@keyframes appear {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}

@media (orientation: portrait) {
  .layout { flex-direction: column; }
}

/* ---- shared Win95 window chrome ---- */
.win95 {
  background: #AFA191;
  border-top: 2px solid #d4cdc4;
  border-left: 2px solid #d4cdc4;
  border-right: 2px solid #3d3830;
  border-bottom: 2px solid #3d3830;
  box-shadow: 1px 1px 0 #2a2520;
  padding: 1px;
  flex-shrink: 0;
  width: clamp(120px, 36vw, 300px);
}

@media (orientation: portrait) {
  .win95 { width: clamp(220px, 80vw, 400px); }
}

.win95-titlebar {
  display: flex; align-items: stretch;
  height: 20px;
  background: #AFA191;
  padding: 1px;
  margin-bottom: 1px;
  user-select: none;
}

.win95-titlebar-inner {
  flex: 1;
  height: 100%;
  background: #5D5143;
  display: flex; align-items: center;
  padding: 0 1px 0 6px;
  overflow: hidden;
  min-width: 0;
  gap: 2px;
}

.win95-titlebar-text {
  font-family: 'DotGothic16', monospace;
  font-size: 8px; font-weight: 700;
  color: #f6f1da;
  letter-spacing: 0.10em; text-transform: uppercase;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  line-height: 1;
  flex: 1;
}

.win95-titlebar-btns {
  display: flex; gap: 1px; flex-shrink: 0; align-items: stretch;
}

.win95-btn {
  width: 16px;
  height: 16px;
  background: #AFA191;
  border-top: 1px solid #d4cdc4;
  border-left: 1px solid #d4cdc4;
  border-right: 1px solid #3d3830;
  border-bottom: 1px solid #3d3830;
  display: flex; align-items: center; justify-content: center;
  cursor: default;
  flex-shrink: 0;
  padding: 0;
  line-height: 0;
}

/* ---- HERO WINDOW ---------------------------------------------------
   The window reserves its full box straight away (img width/height
   attributes), so it never collapses to a thin strip while the gif
   downloads. Paper fills the frame, then the animation fades in.
   >>> Set width/height on <img id="hero-gif"> to hero.gif's REAL pixel
   size (currently 480x480) for zero layout shift on load. <<<
-------------------------------------------------------------------- */
.win95-body {
  width: 100%;
  display: block;
  overflow: hidden;
  line-height: 0;
  background: #e8e0c4;
}

.win95-body img {
  width: 100%;
  height: auto;
  display: block;
  image-rendering: pixelated;
  opacity: 0;
  transition: opacity 0.55s ease;
}
.win95-body img.loaded { opacity: 1; }

/* ---- DESKTOP ICON GRID (even grid, snaps like Windows) ---- */
.desktop {
  display: grid;
  grid-template-columns: repeat(2, auto);   /* landscape: 2 columns x 3 rows */
  gap: clamp(14px, 2.6vw, 32px);
  justify-items: center;
  align-items: start;
}

@media (orientation: portrait) {
  .desktop {
    grid-template-columns: repeat(3, auto); /* portrait: 3 columns x 2 rows */
    gap: clamp(12px, 3.6vw, 22px);
  }
}

.shortcut {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: #353535;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  width: clamp(48px, 10vw, 72px);
}

@media (orientation: portrait) {
  .shortcut { width: clamp(42px, 15vw, 62px); }
}

.shortcut-icon {
  width: clamp(32px, 7vw, 46px);
  height: clamp(32px, 7vw, 46px);
  image-rendering: pixelated;
  flex-shrink: 0;
}

@media (orientation: portrait) {
  .shortcut-icon {
    width: clamp(30px, 10vw, 42px);
    height: clamp(30px, 10vw, 42px);
  }
}

.shortcut-icon img {
  width: 100%; height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
  display: block;
}

.shortcut-label {
  font-family: 'DotGothic16', monospace;
  font-size: clamp(8px, 1.8vw, 10px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.3;
  color: #353535;
  padding: 1px 3px;
  transition: background 0.05s, color 0.05s;
}

.shortcut:hover .shortcut-label {
  background: #5D5143;
  color: #f6f1da;
}

.shortcut:active .shortcut-icon { transform: translate(1px, 1px); }

.shortcut.cur .shortcut-label {
  background: #5D5143;
  color: #f6f1da;
  pointer-events: none;
}

/* ---- WIN95 DIALOG POPUP -------------------------------------------
   Looks like a real Windows 95 message box: gray client area, brown
   titlebar with the custom pixel crosses, icon + message, and a gray
   beveled OK button (same style as the gallery buttons).
-------------------------------------------------------------------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background: rgba(14,12,10,0.72);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-win95 {
  width: clamp(252px, 80vw, 344px);
  transform: scale(0.95) translateY(8px);
  transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
}
.modal-overlay.open .modal-win95 { transform: none; }

.modal-close-btn { cursor: pointer; }

.modal-body {
  background: #AFA191;               /* Win95 dialog face color */
  padding: 16px 15px 14px;
  display: flex; flex-direction: column;
  gap: 15px;
}

.modal-row {
  display: flex; align-items: flex-start;
  gap: 14px;
  padding: 6px 2px 2px;
}
.modal-icon {
  width: 40px; height: 40px;
  image-rendering: pixelated;
  flex-shrink: 0;
}
.modal-text {
  display: flex; flex-direction: column; gap: 7px;
  padding-top: 1px;
}
.modal-heading {
  font-family: 'DotGothic16', monospace;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.13em; text-transform: uppercase;
  color: #1a1612;
}
.modal-sub {
  font-family: 'DotGothic16', monospace;
  font-size: 10px; letter-spacing: 0.05em;
  color: #2a2520; line-height: 1.55;
}

.modal-btn-row {
  display: flex; justify-content: center;
  border-top: 1px solid #7a7068;
  padding-top: 13px;
}

.modal-ok-btn {
  min-width: 74px;
  height: 24px;
  padding: 0 16px;
  font-family: 'DotGothic16', monospace;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em;
  color: #1a1612;
  background: #AFA191;
  border-top: 2px solid #d4cdc4;
  border-left: 2px solid #d4cdc4;
  border-right: 2px solid #3d3830;
  border-bottom: 2px solid #3d3830;
  box-shadow: inset 1px 1px 0 #d4cdc4, inset -1px -1px 0 #7a7068;
  cursor: pointer; user-select: none;
}
.modal-ok-btn:active {
  border-top: 2px solid #3d3830;
  border-left: 2px solid #3d3830;
  border-right: 2px solid #d4cdc4;
  border-bottom: 2px solid #d4cdc4;
  box-shadow: inset 1px 1px 0 #7a7068;
  padding-top: 2px; padding-left: 18px;
}

footer {
  position:fixed; bottom:0; left:0; right:0; z-index:2;
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 20px max(16px, env(safe-area-inset-bottom,16px));
  opacity:0;
  animation: appear 0.6s ease 1s forwards;
  font-family: 'DotGothic16', monospace;
  font-size: 8px; letter-spacing: 0.18em; text-transform:uppercase;
}
footer span { opacity:0.32; }
footer a {
  opacity:0.32; color:#353535; text-decoration:none;
  transition: opacity 0.2s;
}
footer a:hover { opacity:0.65; }
</style>

<script>
/* ---- hero gif: fade in once it paints; keep the .GIF fallback ---- */
const heroImg = document.getElementById('hero-gif');
function heroLoaded(){ heroImg.classList.add('loaded'); }
if (heroImg.complete && heroImg.naturalWidth) heroLoaded();
heroImg.addEventListener('load', heroLoaded);
heroImg.addEventListener('error', function() {
  if (this.src.endsWith('.gif')) { this.classList.remove('loaded'); this.src = 'assets/hero.GIF'; }
});

/* ---- Win95 "coming soon" dialog ---- */
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalHeading = document.getElementById('modalHeading');
const modalSub = document.getElementById('modalSub');
const modalIcon = document.getElementById('modalIcon');

function openModal(srcEl, title, heading, sub) {
  const img = srcEl.querySelector('.shortcut-icon img');
  if (img) modalIcon.src = img.src;
  modalTitle.textContent = title;
  modalHeading.textContent = heading;
  modalSub.textContent = sub;
  modal.classList.add('open');
}
function closeModal(){ modal.classList.remove('open'); }

const hallsBtn = document.getElementById('hallsBtn');
const shopBtn = document.getElementById('shopBtn');
hallsBtn.addEventListener('click', e => { e.preventDefault(); openModal(hallsBtn, 'THE HALLS', 'The Halls', 'This section will be available later.'); });
shopBtn.addEventListener('click', e => { e.preventDefault(); openModal(shopBtn, 'SHOP', 'Shop', 'The shop will be available later.'); });
document.querySelectorAll('.modal-close-btn').forEach(b => b.addEventListener('click', closeModal));
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---- grain ---- */
const g = document.getElementById('grain');
const gc = g.getContext('2d');
let gw, gh;
function rsz() { gw = g.width = window.innerWidth; gh = g.height = window.innerHeight; }
rsz(); window.addEventListener('resize', rsz);
(function tick() {
  const d = gc.createImageData(gw, gh);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = Math.random() * 255 | 0;
    d.data[i] = d.data[i+1] = d.data[i+2] = v;
    d.data[i+3] = Math.random() * 22 | 0;
  }
  gc.putImageData(d, 0, 0);
  requestAnimationFrame(tick);
})();
</script>
