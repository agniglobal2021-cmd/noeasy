function buildGroup(partsList, mat, planarUV){
  let vc=0, ic=0;
  for(const g of partsList){ if(!g.index){const n=g.attributes.position.count;const idx=new Uint32Array(n);for(let i=0;i<n;i++)idx[i]=i;g.setIndex(new THREE.BufferAttribute(idx,1));}
    vc+=g.attributes.position.count; ic+=g.index.count; }
  const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), uv=new Float32Array(vc*2),
        col=new Float32Array(vc*3), idx=new Uint32Array(ic);
  let vo=0, io=0;
  for(const g of partsList){
    const p=g.attributes.position, n=g.attributes.normal, u=g.attributes.uv;
    pos.set(p.array, vo*3); nor.set(n.array, vo*3);
    if(!planarUV && u) uv.set(u.array, vo*2);
    for(let i=0;i<g.index.count;i++) idx[io+i]=g.index.array[i]+vo;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
      if(planarUV){ uv[(vo+i)*2]=(x+z)*UVS; uv[(vo+i)*2+1]=y*UVS; }
      let k=1.0-smootherstep(y,4.5,15.5);
      k*=1.0+0.45*(1.0-Math.min(1,Math.max(0,y/4.0)));   // тёплый низ, чёрный верх
      col[(vo+i)*3]=k; col[(vo+i)*3+1]=k*0.96; col[(vo+i)*3+2]=k*0.9;
    }
    vo+=p.count; io+=g.index.count;
  }
  const G=new THREE.BufferGeometry();
  G.setAttribute('position',new THREE.BufferAttribute(pos,3));
  G.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  G.setAttribute('color',new THREE.BufferAttribute(col,3));
  G.setIndex(new THREE.BufferAttribute(idx,1));
  scene.add(new THREE.Mesh(G,mat));
}

// ---------- пол ----------
{ const f=new THREE.Mesh(new THREE.PlaneGeometry(P.W,LEN),
    new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4,metalness:0.12,map:T(TEXSRC.floor,3,15)}));
  f.rotation.x=-Math.PI/2; f.position.z=-LEN/2; scene.add(f); }

// ---------- стены ----------
const winBays=[]; for(let i=0;i<P.NB;i+=2) winBays.push(i);
function blindBay(x, ry, zc){ addStone(new THREE.PlaneGeometry(P.BAY,WALLH,1,32), x, WALLH/2, zc, 0, ry, 0); }
function windowBay(x, ry, zc){
  const side = (ry>0? 1:-1);
  const sw=(P.BAY-P.WIN_W)/2, wh=P.WIN_H, sy=P.SILL, top=WALLH-sy-wh;
  addStone(new THREE.PlaneGeometry(P.BAY,sy,1,6), x, sy/2, zc, 0, ry, 0);
  addStone(new THREE.PlaneGeometry(P.BAY,top,1,26), x, sy+wh+top/2, zc, 0, ry, 0);
  addStone(new THREE.PlaneGeometry(sw,wh,1,10), x, sy+wh/2, zc-(P.WIN_W/2+sw/2), 0, ry, 0);
  addStone(new THREE.PlaneGeometry(sw,wh,1,10), x, sy+wh/2, zc+(P.WIN_W/2+sw/2), 0, ry, 0);
  const d=P.RECESS, bx=x - side*d/2;
  addStone(new THREE.PlaneGeometry(d,wh,1,10), bx, sy+wh/2, zc-P.WIN_W/2, 0, 0, 0);
  addStone(new THREE.PlaneGeometry(d,wh,1,10), bx, sy+wh/2, zc+P.WIN_W/2, 0, Math.PI, 0);
  addStone(new THREE.PlaneGeometry(d,P.WIN_W), bx, sy+wh-0.005, zc, Math.PI/2, 0, 0);
  addStone(new THREE.PlaneGeometry(d+0.1,P.WIN_W), bx, sy+0.01, zc, -Math.PI/2, 0, 0);
  addStone(new THREE.BoxGeometry(0.26,wh+0.5,0.24), x+side*0.07, sy+wh/2+0.1, zc-P.WIN_W/2-0.11);
  addStone(new THREE.BoxGeometry(0.26,wh+0.5,0.24), x+side*0.07, sy+wh/2+0.1, zc+P.WIN_W/2+0.11);
  addStone(new THREE.BoxGeometry(0.5,0.18,P.WIN_W+0.9), x+side*0.14, sy-0.09, zc);
  const R=P.WIN_W, arc=new THREE.TorusGeometry(R,0.12,7,16,Math.PI/3);
  addStone(arc, x+side*0.07, sy+wh-0.05, zc+R/2, 0, Math.PI/2, 0);
  addStone(arc, x+side*0.07, sy+wh-0.05, zc-R/2, 0, Math.PI/2, Math.PI*2/3);
  return {glassX: x - side*(d-0.03), zc};
}
const glassSpots=[];
for(let i=0;i<P.NB;i++){
  const zc=-(i+0.5)*P.BAY;
  if(winBays.includes(i)) glassSpots.push(windowBay(-P.W/2, Math.PI/2, zc));
  else blindBay(-P.W/2, Math.PI/2, zc);
  blindBay(P.W/2, -Math.PI/2, zc);
}
addStone(new THREE.PlaneGeometry(P.W,WALLH,1,32), 0, WALLH/2, -LEN);
addStone(new THREE.PlaneGeometry(P.W,WALLH,1,32), 0, WALLH/2, 0, 0, Math.PI, 0);
addStone(new THREE.BoxGeometry(0.18,0.7,LEN), -P.W/2+0.09, 0.35, -LEN/2);
addStone(new THREE.BoxGeometry(0.18,0.7,LEN),  P.W/2-0.09, 0.35, -LEN/2);

// ---------- колонны, капители, арки, руины ----------
const shaft=new THREE.CylinderGeometry(0.55,0.62,P.COLH,8,12);
const cap=new THREE.BoxGeometry(1,1,1);
{ const p=cap.attributes.position;
  for(let i=0;i<p.count;i++){ const w=p.getY(i)>0?1.75:1.05; p.setX(i,p.getX(i)*w); p.setZ(i,p.getZ(i)*w); }
  cap.computeVertexNormals(); }
const base=new THREE.BoxGeometry(1.6,0.7,1.6);
const rock=new THREE.DodecahedronGeometry(1,0);
const broken={'-1':5, '1':9};
for(let i=0;i<=P.NB;i++) for(const s of [-1,1]){
  const cx=s*(P.W/2-0.4), cz=-i*P.BAY;
  addStone(base, cx, 0.35, cz);
  if(broken[String(s)]===i){
    const h=P.COLH*0.42;
    addPart(shaftParts, shaft, cx, h/2+0.3, cz, 0,0,0, 1,0.42,1);
    addStone(rock, cx, h+0.6, cz, Math.random(),Math.random(),0, 0.7,0.45,0.7);
    for(let r=0;r<6;r++){const a=Math.random()*6.28,d2=1.1+Math.random()*1.6;
      addStone(rock, cx+Math.cos(a)*d2*0.6, 0.25+Math.random()*0.15, cz+Math.sin(a)*d2,
        Math.random()*3,Math.random()*3,0, 0.3+Math.random()*0.5,0.22+Math.random()*0.3,0.3+Math.random()*0.5);}
  } else {
    addPart(shaftParts, shaft, cx, P.COLH/2+0.3, cz);
    addPart(capParts, cap, cx, P.COLH+0.75, cz, 0,0,0, 1,0.95,1);
  }
}
{ const R=P.BAY, spring=P.COLH+1.1, arc=new THREE.TorusGeometry(R,0.22,7,20,Math.PI/3);
  for(let i=0;i<P.NB;i++) for(const s of [-1,1]){
    if(broken[String(s)]===i || broken[String(s)]===i+1) continue;
    const cx=s*(P.W/2-0.35), zc=-i*P.BAY;
    addStone(arc, cx, spring, zc, 0, Math.PI/2, 0);
    addStone(arc, cx, spring, zc-P.BAY, 0, Math.PI/2, Math.PI*2/3);
  }
}
const wallMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.95,vertexColors:true,flatShading:true,map:T(TEXSRC.wall,1,1)});
const shaftMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.95,vertexColors:true,flatShading:true,map:T(TEXSRC.shaft,1,3)});
const capMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.95,vertexColors:true,map:T(TEXSRC.cap,1,1)});
buildGroup(stoneParts, wallMat, true);
buildGroup(shaftParts, shaftMat, false);
buildGroup(capParts, capMat, false);

// ---------- стекло из кусочков янтаря + свет ----------
const lancet=gradTex((g,w,h)=>{
  g.clearRect(0,0,w,h);
  function outline(){g.beginPath();g.moveTo(w*0.04,h);g.lineTo(w*0.04,h*0.20);
    g.quadraticCurveTo(w*0.04,h*0.015,w*0.5,h*0.005);
    g.quadraticCurveTo(w*0.96,h*0.015,w*0.96,h*0.20);g.lineTo(w*0.96,h);g.closePath();}
  outline(); g.save(); g.clip();
  const shades=['#ffd27d','#ffc466','#f4a83f','#e8912f','#d67f24','#c9761f','#a95f18','#8f5416'];
  const cols=5, rows=14, px=[];
  for(let r=0;r<=rows;r++){px.push([]);
    for(let c=0;c<=cols;c++){
      const jx=(c==0||c==cols)?0:(Math.random()-.5)*w*0.09;
      const jy=(r==0||r==rows)?0:(Math.random()-.5)*h*0.02;
      px[r].push([w*c/cols+jx, h*r/rows+jy]);}}
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    g.beginPath();
    g.moveTo(px[r][c][0],px[r][c][1]);g.lineTo(px[r][c+1][0],px[r][c+1][1]);
    g.lineTo(px[r+1][c+1][0],px[r+1][c+1][1]);g.lineTo(px[r+1][c][0],px[r+1][c][1]);g.closePath();
    const cy=(r+0.5)/rows, cx=(c+0.5)/cols;
    const bright=1.0-0.55*cy-0.25*Math.abs(cx-0.5)*2;
    let idx=Math.floor((1-bright)*(shades.length-1)+(Math.random()*2-1));
    idx=Math.max(0,Math.min(shades.length-1,idx));
    g.fillStyle=shades[idx]; g.fill();
    g.strokeStyle='rgba(30,20,10,0.9)'; g.lineWidth=w*0.014; g.stroke();}
  g.restore();
  outline(); g.lineWidth=w*0.045; g.strokeStyle='#241a10'; g.stroke();},256,768);
const haloTex=gradTex((g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,6,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(255,175,85,0.5)');gr.addColorStop(1,'rgba(255,190,100,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);},128,128);
const rayTex=gradTex((g,w,h)=>{
  const v=g.createLinearGradient(0,0,0,h);
  v.addColorStop(0,'rgba(255,185,105,0.40)');v.addColorStop(0.55,'rgba(255,185,100,0.14)');
  v.addColorStop(1,'rgba(255,175,90,0)');
  g.fillStyle=v;g.fillRect(0,0,w,h);
  const m=g.createLinearGradient(0,0,w,0);
  m.addColorStop(0,'rgba(0,0,0,1)');m.addColorStop(0.22,'rgba(0,0,0,0)');
  m.addColorStop(0.78,'rgba(0,0,0,0)');m.addColorStop(1,'rgba(0,0,0,1)');
  g.globalCompositeOperation='destination-out';g.fillStyle=m;g.fillRect(0,0,w,h);},128,256);
const poolTex=gradTex((g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,4,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(255,175,90,0.25)');gr.addColorStop(1,'rgba(255,170,80,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);},128,128);

const RAYL=12;
const rayGeo=new THREE.PlaneGeometry(P.WIN_W*1.05,RAYL); rayGeo.translate(0,-RAYL/2,0);
for(const spot of glassSpots){
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(P.WIN_W,P.WIN_H),
    new THREE.MeshBasicMaterial({map:lancet,transparent:true,side:THREE.DoubleSide}));
  gl.position.set(spot.glassX, P.SILL+P.WIN_H/2, spot.zc); gl.rotation.y=Math.PI/2; scene.add(gl);
  const halo=new THREE.Mesh(new THREE.PlaneGeometry(P.WIN_W*2.6,P.WIN_H*1.5),
    new THREE.MeshBasicMaterial({map:haloTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.position.set(-P.W/2+0.12, P.SILL+P.WIN_H/2, spot.zc); halo.rotation.y=Math.PI/2; scene.add(halo);
  for(const cfg of [[0,0.72,0.85],[0.6,0.66,0.45]]){
    const ray=new THREE.Mesh(rayGeo,
      new THREE.MeshBasicMaterial({map:rayTex,transparent:true,opacity:cfg[2],blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    ray.position.set(-P.W/2+0.15, P.SILL+P.WIN_H-1.3, spot.zc+cfg[0]);
    ray.rotation.z=cfg[1]; scene.add(ray);
  }
  const L=new THREE.PointLight(0xffa54e,1.6,16,2); L.position.set(P.W/2-3.2,3.6,spot.zc); scene.add(L);
  const L2=new THREE.PointLight(0xffb060,0.55,7,2); L2.position.set(-P.W/2+1.2,P.SILL+1.2,spot.zc); scene.add(L2);
  const pool=new THREE.Mesh(new THREE.PlaneGeometry(8.5,5.6),
    new THREE.MeshBasicMaterial({map:poolTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  pool.rotation.x=-Math.PI/2; pool.position.set(1.4,0.02,spot.zc); scene.add(pool);
  const splash=new THREE.Mesh(new THREE.PlaneGeometry(5,4.5),
    new THREE.MeshBasicMaterial({map:poolTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  splash.position.set(P.W/2-0.06,3.1,spot.zc); splash.rotation.y=-Math.PI/2; scene.add(splash);
}
scene.add(new THREE.AmbientLight(0x2a1c0e,0.33));

// ---------- холсты ----------
const loader=new THREE.TextureLoader();
const rightSkip=[8,9], leftBays=[1,3,7,9,11];
let slot=0;
function hangCanvas(wallX, ry, zc){
  const src=ARTS[slot++ % ARTS.length];
  loader.load(src,tex=>{
    tex.encoding=THREE.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
    const ar=tex.image.width/tex.image.height,h=P.CANVAS_H,w=h*ar;
    const dark=new THREE.MeshStandardMaterial({color:0x1c1510,roughness:0.9});
    const s = wallX<0 ? 1 : -1;
    const slab=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.07),
      [dark,dark,dark,dark,new THREE.MeshBasicMaterial({map:tex,color:0xe5ded2}),dark]);
    slab.position.set(wallX+s*0.17, P.CANVAS_CY, zc); slab.rotation.y=ry; scene.add(slab);
    const back=new THREE.Mesh(new THREE.PlaneGeometry(w+0.12,h+0.12),
      new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.3}));
    back.position.set(wallX+s*0.07, P.CANVAS_CY, zc); back.rotation.y=ry; scene.add(back);
  });
}
for(let i=0;i<P.NB;i++){ if(!rightSkip.includes(i)) hangCanvas(P.W/2, -Math.PI/2, -(i+0.5)*P.BAY); }
for(const i of leftBays){ hangCanvas(-P.W/2, Math.PI/2, -(i+0.5)*P.BAY); }

// ---------- управление ----------
let yaw=0,pitch=0.06;const keys={},move={x:0,y:0};
addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);
let lookId=null,moveId=null,lookPrev=null,moveOrigin=null;
const stick=document.getElementById('stick'),nub=document.getElementById('nub');
function place(el,x,y,s){el.style.display='block';el.style.left=(x-s/2)+'px';el.style.top=(y-s/2)+'px';}
addEventListener('touchstart',e=>{for(const t of e.changedTouches){
  if(t.clientX<innerWidth/2&&moveId===null){moveId=t.identifier;moveOrigin={x:t.clientX,y:t.clientY};
    place(stick,t.clientX,t.clientY,84);place(nub,t.clientX,t.clientY,34);}
  else if(lookId===null){lookId=t.identifier;lookPrev={x:t.clientX,y:t.clientY};}}},{passive:false});
addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){
  if(t.identifier===moveId){const dx=t.clientX-moveOrigin.x,dy=t.clientY-moveOrigin.y,m=Math.hypot(dx,dy)||1,c=Math.min(m,42);
    move.x=dx/m*(c/42);move.y=dy/m*(c/42);
    place(nub,moveOrigin.x+dx/m*c,moveOrigin.y+dy/m*c,34);}
  if(t.identifier===lookId){yaw-=(t.clientX-lookPrev.x)*0.005;pitch-=(t.clientY-lookPrev.y)*0.005;
    lookPrev={x:t.clientX,y:t.clientY};}}},{passive:false});
addEventListener('touchend',e=>{for(const t of e.changedTouches){
  if(t.identifier===moveId){moveId=null;move.x=move.y=0;stick.style.display=nub.style.display='none';}
  if(t.identifier===lookId)lookId=null;}});
let mDown=false,mPrev=null;
addEventListener('mousedown',e=>{mDown=true;mPrev={x:e.clientX,y:e.clientY};});
addEventListener('mouseup',()=>mDown=false);
addEventListener('mousemove',e=>{if(!mDown)return;
  yaw-=(e.clientX-mPrev.x)*0.004;pitch-=(e.clientY-mPrev.y)*0.004;mPrev={x:e.clientX,y:e.clientY};});

// ---------- зерно ----------
(function(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const id=g.createImageData(128,128);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;
    id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}
  g.putImageData(id,0,0);const el=document.getElementById('grain');
  el.style.background='url('+c.toDataURL()+')';
  setInterval(()=>{el.style.transform=`translate(${(Math.random()*48)|0}px,${(Math.random()*48)|0}px)`;},90);})();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});

const view=new URLSearchParams(location.search).get('view');
if(view==='corridor'){camera.position.set(1.0,P.EYE,-3);yaw=0.02;pitch=0.12;}
if(view==='window'){camera.position.set(-1.6,P.EYE,-8.6);yaw=1.05;pitch=0.28;}
if(view==='canvas'){camera.position.set(1.6,P.EYE,-6.0);yaw=-1.2;pitch=0.05;}
if(view==='up'){camera.position.set(0,P.EYE,-16);yaw=0;pitch=1.15;}

const clock=new THREE.Clock();
let frames=0;
(function loop(){
  const dt=Math.min(clock.getDelta(),0.05),sp=3.2;
  let fx=move.x,fy=move.y;
  if(keys.KeyW||keys.ArrowUp)fy=-1; if(keys.KeyS||keys.ArrowDown)fy=1;
  if(keys.KeyA||keys.ArrowLeft)fx=-1; if(keys.KeyD||keys.ArrowRight)fx=1;
  pitch=Math.max(-1.25,Math.min(1.25,pitch));
  camera.rotation.set(pitch,yaw,0);
  const sin=Math.sin(yaw),cos=Math.cos(yaw);
  camera.position.x+=(fx*cos + fy*sin)*sp*dt;
  camera.position.z+=(fy*cos - fx*sin)*sp*dt;
  camera.position.x=Math.max(-4.7,Math.min(4.7,camera.position.x));
  camera.position.z=Math.max(-LEN+1.2,Math.min(-1.2,camera.position.z));
  camera.position.y=P.EYE;
  renderer.render(scene,camera);
  frames++; if(frames>8 && window.__texok && !window.__ready) window.__ready=true;
  requestAnimationFrame(loop);
})();
</script>
