<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOEASY | The Halls</title>
<style>
@font-face{font-family:'Mekzantine';src:url(assets/mekzantine.594cafa4.otf) format('opentype');}
html,body{margin:0;height:100%;overflow:hidden;background:#000000;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#loader{position:fixed;inset:0;background:#151413;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 2.6s cubic-bezier(.5,.04,.75,.2)}
#loader.wake *:not(#smoke){transition:opacity .4s ease;opacity:0}
#loader.wake,#loader.wake *{pointer-events:none}
/* дым ладана и зерно меню — один канвас, точка на каждые 2 CSS px, растянут без сглаживания (см. NoeasySmoke ниже);
   пока строится зал, вместо него неподвижный кадр зерна в #mgrain */
#smoke{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#mgrain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;image-rendering:pixelated;opacity:.55}
@font-face{font-family:'DotGothic16';src:url(assets/dotgothic16.17453465.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
/* кириллица для текста точек — NoeasyDot (DotGothic16 с подогнанной кириллицей, SIL OFL 1.1); в DotGothic16 страницы русских букв нет, браузер берёт их отсюда */
@font-face{font-family:'NoeasyDot';src:url(assets/noeasydot.4ad0b69b.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0400-045F,U+0490-0491,U+2116}
#llogo{position:relative;z-index:3;width:min(560px,80vw);height:auto;display:block;
  opacity:0;transform:translateY(-16px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}
#loader.lit #llogo{opacity:1;transform:none}   /* прозрачность и сдвиг идут на видеокарте: лого доезжает, даже пока строится зал */
#loader.wake #llogo{opacity:0;transition:opacity .4s ease}   /* на ENTER лого гаснет вместе с кнопками (правило выше иначе держало бы его) */
/* выбор локации: без рамок и плашек — тот же приём, что в фильтрах сайта,
   прозрачность плюс подчёркивание, растущее от нуля */
/* выход на сайт — тихая подпись в углу, без бургера */
#mhome{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:5;font-family:'DotGothic16',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#f6f1da;text-decoration:none;padding:8px 2px;opacity:0;transition:opacity .6s ease .75s;-webkit-tap-highlight-color:transparent;user-select:none}
#loader.lit #mhome{opacity:.4}
#loader.lit #mhome:hover{opacity:.85;transition-delay:0s}
/* полоска загрузки под логотипом: без цифр; кнопки проступают, когда пришло всё нужное.
   Отрицательный нижний отступ — чтобы локации стояли там же, где и без полоски */
#lbar{position:relative;z-index:3;width:min(220px,46vw);height:2px;margin:34px 0 -36px;background:rgba(246,241,218,.12);
  overflow:hidden;opacity:0;transition:opacity .5s ease .6s}
#lbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#f6f1da;opacity:.75;transition:width .35s ease}
#loader.lit #lbar{opacity:1}
#loader.lit.loaded #lbar{opacity:0;transition:opacity .4s ease}
#locs{position:relative;z-index:3;margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:20px;
  opacity:0;pointer-events:none;transition:opacity .6s ease .15s}
#loader.loaded #locs{opacity:1;pointer-events:auto}
.loc{font-family:'Mekzantine',serif;font-size:27px;letter-spacing:.06em;color:#f6f1da;opacity:.45;
  background:none;border:none;padding:4px 2px 7px;cursor:pointer;position:relative;user-select:none;
  -webkit-tap-highlight-color:transparent;transition:opacity .18s;line-height:1.15;text-align:center}
.loc::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;background:#f6f1da;opacity:.7;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.loc:hover:not(.sel):not(.off){opacity:.68}
.loc.sel{opacity:.95}
.loc.sel::after{width:100%}
.loc.off{opacity:.28;pointer-events:none;cursor:default}
.loctag{display:block;margin-top:6px;font-family:'DotGothic16',monospace;font-size:7px;
  letter-spacing:.26em;text-transform:uppercase}
#enterwrap{position:relative;z-index:3;margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:11px;
  visibility:hidden;opacity:0;transition:opacity .6s ease .35s}
#loader.loaded #enterwrap{opacity:1}
#enter{font-family:'Mekzantine',serif;font-size:23px;letter-spacing:.10em;color:#353535;background:#AFA191;
  border-top:2px solid #d4cdc4;border-left:2px solid #d4cdc4;border-right:2px solid #3d3830;border-bottom:2px solid #3d3830;
  box-shadow:inset 1px 1px 0 #d4cdc4,inset -1px -1px 0 #7a7068;padding:9px 44px;cursor:pointer;user-select:none;
  transition:none;-webkit-tap-highlight-color:transparent}
#enter:active{border-top:2px solid #3d3830;border-left:2px solid #3d3830;border-right:2px solid #d4cdc4;border-bottom:2px solid #d4cdc4;
  box-shadow:inset 1px 1px 0 #7a7068;padding-top:11px;padding-left:46px}
#enter.off{opacity:.3;pointer-events:none;cursor:default}
#entercap{font-family:'DotGothic16',monospace;font-size:8px;letter-spacing:.22em;text-transform:uppercase;
  color:#f6f1da;opacity:.38;transition:opacity .3s}
#entercap.hide{opacity:0}
#gowin{position:fixed;inset:0;background:rgba(10,7,3,.72);z-index:31;display:none;align-items:center;justify-content:center}
#gowin .win{background:#e8e0c4;border:2px solid;border-color:#d4cdc4 #2a2520 #2a2520 #d4cdc4;min-width:min(88vw,420px);box-shadow:4px 4px 0 #2a2520}
#gowin .bar{background:#5D5143;color:#f6f1da;font:700 15px monospace;padding:6px 10px;letter-spacing:1px}
#gowin .wbody{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:18px}
#gowin .q{font:16px monospace;color:#353535;text-align:center;line-height:1.5}
#gowin .row{display:flex;gap:14px}
#gowin button{background:#AFA191;border:2px solid;border-color:#d4cdc4 #2a2520 #2a2520 #d4cdc4;font:700 15px monospace;color:#353535;padding:9px 30px;cursor:pointer;letter-spacing:1px}
#gowin button:active{border-color:#2a2520 #d4cdc4 #d4cdc4 #2a2520}
/* Панель картины повторяет карточку работы с сайта: рамка .img-win95 с полосой заголовка,
   под ней имя византийским, мета мелким и выпадающий Purchase. Подложка — как у лайтбокса сайта. */
#artwin{opacity:0;transition:opacity .34s ease;position:fixed;inset:0;background:rgba(14,12,10,.94);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
#artwin .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;max-width:100%;max-height:100%}
#artwin .iw{position:relative;flex-shrink:0;line-height:0}
#artwin img{display:block}
#artwin .info{display:flex;flex-direction:column;align-items:center;text-align:center;gap:11px;max-width:min(94vw,620px)}
#artwin .ftitle{font-family:'Mekzantine',serif;font-size:clamp(19px,4.6vw,26px);letter-spacing:.04em;color:#e8e0c4;opacity:.82;line-height:1.2}
#artwin .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
#artwin .yr{font-family:'DotGothic16',monospace;font-size:8px;letter-spacing:.32em;color:#e8e0c4;opacity:.38;white-space:nowrap}
#artwin .vsep{width:1px;height:9px;background:#e8e0c4;opacity:.15;flex-shrink:0}
#artwin .tag{font-family:'DotGothic16',monospace;font-size:7px;letter-spacing:.26em;text-transform:uppercase;color:#e8e0c4;opacity:.28}
#artwin .tsep{font-family:'DotGothic16',monospace;font-size:7px;color:#e8e0c4;opacity:.15;margin:0 5px}
#artwin .desc{font-family:'DotGothic16',monospace;font-size:10px;line-height:1.7;letter-spacing:.06em;color:#e8e0c4;opacity:.42;white-space:pre-wrap}
#artwin .pw{position:relative}
#artwin .buy{height:32px;display:flex;align-items:center;padding:0 16px;font-family:'Mekzantine',serif;font-size:18px;letter-spacing:.07em;color:#1a1612;background:#AFA191;border-top:2px solid #d4cdc4;border-left:2px solid #d4cdc4;border-right:2px solid #3d3830;border-bottom:2px solid #3d3830;box-shadow:inset 1px 1px 0 #d4cdc4,inset -1px -1px 0 #7a7068;border-radius:0;cursor:pointer;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent;transition:none}
#artwin .buy:hover{background:#bbb2a6}
#artwin .buy:active,#artwin .buy.open{border-top:2px solid #3d3830;border-left:2px solid #3d3830;border-right:2px solid #d4cdc4;border-bottom:2px solid #d4cdc4;box-shadow:inset 1px 1px 0 #7a7068;padding-top:2px;padding-left:18px}
#artwin .dd{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translate(-50%,5px);min-width:152px;padding:2px;background:#AFA191;border-top:2px solid #d4cdc4;border-left:2px solid #d4cdc4;border-right:2px solid #3d3830;border-bottom:2px solid #3d3830;box-shadow:2px 2px 0 #2a2520;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:5}
#artwin .dd.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#artwin .dd a{display:block;font-family:'DotGothic16',monospace;font-size:9px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:#000;text-decoration:none;padding:7px 11px;white-space:nowrap}
#artwin .dd a+a{border-top:1px solid #7a7068}
#artwin .dd a:hover{background:#5D5143;color:#f6f1da}
#artwin .close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;width:34px;height:34px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:6;-webkit-tap-highlight-color:transparent}
#artwin .close.on{opacity:.40;pointer-events:auto}
#artwin .close:hover{opacity:.88}
#artwin .close i{position:absolute;left:6px;top:16px;width:22px;height:1px;background:#e8e0c4;display:block}
#artwin .close i:first-child{transform:rotate(45deg)}
#artwin .close i:last-child{transform:rotate(-45deg)}

#artwin.lit{opacity:1}
#artwin .iw{opacity:0;transform:scale(.986);will-change:opacity,transform;transition:opacity .50s ease .16s,transform .62s cubic-bezier(.16,1,.3,1) .16s}
#artwin .iw.on{opacity:1;transform:scale(1)}
#artwin .ftitle .ch{display:inline-block;opacity:0;transform:translateY(.5em);transition:opacity .55s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1)}
#artwin .ftitle.on .ch{opacity:1;transform:translateY(0)}
#artwin .ftitle .ch.sp{width:.28em}
#artwin .meta,#artwin .desc,#artwin .pw{opacity:0;transition:opacity .6s ease}
#artwin .meta.on,#artwin .desc.on,#artwin .pw.on{opacity:1}
#artwin .buy{position:relative;overflow:hidden}
#artwin .buy .gl{position:absolute;top:0;bottom:0;width:44%;left:-62%;pointer-events:none;background:linear-gradient(100deg,rgba(255,250,228,0) 0%,rgba(255,250,228,.72) 50%,rgba(255,250,228,0) 100%)}
#artwin .buy.gleam .gl{animation:buygl 1.05s ease-in-out}
@keyframes buygl{from{left:-62%}to{left:122%}}
/* Точки-пасхалки (ставятся в аппке Mindgate). Кнопка Reveal стоит рядом с Purchase и есть только
   у работ с точками; включённая — точки светятся поверх картины, тап по точке открывает её текст. */
#artwin .acts{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#artwin .rv{height:32px;display:flex;align-items:center;gap:8px;padding:0 16px;font-family:'Mekzantine',serif;font-size:18px;letter-spacing:.07em;color:#1a1612;background:#AFA191;border-top:2px solid #d4cdc4;border-left:2px solid #d4cdc4;border-right:2px solid #3d3830;border-bottom:2px solid #3d3830;box-shadow:inset 1px 1px 0 #d4cdc4,inset -1px -1px 0 #7a7068;border-radius:0;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;opacity:0;transition:opacity .6s ease}
#artwin .rv.on{opacity:1}
#artwin .rv[hidden]{display:none}
#artwin .rv:hover{background:#bbb2a6}
#artwin .rv:active,#artwin .rv[aria-pressed="true"]{border-top:2px solid #3d3830;border-left:2px solid #3d3830;border-right:2px solid #d4cdc4;border-bottom:2px solid #d4cdc4;box-shadow:inset 1px 1px 0 #7a7068;padding-top:2px;padding-left:18px}
#artwin .rv i{width:8px;height:8px;border-radius:50%;background:#1a1612;opacity:.35;flex-shrink:0;transition:opacity .2s,background .2s,box-shadow .2s}
#artwin .rv[aria-pressed="true"] i{opacity:1;background:#f6f1da;box-shadow:0 0 0 1px #1a1612,0 0 8px 2px rgba(227,162,79,.9)}
#artwin .rv .cnt{font-family:'DotGothic16',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.65}
#artwin .vmark{position:absolute;z-index:2;width:34px;height:34px;margin:0;padding:0;transform:translate(-50%,-50%) scale(.6);background:none;border:0;border-radius:50%;cursor:pointer;opacity:0;pointer-events:none;-webkit-tap-highlight-color:transparent;transition:opacity .45s ease,transform .45s cubic-bezier(.16,1,.3,1)}
#artwin.pts .vmark{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#artwin .vmark::before{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#f6f1da;box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 12px 4px rgba(227,162,79,.8)}
#artwin .vmark::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(246,241,218,.75);animation:vring 2.6s ease-out infinite}
#artwin .vmark.act::before{background:#e3a24f}
#artwin .vmark:focus-visible{outline:1px dotted #f6f1da;outline-offset:2px}
@keyframes vring{from{transform:scale(.35);opacity:.9}to{transform:scale(1.2);opacity:0}}
#artwin .vtip{position:absolute;z-index:4;left:0;top:0;width:max-content;max-width:270px;padding:10px 12px;background:#f6f1da;color:#1a1612;border:1px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.5);font-family:'DotGothic16','NoeasyDot',monospace;font-size:13px;line-height:1.55;letter-spacing:.02em;white-space:pre-wrap;overflow-wrap:break-word;text-align:left}
@media (orientation:landscape) and (min-width:840px){ #artwin .acts{justify-content:flex-start} }
@media (prefers-reduced-motion:reduce){ #artwin .vmark::after{animation:none;opacity:.6} #artwin .vmark{transition:none} }
@media (orientation:landscape) and (min-width:840px){
 #artwin .stage{flex-direction:row;gap:34px}
 #artwin .info{align-items:flex-start;text-align:left;width:min(300px,26vw);max-width:none}
 #artwin .meta{justify-content:flex-start}
 #artwin .dd{left:0;transform:translate(0,5px)}
 #artwin .dd.open{transform:translate(0,0)}
}
/* выход из виртуального пространства: значок повторяет бургер из шапки сайта */
/* кнопки в углу: 32×26, проявляются после входа; зона нажатия шире самой кнопки,
   соседние зоны не пересекаются (зазор 6 px, каждая зона выступает на 3 px) */
#hudmenu,#hudsound{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:22;display:none;align-items:center;justify-content:center;width:28px;height:22px;background:#AFA191;border-top:2px solid #d4cdc4;border-left:2px solid #d4cdc4;border-right:2px solid #3d3830;border-bottom:2px solid #3d3830;box-shadow:inset 1px 1px 0 #d4cdc4,inset -1px -1px 0 #7a7068;cursor:pointer;-webkit-tap-highlight-color:transparent;opacity:0;transition:opacity 1s ease}
#hudmenu{right:10px;flex-direction:column;gap:3px}
#hudsound{right:48px}
#hudmenu.shown,#hudsound.shown{opacity:1}
#hudmenu::after,#hudsound::after{content:'';position:absolute;top:-9px;bottom:-9px;left:-5px;right:-5px}
#hudmenu:active,#hudsound:active{border-top:2px solid #3d3830;border-left:2px solid #3d3830;border-right:2px solid #d4cdc4;border-bottom:2px solid #d4cdc4;box-shadow:inset 1px 1px 0 #7a7068}
#hudmenu i{display:block;width:14px;height:2px;background:#000;opacity:.8}
#hudsound svg{display:block;width:18px;height:14px;opacity:.8}
#hudsound .ico-off{display:none}
#hudsound.muted .ico-on{display:none}
#hudsound.muted .ico-off{display:block}
#sndtest{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:5;font-family:'DotGothic16',monospace;font-size:11px;letter-spacing:.08em;color:#e8e0c4;background:#1e1a12;border:1px solid #5D5143;padding:8px 12px;cursor:pointer;white-space:nowrap}
#sndtest input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#pause{position:fixed;inset:0;z-index:33;display:none;align-items:center;justify-content:center;background:rgba(10,7,3,.88);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#pause .nav{display:flex;flex-direction:column;min-width:220px;padding:2px;background:#AFA191;border-top:2px solid #d4cdc4;border-left:2px solid #d4cdc4;border-right:2px solid #3d3830;border-bottom:2px solid #3d3830;box-shadow:3px 3px 0 #2a2520}
#pause a{font-family:'DotGothic16',monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#000;text-decoration:none;padding:12px 14px 12px 10px;display:flex;align-items:center;cursor:pointer;user-select:none}
#pause a::before{content:'/';margin-right:8px}
#pause a+a{border-top:1px solid #7a7068}
#pause a:hover{background:#5D5143;color:#f6f1da}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 95% at 50% 46%, rgba(0,0,0,0) 55%, rgba(5,3,1,.62) 100%)}
/* зерно в зале: тайл шума 128 px, показан на 12 % крупнее (128 × 1.12 = 143.36 px) */
#grain{position:fixed;inset:-64px;pointer-events:none;opacity:.0423;background-size:143.36px 143.36px}
@media (max-resolution:1.49dppx),(-webkit-max-device-pixel-ratio:1.49){ #grain{image-rendering:pixelated} }   /* на обычных экранах растяжение на 1.12 размыло бы зерно в сетку — там оно остаётся чётким */
/* ПОДСКАЗКА УПРАВЛЕНИЯ — один раз после входа, под устройство: клавиатура и мышь или касания.
   Проступает, когда гаснет название зоны, держится несколько секунд и растворяется, поднимаясь, как дым.
   Нажатий не ловит (pointer-events:none): джойстик и взгляд под ней работают как обычно. */
#hint{position:fixed;inset:0;pointer-events:none;z-index:21;opacity:0;transform:translateY(6px);filter:blur(0);
  transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);font-family:'DotGothic16',monospace;color:#f6f1da;text-transform:uppercase}
#hint.on{opacity:1;transform:none}
#hint.off{opacity:0;transform:translateY(-10px);filter:blur(3px);transition:opacity 1.6s ease,transform 1.8s ease,filter 1.6s ease}
#hint .row{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8%);display:flex;justify-content:center;align-items:flex-end;gap:clamp(22px,5vw,56px);flex-wrap:wrap;padding:0 16px}
#hint .it{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:96px;text-align:center;text-shadow:0 1px 2px #000,0 0 12px rgba(0,0,0,.75)}
#hint .ico{height:48px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 6px rgba(0,0,0,.5))}
#hint .cap{font-size:11px;letter-spacing:.16em;opacity:.92}
#hint .sub{font-size:9px;letter-spacing:.12em;opacity:.55;margin-top:-4px}
#hint .keys{display:grid;grid-template-columns:repeat(3,22px);grid-auto-rows:22px;gap:3px}
#hint kbd{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:22px;height:22px;background:#AFA191;
  border-top:2px solid #d4cdc4;border-left:2px solid #d4cdc4;border-right:2px solid #3d3830;border-bottom:2px solid #3d3830;

<script>
/* МЕНЮ ДО ЗАЛА. Этот кусок идёт сразу за разметкой меню, а сам зал строится кадром позже (см. hall-main):
   логотип и зерно появляются сразу, пока строится зал.
   ЗЕРНО — пять готовых кадров шума, они просто сменяют друг друга (90 мс каждый); рисуется в том же
   канвасе, что и дым, и только когда кадр сменился — второго слоя, который надо перерисовывать, нет.
   ДЫМ ЛАДАНА (NoeasySmoke) — дым из точек, как призраки в зале, по всему фону и без видимого
   источника, как на сайте Volchok; проступает, когда зал построен, и рассыпается на ENTER. До этого у меню нет своей WebGL-графики вовсе: только
   один неподвижный кадр зерна (#mgrain) — второй WebGL-канвас рядом со сборкой зала замедлял её в разы. */
/* NOEASY · The Halls · menu smoke — incense smoke and film grain drawn as dots, like the ghosts in the hall.

   One small WebGL canvas, rendered at one pixel per dot (CELL CSS px) and stretched with
   image-rendering: pixelated, so every lit cell is a crisp square dot. The smoke hangs over the whole
   background with no visible source, the way it does on the Volchok site: noise folded through itself
   twice (domain warping), drifting slowly and rising a little, as if the censer were somewhere out of
   sight. Density becomes dots through a 4×4 Bayer threshold, so the smoke has no soft edges at all:
   thick smoke is many dots, thin smoke is few.
   The grain lives in the same canvas: five fixed frames of noise that take turns (grainMs each),
   so nothing is generated anew and no second layer has to be redrawn.

   NoeasySmoke.start(canvas, opts) → { opts, set(opts), stop() }
     opts: bg, ink, ink2 [r,g,b] 0–1   amount 0–2 (now)   target 0–2 (amount eases towards it)
           alpha 0–1 (how much of the smoke shows through the dark)
           speed 0–3   cell (CSS px per dot)   fps   grain (strength)   grainMs (Infinity = still)
           hold (true = keep the last picture, draw nothing)
   With amount and target at 0 only the grain is drawn, and only when its frame changes. */
(function () {
  'use strict';
  var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
  var FS_BODY = [
    'uniform vec2 uRes;uniform float uTime;uniform float uAmount;uniform vec3 uBg;uniform vec3 uInk;uniform vec3 uInk2;',
    'uniform float uGrain;uniform float uFrame;uniform float uAlpha;',
    // a cheap hash: value noise for the smoke, and the grain (the dot plus the frame number)
    'float hash(vec2 p){vec3 q=fract(p.xyx*0.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}',
    'float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);',
    ' return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);}',
    'const mat2 m=mat2(0.80,0.60,-0.60,0.80);',
    'float fbm(vec2 p){float f=0.0;',
    ' f+=0.5000*noise(p);p=m*p*2.02;f+=0.2500*noise(p);p=m*p*2.03;',
    ' f+=0.1250*noise(p);p=m*p*2.01;f+=0.0625*noise(p);p=m*p*2.04;',
    ' f+=0.03125*noise(p);return f/0.96875;}',
    'float b2(vec2 a){a=floor(a);return fract(a.x*0.5+a.y*a.y*0.75);}',
    'float bayer(vec2 a){return b2(0.25*a)*0.0625+b2(0.5*a)*0.25+b2(a);}',
    // the smoke: the same folding as the Volchok background (fx.js), with the field rising slowly;
    // a faint layer over most of the screen and the brighter folds of the smoke itself
    'float smoke(vec2 uv,float time){',
    ' float t=(time+40.0)*0.032;',                         // start mid-flow, not from the first frame of the noise
    ' vec2 p=uv*1.55+vec2(0.0,-time*0.008);',
    ' vec2 q=vec2(fbm(p+vec2(0.0,t)),fbm(p+vec2(5.2,1.3)-t*0.7));',
    ' vec2 r=vec2(fbm(p+3.0*q+vec2(1.7,9.2)+t*0.5),fbm(p+3.0*q+vec2(8.3,2.8)-t*0.4));',
    ' float f=fbm(p+2.6*r);',
    ' return 0.20*smoothstep(0.22,0.55,f)+0.95*smoothstep(0.52,0.95,f)*(0.30+0.70*clamp(length(q)-0.35,0.0,1.0));',
    '}',
    'void main(){',
    ' vec2 s=gl_FragCoord.xy/uRes;float asp=uRes.x/uRes.y;',
    ' vec3 col=uBg;',
    ' if(uAmount>0.001){',                                  // no smoke yet (or any more): skip all the noise
    '  float dens=smoke(gl_FragCoord.xy/uRes.y,uTime);',
    '  vec2 v=s-0.5;dens*=1.0-dot(v,v)*0.9;',               // thinner towards the edges
    // the column with the buttons stays calmer, so the lettering reads over the smoke
    '  float shield=exp(-pow((s.x-0.5)/0.15,2.0))*smoothstep(0.08,0.22,s.y)*(1.0-smoothstep(0.55,0.7,s.y));',
    '  dens*=(1.0-0.6*shield)*uAmount;',
    '  float on=step(bayer(gl_FragCoord.xy)+0.02,dens);',
    '  col=mix(uBg,mix(uInk2,uInk,smoothstep(0.25,0.9,dens)),on*uAlpha);',   // alpha < 1: the dots sink into the dark
    ' }',
    ' vec2 g=floor(gl_FragCoord.xy)+uFrame*vec2(61.0,37.0);',
    ' col=mix(col,vec3(hash(g)),hash(g+vec2(17.0,93.0))*uGrain);',
    ' gl_FragColor=vec4(col,1.0);',
    '}'].join('\n');

  function start(canvas, opts) {
    var gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false,
                                          preserveDrawingBuffer: false, powerPreference: 'low-power' }) ||
             canvas.getContext('experimental-webgl');
    if (!gl) return null;
    var hp = gl.getShaderPrecisionFormat && gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
    var FS = 'precision ' + (hp && hp.precision > 0 ? 'highp' : 'mediump') + ' float;\n' + FS_BODY;
    function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
    var pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var U = {};
    ['uRes', 'uTime', 'uAmount', 'uBg', 'uInk', 'uInk2', 'uGrain', 'uFrame', 'uAlpha'].forEach(function (n) { U[n] = gl.getUniformLocation(pr, n); });
    var o = { bg: [0.082, 0.078, 0.075], ink: [0.56, 0.534, 0.469], ink2: [0.25, 0.238, 0.214], amount: 1, target: null,
              speed: 1, cell: 2, fps: 30, grain: 0.056, grainMs: 90, alpha: 1, hold: false, time: null };
    var t = 0, last = 0, raf = 0, alive = true, lastDraw = -1e9, frame = 0, drawnFrame = -1;
    function set(n) { for (var k in n) o[k] = n[k]; size(); draw(); }
    function size() {
      var w = Math.max(1, Math.round(canvas.clientWidth / o.cell)), h = Math.max(1, Math.round(canvas.clientHeight / o.cell));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
    }
    function draw() {
      gl.uniform2f(U.uRes, canvas.width, canvas.height);
      gl.uniform1f(U.uTime, o.time == null ? t : o.time);
      gl.uniform1f(U.uAmount, o.amount);
      gl.uniform1f(U.uGrain, o.grain);
      gl.uniform1f(U.uAlpha, o.alpha);
      gl.uniform1f(U.uFrame, frame);
      gl.uniform3fv(U.uBg, o.bg); gl.uniform3fv(U.uInk, o.ink); gl.uniform3fv(U.uInk2, o.ink2);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      drawnFrame = frame;
    }
    function stop() { alive = false; cancelAnimationFrame(raf); }
    function loop(now) {
      if (!alive) return;
      if (!canvas.isConnected) return stop();               // the menu is gone: so is the smoke
      raf = requestAnimationFrame(loop);
      var dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
      t += dt * o.speed;
      if (o.target != null && o.amount !== o.target) {      // the smoke gathers slowly and scatters faster
        var a = o.amount, k = Math.min(1, dt * (o.target < a ? 1.4 : 0.7));
        o.amount = Math.abs(o.target - a) < 0.002 ? o.target : a + (o.target - a) * k;
      }
      if (o.hold) return;
      frame = isFinite(o.grainMs) ? Math.floor(now / o.grainMs) % 5 : 0;
      var smokeDue = o.amount > 0.001 && now - lastDraw >= 1000 / o.fps - 2;   // the smoke is slow: 30 frames a second are plenty
      if (!smokeDue && frame === drawnFrame) return;        // only grain on screen and its frame hasn't changed: nothing to draw
      lastDraw = now;
      size(); draw();
    }
    for (var k in (opts || {})) o[k] = opts[k];
    size(); draw();
    raf = requestAnimationFrame(loop);
    return { set: set, opts: o, stop: stop, gl: gl };
  }
  window.NoeasySmoke = { start: start };
})();
(function(){
  const L=document.getElementById('loader'), mg=document.getElementById('mgrain');
  if(!L) return;
  // неподвижное зерно, пока строится зал: тот же шум, нарисованный один раз
  try{ const g=mg.getContext('2d'), c=document.createElement('canvas'); c.width=c.height=256;
    const cg=c.getContext('2d'), im=cg.createImageData(256,256), d=im.data;
    for(let i=0;i<d.length;i+=4){ const v=Math.random()*255|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=Math.random()*26|0; }
    cg.putImageData(im,0,0); const pat=g.createPattern(c,'repeat');
    const draw=()=>{ if(!mg.isConnected) return removeEventListener('resize',draw);
      mg.width=Math.max(2,innerWidth>>1); mg.height=Math.max(2,innerHeight>>1); g.fillStyle=pat; g.fillRect(0,0,mg.width,mg.height); };
    draw(); addEventListener('resize',draw); }catch(e){}
  requestAnimationFrame(()=>L.classList.add('lit'));      // лого проступает сверху вниз
})();

<script type="text/plain" id="hall-main">

const ARTS = window.__ARTS_OVERRIDE__ || ['nameless-king.jpg','morgenstern.jpg','mindscape-i.jpg',
 'another-bite-of-the-forbidden-fruit.jpg','pleroma-s-frontier.jpg','Rubedoexe.jpg'].map(f=>'../gallery/images/'+f);
const TEXSRC = window.__TEX_OVERRIDE__ || {wall:'/tex/wall.jpg',floor:'/tex/floor.jpg',shaft:'/tex/shaft.jpg',cap:'/tex/cap.jpg',glass:'/tex/glass.jpg',rose:'/tex/rose.jpg',sarc:'/tex/sarc.jpg',amber:'/tex/amber.jpg',runic:'/tex/runic.jpg'};
const WATER_SRC='assets/water.7efc2169.jpg';
const STEP_SRC='assets/step.0173de99.jpg';
const GRATE_SRC='assets/grate.9bb95561.png';


const DEC={crA:"assets/dec-cra.558b4150.jpg",crB:"assets/dec-crb.7e95f275.jpg",crC:"assets/dec-crc.d42c7890.jpg",crD:"assets/dec-crd.dadfdfd5.jpg",crE:"assets/dec-cre.df7761db.jpg",webA:"assets/dec-weba.940f263d.jpg",webB:"assets/dec-webb.f51e6623.jpg",deb1:"assets/dec-deb1.b17d3912.png",deb2:"assets/dec-deb2.5d7b174a.png",deb3:"assets/dec-deb3.6eddf9ad.png",floorA:"assets/dec-floora.105a3f17.jpg",maskA:"assets/dec-maska.901c4c0b.png",floorB:"assets/dec-floorb.24277510.jpg",maskB:"assets/dec-maskb.8c470c8b.png"};
const P = { W:12, COLH:13, DISS:22, BAY:5, NB:12,
  WIN_W:2.2, WIN_H:6.5, SILL:3.4, RECESS:0.45,
  CANVAS_H:3.0, CANVAS_CY:2.8, EYE:1.7,
  FOG:0x241405, SKY:0x000000, FOGD:0.028 }   // FOG — тёплая даль по горизонтали; SKY — фон, он же «потолок» над нефом, там свода нет;   // v41: зал стал 40 м — при 0.048 дальняя половина тонула в черноте
const LEN = P.NB*P.BAY, WALLH = P.DISS+4, UVS = 0.29;

const renderer = new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(RENDER_SCALE);   // PS1-пиксель: мельче рендер, честнее лоу-фай, быстрее мобайл (fx п.8)

const scene = new THREE.Scene(); window.__scene=scene; scene.fog = new THREE.FogExp2(P.FOG,P.FOGD);
// ===== РАСТВОРЕНИЕ ВВЕРХ =====
// Туман работает только по дистанции. Пока он был чёрным, он заодно уводил в ноль и свод:
// тот далеко, набирает полное насыщение и красится в цвет тумана. С тёплым туманом свод стал
// СВЕТЛЕЕ ближних нервюр и проявился как поверхность. Поэтому высоту гасим отдельно, поверх
// тумана: горизонталь остаётся тёплой, а всё выше CEIL_A уходит в чёрное независимо от дистанции.
const CEIL={ a:{value:0.55}, b:{value:1.0} };   // доли от dTop зоны, а не метры

function ceilFade(mat){

  // функция, поэтому проверять его на существование нельзя — условие сработает всегда.

    sh.uniforms.uCeilA=CEIL.a; sh.uniforms.uCeilB=CEIL.b;

      .replace('#include <common>','#include <common>\nuniform float uCeilA,uCeilB;\nvarying vec3 vCeilP;')
      .replace('#include <fog_fragment>','#include <fog_fragment>\nfloat dTop=(vCeilP.z<-60.0)?22.0:15.5;\ngl_FragColor.rgb*=1.0-smoothstep(dTop*uCeilA,dTop*uCeilB,vCeilP.y);');
  };

window.__camera=camera; camera.rotation.order='YXZ'; camera.position.set(0.5,P.EYE,-3.6);   // порядок важен: крен применяется последним

function sliceY(geo, step){

  let ymin=Infinity, ymax=-Infinity;
  for(let i=0;i<p.count;i++){const y=p.getY(i); if(y<ymin)ymin=y; if(y>ymax)ymax=y;}

  const clip=(poly,c,keepBelow)=>{                       // Сазерленд-Ходжман по плоскости y=c
    const out=[], n=poly.length, inside=v=> keepBelow ? v[1]<=c+EPS : v[1]>=c-EPS;
    for(let i=0;i<n;i++){
      const a=poly[i], b=poly[(i+1)%n], ia=inside(a), ib=inside(b);
      if(ia) out.push(a);
      if(ia!==ib){ const t=(c-a[1])/(b[1]-a[1]); if(t>EPS&&t<1-EPS) out.push(lerp(a,b,t)); } }
    return out; };

    if(ar(poly[0],poly[i],poly[i+1])>1e-7) dst.push([poly[0],poly[i],poly[i+1]]); };

      for(const v of t){ if(v[1]<c-EPS)lo++; else if(v[1]>c+EPS)hi++; }
      if(lo===0||hi===0){ next.push(t); continue; }

    pos.set(p.array, vo*3); nor.set(n.array, vo*3);

  g.fillStyle='#160f08'; g.fillRect(0,0,w,h);   // опаковый тёмный фон: прячет луч за стеклом, углы = свинец

/* ===================================================================

   Камень больше не считает лампы каждый кадр: свет посчитан один раз при загрузке —
   по той же формуле, что у three (и что освещает картины), — и лежит в вершинах.
   Живыми остаются пол и ступени с глянцем (шероховатость меньше 0.8), декали и всё
   прозрачное; лучи, ореолы, пыль и картины и так со своим светом.
   Как повторяется MeshStandardMaterial:
     • рассеянный свет = текстура × тон × (рассеянный + Σ ламп N·L·затухание) —
       множитель ложится в цвет вершины;
     • матовый блеск (GGX, F0 0.04) от цвета камня не зависит — отдельная прибавка aBakeS.
       У тёмного камня он даёт до трети яркости, выбросить его нельзя. Взгляд для блеска —
       к зрителю посреди своего зала на высоте глаз: у такого камня блеск от угла почти не зависит;
     • нормаль — грани, как при flatShading: у каждой грани свои вершины, колонны остаются гранёными;

       высокой колонне размазалось бы между низом и верхом). Решение — по самому ребру,

   живым (в среднем 0.8 из 255), поэтому человек входит сразу, как раньше, а сборки тихо
   подменяются на запечённые в первые секунды прогулки — на глаз это незаметно. Если
   браузер поток не даст — считается кусками в основном потоке, результат тот же.

// --- врезка в шейдер MeshBasicMaterial: свет места, блик, кривая по яркости ---
window.__artShaderOK=0;
function patchArtMat(mat, w, h){
  const u={ uShine:{value:-1}, uSize:{value:new THREE.Vector2(w,h)} };
  mat.userData.u=u;
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms, u, ARTG);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float aLit;\nvarying float vLit;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLit=aLit;');
    const hadMap = sh.fragmentShader.indexOf('#include <map_fragment>')>=0;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
uniform float uShine,uExpo,uTMExp,uWarm,uAmp;
uniform vec3 uWarmCol;
uniform vec2 uSize;
varying float vLit;
const vec3 LUMA=vec3(0.2126,0.7152,0.0722);
const vec3 AMBER=vec3(1.0,0.86,0.66);
// ACES на сером: у камня та же кривая, только по каналам (матрицы ACES серое не меняют)
float acesGray(float y){
  float x=y*uTMExp/0.6;
  float a=x*(x+0.0245786)-0.000090537;
  float b=x*(0.983729*x+0.4329510)+0.238081;
  return clamp(a/b,0.0,1.0);
}`)
      .replace('#include <map_fragment>', `#include <map_fragment>
{ // 1) свет места: цвет файла × освещённость × экспозиция
  vec3 c=diffuseColor.rgb*(vLit*uExpo);
  // 2) тёплый оттенок ламп — одинаково для всех работ (0 — нейтрально)
  c*=mix(vec3(1.0), uWarmCol, uWarm);
  // 3) блик: ось и ширина в метрах, поэтому ход одинаков на любом формате
  if(uShine>=0.0){
    vec2 pp=(vUv-0.5)*uSize;
    float ca=0.9284, sa=0.3714;
    float ax=pp.x*ca+pp.y*sa;
    float hs=0.5*(abs(uSize.x*ca)+abs(uSize.y*sa));
    float bw=clamp(0.24*hs, 0.08, 0.90);
    float ctr=mix(-(hs+bw), hs+bw, uShine);
    float q=(ax-ctr)/bw;
    float env=smoothstep(0.0,0.14,uShine)*(1.0-smoothstep(0.86,1.0,uShine));
    c+=exp(-q*q*2.2)*uAmp*env*AMBER;
  }
  // 4) кривая по яркости: все каналы на одно число — цвет не уезжает
  float Y=dot(c,LUMA);
  c*=acesGray(Y)/max(Y,1e-5);
  float mx=max(c.r,max(c.g,c.b));
  if(mx>1.0) c/=mx;                  // яркий насыщенный цвет не режется по одному каналу
  diffuseColor.rgb=c; }`);
    if(hadMap && sh.fragmentShader.indexOf('acesGray')>=0) window.__artShaderOK++;
  };
  mat.customProgramCacheKey=()=>'noeasy-art-v2';
  return u;
}
// длительность блика от габарита вдоль оси прохода: маленький холст быстрее,
// панорама дольше, но по корню, иначе разброс становится дёрганым
function shineDurFor(w,h){
  const hs=0.5*(Math.abs(w*0.9284)+Math.abs(h*0.3714));
  return ART.SHINE_DUR*Math.sqrt(hs/1.95);      // 1.95 — опорный квадрат 3x3 м
}

function titleOf(src){   // только для демо-развески: имя из имени файла

/* Название над картиной. Рисуется поверх всего (без проверки глубины): это
   плоская табличка, которая всегда смотрит на камеру, и под углом её дальний
   край уходил за плоскость стены — стена его закрывала. Взамен табличку
   гасит artTick, когда камера за стеной своей картины или на другом этаже,
   иначе названия просвечивали бы сквозь стены и пол балкона.
   Текст — вдвое чётче прежнего, тем же размером в сцене. Длинное название
   сначала ужимается, в крайнем случае обрезается многоточием. */
const TITLE_W=1024, TITLE_H=96, TITLE_M_PER_PX=2.3/512;   // 1 px = 4,5 мм — как было
function makeTitleSprite(text){
  const c=document.createElement('canvas'); c.width=TITLE_W; c.height=TITLE_H;
  const t=new THREE.CanvasTexture(c); t.generateMipmaps=false; t.minFilter=THREE.LinearFilter;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,opacity:0,depthWrite:false,depthTest:false}));
  s.renderOrder=10;                                   // после лучей, пыли и прочей прозрачности
  s.scale.set(TITLE_W*TITLE_M_PER_PX, TITLE_H*TITLE_M_PER_PX, 1);
  const draw=()=>{ const g=c.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,TITLE_W,TITLE_H);
    const maxW=TITLE_W-60;                            // запас под размытие тени
    let size=44, str=String(text||'');
    const setFont=()=>{ g.font=size+'px Mekzantine, Georgia, serif'; try{ g.letterSpacing=Math.round(size*3/44)+'px'; }catch(e){} };
    setFont();
    let w=g.measureText(str).width;
    if(w>maxW){ size=Math.max(26, Math.floor(size*maxW/w)); setFont(); w=g.measureText(str).width; }
    while(w>maxW && str.length>1){ str=str.slice(0,-2).trimEnd()+'…'; w=g.measureText(str).width; }
    g.textAlign='center'; g.textBaseline='middle';
    g.shadowColor='rgba(0,0,0,0.9)'; g.shadowBlur=20; g.shadowOffsetY=4;
    g.fillStyle='#efe6c8'; g.fillText(str,TITLE_W/2,50); t.needsUpdate=true; };
  draw();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  return s;
}

const ART_TEX_MAX=1024;   // потолок текстуры работы в сцене (бриф: 1024); полный размер — только в панели
function capTex(tex){
  const img=tex.image; if(!img) return;
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height, m=Math.max(w,h);
  if(!(m>ART_TEX_MAX)) return;
  const k=ART_TEX_MAX/m, c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
  const g=c.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  g.drawImage(img,0,0,c.width,c.height);
  tex.image=c; tex.needsUpdate=true;
}
// счётчик картин для полоски загрузки: сколько заказано и сколько пришло (или не пришло)
const ART_LOAD={total:0, done:0, listed:false}; window.__artLoad=ART_LOAD;
// s — узел из SLOTS; art — {src, srcHi, title, meta}; meta — запись works.json (null в демо)
/* КАРТИНА В ДВА ШАГА. Сначала на холст встаёт лёгкое превью 700 px (gallery/thumbs, их делает
   сам сайт — .github/workflows/gallery-thumbs.yml), и экран загрузки ждёт только их. Чёткая версия
   1200 px качается, когда подходишь ближе SHARP_AT метров, и тихо подменяет превью (в сцене всё равно
   потолок 1024 px, так что оригинал для стены не нужен). Нет превью — берётся оригинал, как раньше. */
function hangCanvas(s, art){
  const px=s.x, pz=s.z, ry=s.ry, cy=s.cy||P.CANVAS_CY, hh=s.hh, mw=s.mw;
  const src=art.src, light=art.light||src;
  ART_LOAD.total++;
  const fail=()=>{ ART_LOAD.done++; console.warn('[works] картинка не загрузилась:', s.id, src); };
  loader.load(light, tex=>hang(tex, light), undefined, ()=>{
    if(light===src) return fail();
    loader.load(src, tex=>hang(tex, src), undefined, fail); });
  function hang(tex, url){
    ART_LOAD.done++;
    capTex(tex);
    tex.encoding=THREE.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
    const ar=tex.image.width/tex.image.height; let h=hh||P.CANVAS_H, w=h*ar;
    if(mw && w>mw){ h*=mw/w; w=mw; }   // потолок ширины: соседние холсты не наезжают друг на друга
    const dark=new THREE.MeshStandardMaterial({color:0x1c1510,roughness:0.9});
    const nx=Math.sin(ry), nz=Math.cos(ry);
    const face=new THREE.MeshBasicMaterial({map:tex,color:0xffffff,toneMapped:false});   // кривая — своя, по яркости
    const u=patchArtMat(face,w,h);
    const geo=new THREE.BoxGeometry(w,h,0.07,5,5,1);
    const slab=new THREE.Mesh(geo,[dark,dark,dark,dark,face,dark]);
    slab.position.set(px+nx*0.037, cy, pz+nz*0.037); slab.rotation.y=ry; scene.add(slab);
    // светимость места — по вершинам лицевой грани: свет ползёт по холсту так же, как по стене
    { const pos=geo.attributes.position, aLit=new Float32Array(pos.count);
      const sx=slab.position.x, sy=slab.position.y, sz=slab.position.z;
      const cosr=Math.cos(ry), sinr=Math.sin(ry);
      let sum=0;
      for(let i=0;i<pos.count;i++){
        const lx=pos.getX(i), ly=pos.getY(i), lz=pos.getZ(i);
        const wx=sx + lx*cosr + lz*sinr, wy=sy+ly, wz=sz - lx*sinr + lz*cosr;
        const e=sampleLitRGB(wx,wy,wz, nx,0,nz), t=stoneTint(wx,wy,wz, nx,nz)*stoneTone(wx,wy,wz);
        const v=(0.2126*e[0]+0.7152*e[1]+0.0722*e[2])*t;
        aLit[i]=v; sum+=v; addWarm(e);
      }
      geo.setAttribute('aLit', new THREE.BufferAttribute(aLit,1));
      slab.userData.litMean=sum/pos.count; }   // ВПЛОТНУЮ: полутолщина+2мм
    const title=art.title;
    const sp=makeTitleSprite(title);
    sp.position.set(px+nx*0.06, cy+h/2+0.34, pz+nz*0.06); scene.add(sp);   // у самой стены: рисуется поверх, отступ не нужен
    // доступность показывается пробуждением самого холста (яркость/насыщенность/блик), а не рамкой
    artItems.push({slab, sp, src, title, face, kind:'art', u,
                   litMean:slab.userData.litMean, w, h, shineT:null,   // litMean — средняя освещённость места (для отладки)
                   shineDur:shineDurFor(w,h),
                   slot:s.id, srcHi:art.srcHi||'', meta:art.meta||null, pts:art.pts||'',
                   texUrl:url, sharp:(art.sharp && url!==src) ? art.sharp : '', sharpState:0,
                   nx, nz, floorY:cy-P.CANVAS_CY});   // нормаль стены и уровень пола — для видимости названия
  }
}
/* чёткая версия картины, когда к ней подошли: подменяет превью на том же холсте */
function sharpen(a){
  a.sharpState=1;
  loader.load(a.sharp, tex=>{
    capTex(tex);
    tex.encoding=THREE.sRGBEncoding; tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
    const old=a.face.map; a.face.map=tex; a.texUrl=a.sharp; a.sharpState=2;
    if(old && old!==tex) old.dispose();
  }, undefined, ()=>{ a.sharpState=3; });
}

async function loadWorks(){
  if(Array.isArray(window.__WORKS_OVERRIDE__)) return {list:window.__WORKS_OVERRIDE__, base:location.href};
  if(/[?&]demo\b/.test(location.search)) return null;
  const url=new URL(WORKS_URL, location.href);
  url.searchParams.set('v', String(Date.now()));   // кэш Pages держит минуты
  const r=await fetch(url.href, {cache:'no-store'});

// имя файла точек — как у HD-оригинала (hi_base в vgallery.py бота): images/orph-e.JPG → points/orph-e.json
function ptsBase(w){

  if(!b) b=String((w&&w.title)||'без названия').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'work';
  return b;

function hangWorks(list, base){
  const abs=u=>{ try{ return u ? new URL(u, base).href : ''; }catch(e){ return ''; } };
  const taken=new Set(); let n=0;
  for(const w of list){

    if(taken.has(s.id)){ console.warn('[works] узел занят дважды', s.id, w.title); continue; }

/* ===================================================================
   МЕТАДАННЫЕ РАБОТЫ — из записи works.json
   ===================================================================
   Поля те же, что у галереи сайта; их пишет аппка Mindgate при публикации:
     title, date ("2026-03-01"), year, style, workType, avail[], links[];
     src   — обычное качество (то же, что на сайте), висит на холсте;
     srcHi — HD-оригинал (аппка: карточка работы → HD), грузится только в панели;
     slot  — узел развески (см. SLOTS);
     points — сколько у работы точек-пасхалок, сами точки — в points/<имя>.json (см. ТОЧКИ-ПАСХАЛКИ);
     desc  — необязательное описание (бот пока не пишет).
   Панель показывает src сразу — он уже в кэше от текстуры, — а srcHi
   подменяет его, когда догрузится и декодируется: открытие не ждёт
   мегабайт. Кнопка покупки прячется, если ссылок нет (коммишены).
   В демо-развеске данных нет — подставляется ART_META_DEMO.
   =================================================================== */
const ART_META_DEMO={ date:'', year:'', style:'Digital Painting', workType:'Personal',
  avail:['Print'], desc:'', links:[{label:'Print', url:'https://shop.noeasy.xyz'}] };

function metaFor(a){
  const w=a.meta;
  if(!w) return Object.assign({}, ART_META_DEMO);
  return { date:w.date||'', year:w.year||'', style:w.style||'', workType:w.workType||'',
    avail:Array.isArray(w.avail)?w.avail:[], desc:w.desc||'',
    links:(Array.isArray(w.links)?w.links:[]).filter(l=>l && l.url) };
}
const escHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{ u=String(u||'').trim(); return /^https?:\/\//i.test(u)?u:'#'; };
function fmtDate(dateStr, yearFallback){          // как на сайте
  if(dateStr){ const d=new Date(dateStr+'T00:00:00');
    if(!isNaN(d)) return d.toLocaleString('en-US',{month:'long',year:'numeric'}); }
  return yearFallback||'';
}
/* ---------- ОТКРЫТИЕ КАРТИНЫ: КЛАССИКА ----------
   Подложка, следом работа, следом подписи по очереди. Никаких переходов между
   состояниями сцены: холст на стене не гасится, панель просто лежит поверх.
   Единственное, что осталось от прежней затеи, — очерёдность проявления текста:
   сначала вещь, потом её имя, потом возможность её получить. */
const RIT={ tTitle:150, tMeta:330, tBuy:500, tCross:660, out:300,
            glFirst:3000, glEvery:9000 };
const AIMG=AW.querySelector('img'), IW=AW.querySelector('.iw'), CLOSE=AW.querySelector('.close');
const ETITLE=AW.querySelector('.ftitle'), EMETA=AW.querySelector('.meta'),
      EDESC=AW.querySelector('.desc'), EPW=AW.querySelector('.pw'), EBUY=AW.querySelector('.buy');
const ERV=AW.querySelector('.rv'), EACTS=AW.querySelector('.acts');   // Reveal и ряд кнопок
let phase='idle', glTimer=0, revTimers=[], outTimer=0;

// Размер считаем сами, а не отдаём CSS: max-width/max-height только ограничивают
// и не растягивают мелкий файл, из-за чего работа занимала половину кадра.
function fitImg(){
  if(!AIMG.naturalWidth) return;
  const wide = window.matchMedia('(orientation:landscape) and (min-width:840px)').matches;
  const maxW = innerWidth  * (wide ? 0.62 : 0.94);
  const maxH = innerHeight * (wide ? 0.88 : 0.70);
  const ar = AIMG.naturalWidth/AIMG.naturalHeight;
  let w = maxW, h = w/ar;
  if(h > maxH){ h = maxH; w = h*ar; }
  AIMG.style.width = Math.round(w)+'px'; AIMG.style.height = Math.round(h)+'px';
}
addEventListener('resize', ()=>{ if(phase!=='idle'){ fitImg(); fixVsep(); } });

function clearRev(){ for(const t of revTimers) clearTimeout(t); revTimers=[]; clearTimeout(outTimer); }
function revOff(){ IW.classList.remove('on'); ETITLE.classList.remove('on');
  EMETA.classList.remove('on'); EDESC.classList.remove('on');
  EPW.classList.remove('on'); ERV.classList.remove('on'); CLOSE.classList.remove('on'); }
function buildTitle(txt){
  ETITLE.classList.remove('on');
  ETITLE.innerHTML=txt.split('').map((ch,i)=>{
    const d=(i*0.028).toFixed(3)+'s';
    return ch===' ' ? '<span class="ch sp" style="transition-delay:'+d+'"> </span>'
                    : '<span class="ch" style="transition-delay:'+d+'">'+
                      ch.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>';
  }).join('');
}
function gleamOn(){
  clearInterval(glTimer);
  const fire=()=>{ EBUY.classList.remove('gleam'); void EBUY.offsetWidth; EBUY.classList.add('gleam'); };
  setTimeout(()=>{ if(phase==='open'){ fire();
    glTimer=setInterval(()=>{ if(phase==='open') fire(); else clearInterval(glTimer); }, RIT.glEvery); } }, RIT.glFirst);
}
function reveal(){
  phase='open'; clearRev();

  revTimers.push(setTimeout(()=>ETITLE.classList.add('on'), RIT.tTitle));
  revTimers.push(setTimeout(()=>{ EMETA.classList.add('on'); EDESC.classList.add('on'); }, RIT.tMeta));
  revTimers.push(setTimeout(()=>{ EPW.classList.add('on'); ERV.classList.add('on'); }, RIT.tBuy));

function closeArt(){

let openSeq=0;
// дата | теги в одну строку; если теги не влезли и ушли вниз, черта повисла бы в воздухе
function fixVsep(){
  const yr=AW.querySelector('.yr'), vs=AW.querySelector('.vsep'), tg=AW.querySelector('.tags');
  vs.style.display=yr.textContent?'block':'none';

function openArt(a){

  clearRev(); clearInterval(glTimer);

  AW.querySelector('.tags').innerHTML=parts.map(t=>'<span class="tag">'+escHtml(t)+'</span>')
    .join('<span class="tsep">/</span>');
  EDESC.textContent=m.desc||''; EDESC.style.display=m.desc?'block':'none';
  AW.querySelector('.dd').innerHTML=m.links.map(l=>
    '<a href="'+escHtml(safeUrl(l.url))+'" target="_blank" rel="noopener">'+escHtml(l.label||'Link')+'</a>').join('');
  EPW.style.display=m.links.length?'':'none';            // коммишены: купить нечего
  const hasPts=ptsSetup(a, seq);                          // Reveal — только у работы с точками
  EACTS.style.display=(m.links.length||hasPts)?'':'none';
  revOff();
  AW.style.display='flex'; AW.classList.remove('lit');
  requestAnimationFrame(()=>AW.classList.add('lit'));     // подложка приходит первой
  const lo=a.texUrl||a.src, hi=a.srcHi||(a.src!==lo ? a.src : '');   // сразу — то, что уже на стене; потом — HD или оригинал
  const go=()=>{ fitImg(); fixVsep(); requestAnimationFrame(reveal); };
  AIMG.onload=null;
  const cur=AIMG.getAttribute('src');
  if(cur!==lo && !(hi && cur===hi)) AIMG.src=lo;          // HD этой работы уже на месте — оставляем
  // проявление нельзя пускать до декодирования, иначе проступит пустота
  if(AIMG.complete && AIMG.naturalWidth) go(); else AIMG.onload=go;
  // HD тянется только сейчас и подменяет обычную версию, когда декодирован
  if(hi && hi!==lo && AIMG.getAttribute('src')!==hi){

    const swap=()=>{
      if(seq!==openSeq || phase==='idle') return;          // панель уже закрыта или открыта другая работа
      if(phase==='open') AIMG.onload=()=>fitImg();          // проявление уже было — только пересчёт размера

/* ---------- ТОЧКИ-ПАСХАЛКИ ----------
   Ставятся в аппке Mindgate (кнопка «Галерея» в чате с ботом → работа → Точки) и лежат рядом
   с works.json: gallery/points/<имя>.json = {"v":1,"points":[{id,x,y,text,tier}]},
   x и y — доли от 0 до 1 от картинки, поэтому точка стоит на месте при любом размере и в HD.
   В записи работы — только число "points": есть оно — в панели есть кнопка Reveal.
   Файл грузится один раз за визит, когда работу открыли. */
const PTS={cache:new Map(), url:'', list:[], on:false, tip:null};
function loadPts(url){
  if(!PTS.cache.has(url)){
    const u=new URL(url); u.searchParams.set('v', String(Date.now()));   // кэш Pages держит минуты — как у works.json
    PTS.cache.set(url, fetch(u.href, {cache:'no-store'})
      .then(r=>{ if(r.status===404) return {points:[]}; if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(d=>(Array.isArray(d&&d.points)?d.points:[])
        .filter(p=>p && String(p.text||'').trim() && isFinite(p.x) && isFinite(p.y) && (!p.tier || p.tier==='public'))
        .map((p,i)=>({id:String(p.id||('p'+i)), x:Math.min(1,Math.max(0,+p.x)), y:Math.min(1,Math.max(0,+p.y)), text:String(p.text).trim()})))
      .catch(e=>{ PTS.cache.delete(url); console.warn('[points] не загрузились:', url, e.message); return null; }));   // сеть — повторим по нажатию
  }
  return PTS.cache.get(url);
}
function drawMarks(){
  IW.querySelectorAll('.vmark').forEach(el=>el.remove());
  PTS.list.forEach((p,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='vmark'; b.dataset.pt=p.id;
    b.style.left=(p.x*100).toFixed(2)+'%'; b.style.top=(p.y*100).toFixed(2)+'%'; b.style.transitionDelay=(i*70)+'ms';
    b.setAttribute('aria-label','Detail '+(i+1)); b.tabIndex=PTS.on?0:-1;
    IW.appendChild(b);
  });
}
function hideTip(){ PTS.tip=null; IW.querySelectorAll('.vtip').forEach(el=>el.remove());
  IW.querySelectorAll('.vmark.act').forEach(b=>b.classList.remove('act')); }
// текст всегда целиком внутри картины: под точкой, а если не влезает — над ней
function showTip(id){
  hideTip(); const p=PTS.list.find(q=>q.id===id); if(!p) return;
  PTS.tip=id; IW.querySelectorAll('.vmark').forEach(b=>b.classList.toggle('act', b.dataset.pt===id));
  const W=IW.clientWidth, H=IW.clientHeight, t=document.createElement('div');
  t.className='vtip'; t.textContent=p.text; t.style.visibility='hidden'; t.style.maxWidth=Math.max(120,Math.min(270,W-8))+'px';
  IW.appendChild(t);
  const tw=t.offsetWidth, th=t.offsetHeight, x=p.x*W, y=p.y*H;
  let top=y+20; if(top+th>H-4) top=y-20-th;
  t.style.left=Math.round(Math.max(4,Math.min(W-tw-4,x-tw/2)))+'px';
  t.style.top=Math.round(Math.max(4,Math.min(H-th-4,top)))+'px';
  t.style.visibility='';
}
function ptsOff(){ PTS.on=false; hideTip(); AW.classList.remove('pts'); ERV.setAttribute('aria-pressed','false');
  IW.querySelectorAll('.vmark').forEach(b=>{ b.tabIndex=-1; }); }
function gotPts(url, seq, list){
  if(seq!==openSeq || PTS.url!==url || !list) return;     // панель уже про другую работу, или сеть подвела
  if(!list.length){ ERV.hidden=true; ptsOff(); if(EPW.style.display==='none') EACTS.style.display='none'; return; }
  PTS.list=list; ERV.querySelector('.cnt').textContent=String(list.length); drawMarks();
}
// вызывается из openArt: true — у работы есть точки и кнопка показана
function ptsSetup(a, seq){
  ptsOff(); PTS.list=[]; PTS.url='';
  IW.querySelectorAll('.vmark').forEach(el=>el.remove());
  const n=Math.floor(+((a.meta&&a.meta.points)||0)), url=a.pts||'';
  ERV.hidden=!(url && n>0);
  if(ERV.hidden) return false;
  PTS.url=url; ERV.querySelector('.cnt').textContent=String(n);
  loadPts(url).then(list=>gotPts(url, seq, list));
  return true;
}
ERV.addEventListener('click',e=>{ e.stopPropagation(); SND.ui(); if(navigator.vibrate) navigator.vibrate(6);
  AW.querySelector('.dd').classList.remove('open'); EBUY.classList.remove('open');
  if(PTS.on){ ptsOff(); return; }
  PTS.on=true; AW.classList.add('pts'); ERV.setAttribute('aria-pressed','true');
  if(window.noeasy) noeasy.track('reveal',{t:ETITLE.textContent});
  IW.querySelectorAll('.vmark').forEach(b=>{ b.tabIndex=0; });
  if(!PTS.list.length && PTS.url){ const url=PTS.url, seq=openSeq; loadPts(url).then(list=>gotPts(url, seq, list)); } });
IW.addEventListener('click',e=>{
  const b=e.target.closest('.vmark');
  if(b){ SND.ui(); if(PTS.tip===b.dataset.pt) hideTip(); else showTip(b.dataset.pt); return; }

{ const HB=document.getElementById('hudmenu'), PS=document.getElementById('pause');

/* ---------- ПОДСКАЗКА УПРАВЛЕНИЯ ----------

/* ---------- ЗВУК ----------
   Файлы лежат рядом со страницей, в the-halls/audio/. Какой файл и
   насколько громко — в audio/sounds.json (правится в редакторе GitHub,
   страницу трогать не нужно). Без sounds.json действуют значения ниже;
   нет файла — этот звук просто молчит.

     ambient     фон на всю прогулку, по кругу
     ui          щелчок интерфейса: выбор локации, выход на сайт, бургер,
                 кнопка звука, Purchase
     step        шаг: сам подстраивается под ход, ноги по очереди
                 (src может быть списком файлов — тогда они чередуются)
     reverb      эхо собора: не файл, а сам зал. rt — длина хвоста в секундах,
                 wetDb — громкость эха. У каждого звука verb — сколько его
                 уходит в эхо (0 — сухой). Сейчас эхо только у шагов.
     artOpen     открыли картину          artClose  закрыли картину
     enterClick  нажали ENTER — «дверь», звучит сразу
     enter       «телепорт» в зал, через delay секунд после нажатия

   ЗАГРУЗКА. Короткие звуки декодируются заранее. Фон качается с первой
   секунды одним потоком: как только пришли первые headSec секунд трека,
   их уже можно играть (MP3 режется по кадрам), а полный файл докачивается
   во время прогулки и подменяет «голову» с того же места. Если голова
   кончилась раньше, чем докачался файл, она крутится по кругу.
   Экран загрузки ждёт голову фона, короткие звуки, сцену и картины.

   УРОВНИ — gainDb в sounds.json. Проба без коммитов, в дБ: ?amb= ?ui=
   ?open= ?close= ?door= ?enter= (перекрывают sounds.json).
   ?testaudio — фон с устройства, никуда не загружается.
   ?snddebug — полоска состояния (на iPad нет консоли).

   КАК УСТРОЕНО. Громкость — через Web Audio: на iOS audio.volume только
   для чтения. Фон — два <audio> с перекрёстным затуханием: у MP3 на стыке
   петли пауза.
     голоса фона   → ambBus (gainDb) → ambFade (вход 0→1) → master
     короткие звуки → sfxBus → master;   master (вкл/выкл) → лимитер → выход
   Щелчок самой кнопки звука идёт мимо master — его слышно и при выключении. */
const SND=(()=>{
  const qs=new URLSearchParams(location.search);
  const LS='noeasy.sound';
  const AUDIO_DIR=new URL('audio/', location.href);
  const cfg={
    ambient:   { src:'ambient.mp3',     gainDb:-15, fadeIn:4, fadeOut:0.6, xfade:6, headSec:45 },
    ui:        { src:'ui.mp3',          gainDb:-9 },
    artOpen:   { src:'art-open.mp3',    gainDb:-7 },
    artClose:  { src:'art-close.mp3',   gainDb:-13 },
    enterClick:{ src:'enter-click.mp3', gainDb:-9 },
    enter:     { src:'enter.mp3',       gainDb:-10, delay:0.45 },
    step:      { src:'step.mp3',        gainDb:-14, pitch:0.05, pan:0.28, dyn:0.35, verb:0.6 },
    reverb:    { wetDb:0, rt:3.2 },
  };
  const SFX=['ui','artOpen','artClose','enterClick','enter','step'];
  const QS={ambient:'amb', ui:'ui', artOpen:'open', artClose:'close', enterClick:'door', enter:'enter', step:'step'};
  const NUM=['gainDb','fadeIn','fadeOut','xfade','headSec','delay','pitch','pan','dyn','verb','wetDb','rt'];
  let on=true; try{ on=localStorage.getItem(LS)!=='off'; }catch(e){}
  let ctx=null, lim=null, master=null, ambBus=null, ambFade=null, sfxBus=null, verbIn=null, verbOut=null, room='';
  let voices=null, cur=0, entered=false, loopTimer=0, stopSeq=0, hideT=0, testSrc='', upgrading=false, cfgLoaded=false;
  const bufs={}, raw={}, status={}, sfxDone={};
  const AMB={ head:'', full:'', headSec:0, kbps:0, recv:0, total:0, target:0, state:'idle' };
  const dB=d=>Math.pow(10,d/20);
  const url=k=>new URL(cfg[k].src, AUDIO_DIR).href;
  function applyQs(){
    for(const k in QS){ const q=parseFloat(qs.get(QS[k])); if(isFinite(q)) cfg[k].gainDb=q; }
    { const w=parseFloat(qs.get('verb')); if(isFinite(w)) cfg.reverb.wetDb=w; }   // ?verb=-3 — громкость эха в дБ
    if(ambBus) ambBus.gain.value=dB(cfg.ambient.gainDb);
  }
  applyQs();

  // ---- короткие звуки: декодируются до первого касания ----
  function decodeOffline(ab){
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    if(!OAC) return Promise.reject(new Error('нет OfflineAudioContext'));
    const oc=new OAC(2,1,44100);
    return new Promise((res,rej)=>{ const p=oc.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });
  }
  function loadOne(k, src, i){      // i — номер варианта или null, если файл один
    return fetch(new URL(src, AUDIO_DIR).href)
      .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
      .then(ab=>{ if(i===null) raw[k]=ab.slice(0); return decodeOffline(ab); })
      .then(b=>{ if(i===null) bufs[k]=b; else { if(!Array.isArray(bufs[k])) bufs[k]=[]; bufs[k][i]=b; } })
      .catch(e=>{ if(i===null && raw[k]){ if(ctx) decodeLive(k); throw e; } throw e; });
  }
  function loadSfx(k){
    status[k]='грузится';
    const src=cfg[k].src, many=Array.isArray(src);
    const all=many ? src.map((s,i)=>loadOne(k,s,i).catch(e=>{ console.warn('[snd] '+k+'['+i+']:', e.message); }))
                   : [loadOne(k,src,null).catch(e=>{ status[k]=raw[k]?'декод после касания':'нет файла';
                       if(!raw[k]) console.warn('[snd] '+k+':', e.message); })];
    return Promise.all(all).then(()=>{
      const ok=Array.isArray(bufs[k]) ? bufs[k].filter(Boolean).length : (bufs[k]?1:0);
      if(ok) status[k]=many ? ('ok, вариантов '+ok) : 'ok';
      else if(many) status[k]='нет файлов';
      sfxDone[k]=true; });
  }
  function decodeLive(k){          // запасной путь: декодировать уже живым контекстом
    if(!raw[k] || bufs[k]) return;
    ctx.decodeAudioData(raw[k].slice(0), b=>{ bufs[k]=b; status[k]='ok'; }, ()=>{ status[k]='не декодируется'; });
  }

  // ---- фон: один поток, голова играбельна раньше полного файла ----
  function mp3Info(u8){             // → {audio: смещение первого кадра, kbps: средний поток}
    let off=0;
    if(u8.length>=10 && u8[0]===0x49 && u8[1]===0x44 && u8[2]===0x33){
      off=10+((u8[6]&127)<<21|(u8[7]&127)<<14|(u8[8]&127)<<7|(u8[9]&127)); if(u8[5]&0x10) off+=10; }
    const T1=[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320];
    const T2=[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
    for(let i=off;i+4<u8.length && i<off+65536;i++){
      if(u8[i]!==0xFF || (u8[i+1]&0xE0)!==0xE0) continue;
      const ver=(u8[i+1]>>3)&3, lay=(u8[i+1]>>1)&3, bri=(u8[i+2]>>4)&15, sri=(u8[i+2]>>2)&3;
      if(ver===1 || lay!==1 || bri===0 || bri===15 || sri===3) continue;       // только Layer III
      let kbps=(ver===3?T1:T2)[bri];
      // VBR: заголовок Xing/Info в первом кадре знает число кадров и байтов
      const mono=((u8[i+3]>>6)&3)===3;
      const side=ver===3?(mono?17:32):(mono?9:17);
      const x=i+4+side;
      if(x+16<=u8.length){
        const tag=String.fromCharCode(u8[x],u8[x+1],u8[x+2],u8[x+3]);
        if(tag==='Xing'||tag==='Info'){
          const fl=(u8[x+4]<<24|u8[x+5]<<16|u8[x+6]<<8|u8[x+7])>>>0;
          if((fl&3)===3){
            const frames=(u8[x+8]<<24|u8[x+9]<<16|u8[x+10]<<8|u8[x+11])>>>0;
            const bytes=(u8[x+12]<<24|u8[x+13]<<16|u8[x+14]<<8|u8[x+15])>>>0;
            const sr=[[11025,12000,8000],null,[22050,24000,16000],[44100,48000,32000]][ver][sri];
            const spf=ver===3?1152:576;
            if(frames>0 && bytes>0) kbps=bytes*8/(frames*spf/sr)/1000;
          }
        }
      }
      return {audio:i, kbps};
    }
    return null;
  }
  function loadAmbient(){
    if(AMB.state!=='idle' || testSrc) return;
    AMB.state='loading'; status.ambient='грузится';
    fetch(url('ambient')).then(async r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      AMB.total=+(r.headers.get('content-length')||0);
      const chunks=[];
      const blob=()=>URL.createObjectURL(new Blob(chunks,{type:'audio/mpeg'}));
      const first=n=>{ const u=new Uint8Array(Math.min(n,AMB.recv)); let o=0;
        for(const c of chunks){ if(o>=u.length) break; const t=c.subarray(0,u.length-o); u.set(t,o); o+=t.length; } return u; };
      let info=null;
      if(r.body && r.body.getReader){
        const rd=r.body.getReader();
        for(;;){
          const {done,value}=await rd.read(); if(done) break;
          chunks.push(value); AMB.recv+=value.length;
          if(testSrc) continue;
          if(!info && AMB.recv>=16){
            const h=first(16);
            const id3=(h[0]===0x49&&h[1]===0x44&&h[2]===0x33)?10+((h[6]&127)<<21|(h[7]&127)<<14|(h[8]&127)<<7|(h[9]&127)):0;
            if(AMB.recv>=id3+8192 || (AMB.total && AMB.recv>=AMB.total)){
              info=mp3Info(first(id3+65536)) || {audio:id3, kbps:192};
              AMB.kbps=info.kbps;
              AMB.target=info.audio+Math.max(info.kbps,32)*125*cfg.ambient.headSec;
            }
          }
          if(info && !AMB.head && AMB.recv>=AMB.target && (!AMB.total || AMB.recv<AMB.total)){
            AMB.head=blob(); AMB.headSec=(AMB.recv-info.audio)/(Math.max(info.kbps,32)*125);
            AMB.state='head'; status.ambient='голова '+Math.round(AMB.headSec)+' с'; onAmbHead();
          }
        }
      } else {                                  // старый браузер без потока — ждём файл целиком
        const ab=await r.arrayBuffer(); chunks.push(new Uint8Array(ab)); AMB.recv=ab.byteLength;
      }
      if(testSrc) return;
      AMB.full=blob(); chunks.length=0;
      if(!AMB.head){ AMB.head=AMB.full; AMB.headSec=0; onAmbHead(); }
      AMB.state='full'; status.ambient='ok'; onAmbFull();
    }).catch(e=>{ if(testSrc) return; AMB.state='error'; status.ambient='нет файла'; console.warn('[snd] фон:', e.message); });
  }
  const isHead=v=>!!(AMB.head && AMB.head!==AMB.full && v.el.src===AMB.head);
  const best=()=>testSrc || AMB.full || AMB.head || '';
  function effDur(v){               // у головы «длина» — сколько пришло, а не то, что обещает заголовок
    const d=v.el.duration;
    if(isHead(v)) return Math.min(isFinite(d)&&d>0?d:1e9, AMB.headSec);
    return isFinite(d)&&d>0 ? d : NaN;
  }
  function setSrcKeep(v,src){       // сменить файл, сохранив позицию
    const t=v.el.currentTime; v.el.src=src;
    if(t>0){ const f=()=>{ v.el.removeEventListener('loadedmetadata',f); try{ v.el.currentTime=t; }catch(e){} };
      v.el.addEventListener('loadedmetadata',f); }
  }
  function onAmbHead(){             // голова пришла: если уже в зале — начать
    if(!voices) return;
    for(const v of voices) if(!v.el.getAttribute('src')) v.el.src=best();
    if(on && entered && voices[cur].el.paused) startAmbient(cfg.ambient.fadeIn);
  }
  function onAmbFull(){             // полный файл пришёл: подменить голову с того же места
    if(!voices) return;
    const a=voices[cur], b=voices[1-cur];
    if(!isHead(a)){ for(const v of voices) if(v.el.paused && isHead(v)) setSrcKeep(v, AMB.full); return; }
    if(!(on && entered) || a.el.paused){ setSrcKeep(a, AMB.full); if(b.el.paused) b.el.src=AMB.full; return; }
    upgrading=true;
    b.el.src=AMB.full; b.handoff=false;
    const go=()=>{ b.el.removeEventListener('canplay',go);
      try{ b.el.currentTime=a.el.currentTime+0.03; }catch(e){}
      b.el.play().then(()=>{
        cur=1-cur;
        curve(b.g.gain,EQ_IN,0.35); curve(a.g.gain,EQ_OUT,0.35);
        setTimeout(()=>{ a.el.pause(); a.el.src=AMB.full; a.handoff=false; upgrading=false; }, 700);
      }).catch(()=>{ upgrading=false; });
    };
    if(b.el.readyState>=2) go(); else b.el.addEventListener('canplay',go);
  }

  if(!view){
    fetch(new URL('sounds.json', AUDIO_DIR).href+'?v='+Date.now(), {cache:'no-store'})
      .then(r=>r.ok?r.json():null).catch(()=>null)
      .then(j=>{
        if(j) for(const k in cfg){ const a=j[k]; if(!a || typeof a!=='object') continue;
          for(const p of NUM) if(a[p]!==undefined && isFinite(+a[p])) cfg[k][p]=+a[p];
          if(typeof a.src==='string' && a.src) cfg[k].src=a.src; }
        applyQs();
        cfgLoaded=true;
        SFX.forEach(loadSfx);
        loadAmbient();
      });
  }

  const EQ_IN=new Float32Array(64).map((_,i)=>Math.sin(i/63*Math.PI/2));    // равная мощность:
  const EQ_OUT=new Float32Array(64).map((_,i)=>Math.cos(i/63*Math.PI/2));   // на стыке нет провала
  function hold(p){ const t=ctx.currentTime;
    if(p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t); else { p.cancelScheduledValues(t); p.setValueAtTime(p.value,t); } }
  function ramp(p,to,sec){ hold(p); p.linearRampToValueAtTime(to, ctx.currentTime+Math.max(0.02,sec)); }
  function curve(p,arr,sec){ const t=ctx.currentTime;
    try{ p.cancelScheduledValues(t); p.setValueCurveAtTime(arr,t,sec); }
    catch(e){ p.cancelScheduledValues(t); p.setValueAtTime(arr[0],t); p.linearRampToValueAtTime(arr[arr.length-1],t+sec); } }
  function setNow(p,v){ p.cancelScheduledValues(ctx.currentTime); p.setValueAtTime(v,ctx.currentTime); }

  function ensureCtx(){           // только из касания: браузеры не дают звук без жеста
    if(ctx) return ctx;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}   // iOS: как у видео — и в беззвучном режиме
    try{ ctx=new AC(); }catch(e){ console.warn('[snd] нет Web Audio:', e.message); return null; }
    lim=ctx.createDynamicsCompressor();           // страховка от перегруза, когда звуки наложатся
    lim.threshold.value=-6; lim.knee.value=6; lim.ratio.value=12; lim.attack.value=0.003; lim.release.value=0.25;
    lim.connect(ctx.destination);
    master=ctx.createGain(); master.gain.value=on?1:0; master.connect(lim);
    ambFade=ctx.createGain(); ambFade.gain.value=0; ambFade.connect(master);
    ambBus=ctx.createGain(); ambBus.gain.value=dB(cfg.ambient.gainDb); ambBus.connect(ambFade);
    sfxBus=ctx.createGain(); sfxBus.connect(master);
    // эхо собора: свёртка с импульсом, который строится здесь же, без файла
    try{ const cv=ctx.createConvolver(); cv.buffer=makeIR(cfg.reverb.rt);
      verbIn=ctx.createGain(); verbOut=ctx.createGain(); verbOut.gain.value=dB(cfg.reverb.wetDb);
      verbIn.connect(cv); cv.connect(verbOut); verbOut.connect(master);
    }catch(e){ console.warn('[snd] эхо:', e.message); verbIn=null; }
    SFX.forEach(decodeLive);
    return ctx;
  }
  // Импульс каменного зала: шум с затуханием до -60 дБ за rt секунд. Верха гаснут быстрее
  // низов (фильтр с опускающимся срезом) — хвост темнеет, как в камне. Первые 90 мс —
  // редкие ранние отражения от ближних стен, перед ними 18 мс тишины: звук сначала
  // долетает до стен. Каналы независимы — эхо обволакивает, а не стоит в центре.
  function makeIR(rt){
    const sr=ctx.sampleRate, len=Math.floor(sr*rt*1.15), pre=Math.floor(sr*0.018);
    const buf=ctx.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){
      const d=buf.getChannelData(ch); let lp=0;
      for(let i=pre;i<len;i++){ const t=(i-pre)/sr;
        const env=Math.exp(-6.91*t/rt), a=0.55*Math.exp(-t*1.4)+0.05;
        lp+=a*((Math.random()*2-1)*env-lp); d[i]=lp; }
      for(let r=0;r<9;r++){ const i=pre+Math.floor(sr*(0.010+Math.random()*0.08));
        if(i<len) d[i]+=(Math.random()<0.5?-1:1)*0.35*Math.exp(-r*0.18); }
    }
    return buf;
  }
  // неф поуже и пониже зала — эха в нём чуть меньше
  function setRoom(r){ if(r===room || !verbOut) return; room=r;
    const t=ctx.currentTime, v=dB(cfg.reverb.wetDb)*(r==='hall'?1.0:0.8);
    verbOut.gain.cancelScheduledValues(t); verbOut.gain.setTargetAtTime(v,t,0.6); }
  const lastVar={};
  function pickBuf(k){              // список вариантов: не повторять тот же дважды подряд
    const b=bufs[k];
    if(!Array.isArray(b)) return b;
    const av=b.map((x,i)=>x?i:-1).filter(i=>i>=0);
    if(!av.length) return null;
    let i=av[Math.random()*av.length|0];
    if(av.length>1 && i===lastVar[k]) i=av[(av.indexOf(i)+1)%av.length];
    lastVar[k]=i; return b[i];
  }
  // o: {bypass — мимо выключателя (щелчок самой кнопки звука), delay, gain, pitch, pan}
  function play(k, o){
    o=o||{};
    if(!on && !o.bypass) return;
    if(!ensureCtx()) return;
    const buf=pickBuf(k); if(!buf) return;
    if(ctx.state!=='running') ctx.resume().catch(()=>{});
    const s=ctx.createBufferSource(); s.buffer=buf;
    if(o.pitch) s.playbackRate.value=o.pitch;
    const g=ctx.createGain(); g.gain.value=dB(cfg[k].gainDb)*(o.gain===undefined?1:o.gain);
    s.connect(g);
    let out=g;
    if(o.pan && ctx.createStereoPanner){ const pn=ctx.createStereoPanner(); pn.pan.value=Math.max(-1,Math.min(1,o.pan)); g.connect(pn); out=pn; }
    out.connect(o.bypass?lim:sfxBus);
    const vs=cfg[k].verb||0;                                   // часть звука — в эхо собора
    if(vs>0 && verbIn && !o.bypass){ const sg=ctx.createGain(); sg.gain.value=vs; out.connect(sg); sg.connect(verbIn); }
    try{ s.start(o.delay>0 ? ctx.currentTime+o.delay : 0); }catch(e){}
  }
  // шаг: громкость и разлёт по сторонам — от хода; высота чуть пляшет, иначе слышно повтор одного файла
  let stepAt=0;
  function step(side, power){
    if(!on || !bufs.step) return;
    const now=performance.now(); if(now-stepAt<110) return; stepAt=now;   // провал кадра не должен давать сдвоенный шаг
    const c=cfg.step, p=Math.max(0,Math.min(1,power||0));
    const o={ gain:(1-c.dyn)+c.dyn*p, pitch:1+(Math.random()*2-1)*c.pitch, pan:(side||1)*c.pan*(0.7+0.3*p) };
    window.__lastStep={ side:side||1, power:+p.toFixed(2), pitch:+o.pitch.toFixed(3), pan:+o.pan.toFixed(3), t:Math.round(now) };
    play('step', o);
  }

  function makeVoices(){
    if(voices) return;
    voices=[0,1].map(()=>{
      const el=new Audio(); el.preload='auto'; el.setAttribute('playsinline','');
      const src=best(); if(src) el.src=src;
      const g=ctx.createGain(); g.gain.value=0; g.connect(ambBus);
      try{ ctx.createMediaElementSource(el).connect(g); }catch(e){ console.warn('[snd]', e.message); }
      const v={el, g, handoff:false};
      el.addEventListener('ended',()=>{                 // перехват не случился — начать заново
        if(voices[cur]===v && on && entered){ v.handoff=false;
          const s=best(); if(s && el.src!==s) el.src=s;
          el.currentTime=0; el.play().catch(()=>{}); } });
      el.addEventListener('error',()=>{ if(el.getAttribute('src')) console.warn('[snd] фон не играется:', el.src.slice(0,40)); });
      return v;
    });
  }
  function tick(){                                     // за xfade секунд до конца — второй голос с начала
    if(!voices||!on||!entered||document.hidden||upgrading) return;
    const a=voices[cur], d=effDur(a);
    if(!(d>0)||a.el.paused||a.handoff) return;
    const x=Math.min(cfg.ambient.xfade, d/3);
    if(d-a.el.currentTime>x) return;
    a.handoff=true;
    const b=voices[1-cur], s=best();
    b.handoff=false; if(s && b.el.src!==s) b.el.src=s; b.el.currentTime=0;
    b.el.play().then(()=>{
      if(voices[cur]!==a) return;
      cur=1-cur;
      curve(b.g.gain,EQ_IN,x); curve(a.g.gain,EQ_OUT,x);
      setTimeout(()=>{ if(voices[cur]!==a) a.el.pause(); }, x*1000+400);
    }).catch(()=>{});                                  // не дали — доиграет и начнётся заново по 'ended'
  }
  function startAmbient(fade){
    makeVoices();
    const v=voices[cur], o=voices[1-cur];
    ramp(ambFade.gain,1,fade);
    if(!loopTimer) loopTimer=setInterval(tick,200);
    if(!best()) return;                                // фон ещё в пути — начнётся сам, когда придёт голова
    if(!v.el.getAttribute('src')) v.el.src=best();
    else if(AMB.full && isHead(v) && v.el.paused) setSrcKeep(v, AMB.full);
    setNow(v.g.gain,1); setNow(o.g.gain,0); o.el.pause(); o.handoff=false;
    v.el.play().catch(e=>console.warn('[snd] play:', e.message));
  }

        .then(reg=>{ const urls=performance.getEntriesByType('resource').map(e=>e.name);
          if(reg.active) reg.active.postMessage({warm:urls}); }).catch(()=>{});
    },3000));
  }
}
</script>
<script>
// Отладка света. Включается только по ?dbg=1, в обычном режиме кода не видно.
// Гасит слои по одному: вершинный тон, лампы, рисованные плоскости, текстуры, заполняющий свет.
if(location.search.indexOf('dbg=1')>=0) addEventListener('load',()=>setTimeout(()=>{
  const box=document.createElement('div');
  box.style.cssText='position:fixed;top:8px;left:8px;z-index:99;font:13px monospace';
  document.body.appendChild(box);
  const vcMats=new Set(), texMats=new Set(), lamps=[], paint=[], amb=[];
  scene.traverse(o=>{
    if(o.isPointLight) lamps.push(o);
    if(o.isAmbientLight) amb.push(o);
    if(!o.isMesh&&!o.isPoints&&!o.isSprite) return;
    const mm=Array.isArray(o.material)?o.material:[o.material];
    for(const m of mm){ if(!m) continue;
      if(m.vertexColors) vcMats.add(m);
      if(m.map) texMats.add(m);
      if(m.transparent||m.blending===THREE.AdditiveBlending) paint.push(o); }
  });
  const layers=[
    ['вершинный тон', ()=>{for(const m of vcMats){m.vertexColors=!m.vertexColors;m.needsUpdate=true;}}, ()=>[...vcMats][0].vertexColors],
    ['лампы ('+lamps.length+')', ()=>lamps.forEach(l=>l.visible=!l.visible), ()=>lamps[0].visible],
    ['рисованный свет ('+paint.length+')', ()=>paint.forEach(o=>o.visible=!o.visible), ()=>paint[0].visible],
    ['текстуры', ()=>{for(const m of texMats){ if(m.__mp===undefined) m.__mp=m.map; m.map=m.map?null:m.__mp; m.needsUpdate=true; }}, ()=>!![...texMats][0].map],
    ['заполняющий свет', ()=>amb.forEach(l=>l.visible=!l.visible), ()=>amb.length?amb[0].visible:true],
  ];
  for(const [name,toggle,state] of layers){
    const b=document.createElement('div');
    const draw=()=>{ const on=state(); b.textContent=(on?'ВКЛ  ':'выкл ')+name;
      b.style.background=on?'#e8e0c4':'#8b2020'; };
    b.style.cssText='border:2px solid #3d3830;color:#353535;padding:9px 12px;margin:4px 0;box-shadow:2px 2px 0 #2a2520;min-width:230px';
    const go=e=>{ e.preventDefault(); e.stopPropagation(); toggle(); draw(); };
    b.addEventListener('touchstart',go,{passive:false}); b.addEventListener('mousedown',go);
    draw(); box.appendChild(b);
  }
},1200));
</script>
