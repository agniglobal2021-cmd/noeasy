<script>
document.addEventListener('contextmenu', e => e.preventDefault());

const progressEl = document.getElementById('scroll-progress');
window.addEventListener('scroll', () => { const max = document.documentElement.scrollHeight - window.innerHeight; const pct = max > 0 ? Math.round(window.scrollY / max * 100) : 0; progressEl.style.setProperty('--progress', pct + '%'); }, { passive: true });

const grain = document.getElementById('grain');

let gw, gh;
function resizeGrain() { gw = grain.width = window.innerWidth + 20; gh = grain.height = window.innerHeight + 120; }
resizeGrain();
let _grainResizeTimer;
window.addEventListener('resize', () => { clearTimeout(_grainResizeTimer); _grainResizeTimer = setTimeout(resizeGrain, 150); });
(function tick() {
  const alphaMax = 26;

})();

let works = [];
async function loadWorks() { try { const r = await fetch('works.json'); if (!r.ok) throw new Error('not found'); works = await r.json(); } catch(e) { works = []; } render(); }

let sortAsc = false, activeStyle = 'all', activeType = 'all', activeAvail = new Set(['all']), savedAvail = new Set(['all']);
let isGrid = window.innerWidth >= 680, lbIndex = -1, currentList = [];

function fmtDate(dateStr, yearFallback) { if (dateStr) { const d = new Date(dateStr + 'T00:00:00'); if (!isNaN(d)) return d.toLocaleString('en-US', { month: 'long', year: 'numeric' }); } return yearFallback || ''; }
function getSorted() { return [...works].sort((a, b) => { const da = a.date || String(a.year || 0); const db = b.date || String(b.year || 0); return sortAsc ? da.localeCompare(db) : db.localeCompare(da); }); }
function getFiltered() { return getSorted().filter(w => { const styleOk = activeStyle === 'all' || w.style === activeStyle; const typeOk = activeType === 'all' || w.workType === activeType; const availOk = activeType === 'Commission' || activeAvail.has('all') || (Array.isArray(w.avail) && w.avail.some(a => activeAvail.has(a))); return styleOk && typeOk && availOk; }); }

function buildTitleChars(title) {

    const delay = (i * STEP).toFixed(3) + 's';
    if (ch === ' ') return `<span class="wt-char wt-space" style="transition-delay:${delay}"> </span>`;
    const safe = ch.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<span class="wt-char" style="transition-delay:${delay}">${safe}</span>`;
  }).join('');
}

const wcEl = document.getElementById('work-count');
function animateCount(text) { if (wcEl.textContent === text) return; wcEl.style.cssText = 'opacity:0;transform:translateY(-6px) scale(0.9);transition:none'; requestAnimationFrame(() => { wcEl.textContent = text; requestAnimationFrame(() => { wcEl.style.cssText = 'opacity:0.26;transform:none;transition:opacity 0.4s cubic-bezier(0.16,1,0.3,1),transform 0.4s cubic-bezier(0.16,1,0.3,1)'; }); }); }

document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('swordBtn');
  const overlay = document.getElementById('navOverlay');

  document.addEventListener('click', function(e){ if (!overlay.contains(e.target) && e.target !== btn) { btn.classList.remove('open'); overlay.classList.remove('open'); } });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ btn.classList.remove('open'); overlay.classList.remove('open'); } });

const feed = document.getElementById('feed'), empty = document.getElementById('empty-state');
let observer;

function render(scrollTop = false) {
  if (observer) observer.disconnect();
  feed.innerHTML = '';
  currentList = getFiltered();

  feed.classList.toggle('grid-mode', isGrid);

    const left = document.createElement('div'); left.className = 'work-left';
    const titleRow = document.createElement('div'); titleRow.className = 'work-title-row'; titleRow.innerHTML = `<span class="work-title">${buildTitleChars(work.title)}</span>`; left.appendChild(titleRow);
    const metaRow = document.createElement('div'); metaRow.className = 'work-meta-row'; const dateStr = fmtDate(work.date, work.year); metaRow.innerHTML = `<span class="work-year">${dateStr}</span><span class="work-year-sep"></span><div class="work-tags">${tagsHtml}</div>`; left.appendChild(metaRow);
    const right = document.createElement('div'); right.className = 'work-right';

      const dropdown = document.createElement('div'); dropdown.className = 'purchase-dropdown';
      work.links.forEach(lk => { const a = document.createElement('a'); a.href = lk.url; a.textContent = lk.label; a.target = '_blank'; a.rel = 'noopener'; a.addEventListener('click', e => { e.stopPropagation(); dropdown.classList.remove('open'); btn.classList.remove('open'); }); dropdown.appendChild(a); });
      btn.addEventListener('click', e => { e.stopPropagation(); const isOpen = dropdown.classList.contains('open'); document.querySelectorAll('.purchase-dropdown.open').forEach(d => d.classList.remove('open')); document.querySelectorAll('.purchase-btn.open').forEach(b => b.classList.remove('open')); if (!isOpen) { dropdown.classList.add('open'); btn.classList.add('open'); } haptic('light'); });
      document.addEventListener('click', () => { dropdown.classList.remove('open'); btn.classList.remove('open'); });
      pw.appendChild(btn); pw.appendChild(dropdown); right.appendChild(pw);
    }
    footer.appendChild(left); footer.appendChild(right);
    const win95 = document.createElement('div'); win95.className = 'img-win95';
    const titlebar = document.createElement('div'); titlebar.className = 'img-win95-titlebar';
    const titleText = document.createElement('span'); titleText.className = 'img-win95-titlebar-text'; titleText.textContent = work.title.toUpperCase() + (work.year ? '  [' + work.year + ']' : '');
    const btns = document.createElement('div'); btns.className = 'img-win95-titlebar-btns';
    const crossSVG = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;image-rendering:pixelated;shape-rendering:crispEdges"><rect x="4" y="0" width="2" height="10" fill="#1a1612"/><rect x="3" y="1" width="4" height="1" fill="#1a1612"/><rect x="3" y="8" width="4" height="1" fill="#1a1612"/><rect x="2" y="0" width="6" height="1" fill="#1a1612"/><rect x="2" y="9" width="6" height="1" fill="#1a1612"/><rect x="0" y="4" width="10" height="2" fill="#1a1612"/><rect x="1" y="3" width="1" height="4" fill="#1a1612"/><rect x="8" y="3" width="1" height="4" fill="#1a1612"/><rect x="0" y="2" width="1" height="6" fill="#1a1612"/><rect x="9" y="2" width="1" height="6" fill="#1a1612"/></svg>`;
    btns.innerHTML = `<span class="img-win95-btn" title="Minimize">${crossSVG}</span><span class="img-win95-btn" title="Maximize">${crossSVG}</span><span class="img-win95-btn btn-close" title="Close">${crossSVG}</span>`;
    btns.addEventListener('click', e => e.stopPropagation());
    const titleInner = document.createElement('div'); titleInner.className = 'img-win95-titlebar-inner'; titleInner.appendChild(titleText); titleInner.appendChild(btns);
    titlebar.appendChild(titleInner); win95.appendChild(titlebar); win95.appendChild(wrap);
    item.appendChild(win95); item.appendChild(footer);
    if (isGrid) { const colIdx = i % numCols; item.style.transitionDelay = `${colIdx * 0.06}s`; colEls[colIdx].appendChild(item); } else { feed.appendChild(item); }
    if (!isGrid && i < currentList.length - 1) { const sep = document.createElement('div'); sep.className = 'sep'; feed.appendChild(sep); }
  });
  const items = feed.querySelectorAll('.work-item');
  observer = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); updateAmbient(e.target); } }); }, { threshold: 0.01, rootMargin: '0px 0px 60px 0px' });
  items.forEach(el => observer.observe(el));
  if (isGrid) { requestAnimationFrame(() => { const cols = feed.querySelectorAll('.grid-col'); let maxBottom = 0; cols.forEach(col => { const r = col.getBoundingClientRect(); const bottom = r.bottom + window.scrollY; if (bottom > maxBottom) maxBottom = bottom; }); const feedTop = feed.getBoundingClientRect().top + window.scrollY; feed.style.minHeight = (maxBottom - feedTop + 100) + 'px'; }); } else { feed.style.minHeight = ''; }
  initParallax();
}

function blendWithBg(hex, amount) { const m = hex.match(/\d+/g); if (!m || m.length < 3) return; const [r, g, b] = m.map(Number); const base = [232, 224, 196]; const out = base.map((c, i) => Math.round(c * (1 - amount) + [r,g,b][i] * amount)); return `rgb(${out[0]},${out[1]},${out[2]})`; }
let ambientTimer;
function updateAmbient(item) { const ph = item.querySelector('.img-placeholder'); const img = item.querySelector('img'); let color = null; if (ph) { color = ph.style.background; } else if (img && img.complete) { try { const c = document.createElement('canvas'); c.width = c.height = 1; const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, 1, 1); const [r,g,b] = ctx.getImageData(0,0,1,1).data; color = `${r},${g},${b}`; } catch(_) {} } if (!color) return; clearTimeout(ambientTimer); ambientTimer = setTimeout(() => { const blended = blendWithBg(color, 0.055); if (blended) { document.body.style.transition = 'background-color 3s ease'; document.body.style.backgroundColor = blended; } }, 400); }

const COL_FACTORS = [0.030, 0.062, 0.096], FEED_FACTOR = 0.088;
let rafId = null;
const revealStart = new WeakMap();
function initParallax() {
  if (rafId) cancelAnimationFrame(rafId);
  const DURATION = 900, OFFSET = 32;
  function tick() {
    const vh = window.innerHeight, now = performance.now();
    feed.querySelectorAll('.work-item').forEach(item => {
      const win95 = item.querySelector('.img-win95'), wrap = item.querySelector('.img-wrap'), inner = wrap && wrap.firstElementChild;
      if (!win95 || !inner) return;
      const colIdx = parseInt(item.dataset.col ?? '-1');
      const factor = isGrid && colIdx >= 0 ? COL_FACTORS[colIdx] ?? COL_FACTORS[0] : FEED_FACTOR;
      const rect = win95.getBoundingClientRect();
      const parallax = ((rect.top + rect.height / 2) - vh / 2) * factor;
      if (!item.classList.contains('visible')) { win95.style.transform = `translateY(${OFFSET}px)`; inner.style.transform = `scale(1.08)`; revealStart.delete(item); return; }
      if (!revealStart.has(item)) revealStart.set(item, now);
      const t = Math.min((now - revealStart.get(item)) / DURATION, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      const rise = OFFSET * (1 - ease);
      win95.style.transform = `translateY(${(rise + parallax).toFixed(2)}px)`;
      inner.style.transform = `scale(${(1.08 - 0.06 * ease).toFixed(4)})`;
      const footer = item.querySelector('.work-footer');
      if (!footer) return;
      const itemRect = item.getBoundingClientRect();
      const dist = (itemRect.top + itemRect.height / 2) - vh / 2;
      const normDist = Math.min(Math.abs(dist) / (vh * 0.5), 1);
      const fade = 1 - normDist * 0.40 * ease;
      item.style.setProperty('--secondary-fade', fade.toFixed(3));
      footer.style.transform = `translateY(${(rise + parallax).toFixed(2)}px)`;
    });
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

const gridBtn = document.getElementById('grid-btn');
gridBtn.classList.toggle('grid-active', isGrid);
gridBtn.title = isGrid ? 'Switch to feed' : 'Switch to grid';
gridBtn.addEventListener('click', () => { isGrid = !isGrid; gridBtn.classList.toggle('grid-active', isGrid); gridBtn.title = isGrid ? 'Switch to feed' : 'Switch to grid'; haptic('light'); render(); });

const filterPanel = document.getElementById('filter-panel'), filterToggle = document.getElementById('filter-toggle'), filterDot = document.getElementById('filter-dot'), availGroup = document.getElementById('avail-group');
filterToggle.addEventListener('click', e => { e.stopPropagation(); const open = filterPanel.classList.toggle('open'); filterToggle.classList.toggle('open', open); haptic('light'); });
document.addEventListener('click', e => { if (!filterPanel.contains(e.target) && e.target !== filterToggle) { filterPanel.classList.remove('open'); filterToggle.classList.remove('open'); } });
function updateFilterDot() { filterDot.classList.toggle('visible', activeStyle !== 'all' || activeType !== 'all' || !activeAvail.has('all')); }
function updateAvailGroup() { availGroup.classList.toggle('avail-hidden', activeType === 'Commission'); }
filterPanel.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn'); if (!btn) return;
  if (btn.classList.contains('style-btn')) { activeStyle = btn.dataset.tag; filterPanel.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === activeStyle)); }
  if (btn.classList.contains('type-btn')) { const prev = activeType; activeType = btn.dataset.tag; if (activeType === 'Commission' && prev !== 'Commission') { savedAvail = new Set(activeAvail); } else if (activeType !== 'Commission' && prev === 'Commission') { activeAvail = new Set(savedAvail); filterPanel.querySelectorAll('.avail-btn').forEach(b => b.classList.toggle('active', activeAvail.has(b.dataset.tag) || (activeAvail.has('all') && b.dataset.tag === 'all'))); } filterPanel.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === activeType)); updateAvailGroup(); }
  if (btn.classList.contains('avail-btn') && activeType !== 'Commission') { const tag = btn.dataset.tag; if (tag === 'all') { activeAvail = new Set(['all']); } else { activeAvail.delete('all'); activeAvail.has(tag) ? activeAvail.delete(tag) : activeAvail.add(tag); if (!activeAvail.size) activeAvail.add('all'); } filterPanel.querySelectorAll('.avail-btn').forEach(b => b.classList.toggle('active', activeAvail.has(b.dataset.tag) || (activeAvail.has('all') && b.dataset.tag === 'all'))); }
  updateFilterDot(); haptic('light'); render(true);
});

document.getElementById('sort-btn').addEventListener('click', function() { sortAsc = !sortAsc; this.textContent = sortAsc ? 'Oldest ↑' : 'Newest ↓'; haptic('light'); render(true); });

const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img'), lbTitle = document.getElementById('lb-title'), lbPrev = document.getElementById('lb-prev'), lbNext = document.getElementById('lb-next');
const MAX_ZOOM = 3.5, DBL_TAP_ZOOM = 2.2;
let lbZoom = 1, lbPanX = 0, lbPanY = 0;

function applyLbTransform() {
  lbImg.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbZoom})`;
  lbImg.classList.toggle('lb-zoomed', lbZoom > 1.001);

function clampPan() {
  if (lbZoom <= 1) { lbPanX = 0; lbPanY = 0; return; }
  const rect = lbImg.getBoundingClientRect();
  const baseW = rect.width / lbZoom, baseH = rect.height / lbZoom;
  const maxX = Math.max(0, (baseW * lbZoom - baseW) / 2);
  const maxY = Math.max(0, (baseH * lbZoom - baseH) / 2);
  lbPanX = Math.min(maxX, Math.max(-maxX, lbPanX));
  lbPanY = Math.min(maxY, Math.max(-maxY, lbPanY));
}
function resetLbZoom() { lbZoom = 1; lbPanX = 0; lbPanY = 0; lbImg.classList.add('lb-nozoomtransition'); applyLbTransform(); requestAnimationFrame(() => lbImg.classList.remove('lb-nozoomtransition')); }
function setLbZoom(newZoom, originClientX, originClientY, smooth) {
  const rect = lbImg.getBoundingClientRect();
  const cx = originClientX !== undefined ? originClientX : rect.left + rect.width / 2;
  const cy = originClientY !== undefined ? originClientY : rect.top + rect.height / 2;
  const offsetX = cx - (rect.left + rect.width / 2);
  const offsetY = cy - (rect.top + rect.height / 2);
  newZoom = Math.min(MAX_ZOOM, Math.max(1, newZoom));
  if (newZoom === lbZoom) return;
  lbPanX = (lbPanX - offsetX) * (newZoom / lbZoom) + offsetX;
  lbPanY = (lbPanY - offsetY) * (newZoom / lbZoom) + offsetY;
  lbZoom = newZoom;
  clampPan();
  lbImg.classList.toggle('lb-nozoomtransition', !smooth);
  applyLbTransform();
  if (!smooth) requestAnimationFrame(() => {});
}

function openLb(idx) { if (idx !== undefined) lbIndex = idx; const work = currentList[lbIndex]; if (!work || !work.src) return; resetLbZoom(); lbImg.style.opacity = '0'; lbImg.src = work.src; lbImg.alt = work.title; lbTitle.textContent = work.title; lbImg.onload = () => { lbImg.style.opacity = '1'; }; const scrollbarW = window.innerWidth - document.documentElement.clientWidth; document.body.style.paddingRight = scrollbarW + 'px'; lb.classList.add('open'); document.body.style.overflow = 'hidden'; const hasPrev = currentList.slice(0, lbIndex).some(w => w.src); const hasNext = currentList.slice(lbIndex + 1).some(w => w.src); lbPrev.classList.toggle('hidden', !hasPrev); lbNext.classList.toggle('hidden', !hasNext); }
function lbStep(dir) { let idx = lbIndex + dir; while (idx >= 0 && idx < currentList.length) { if (currentList[idx].src) { lbIndex = idx; openLb(); return; } idx += dir; } }
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; document.body.style.paddingRight = ''; resetLbZoom(); setTimeout(() => { lbImg.src = ''; lbTitle.textContent = ''; }, 420); }
lb.addEventListener('click', e => { if (e.target === lb && !lbSuppressClick) closeLb(); });
document.getElementById('lb-close').addEventListener('click', closeLb);
lbPrev.addEventListener('click', e => { e.stopPropagation(); lbStep(-1); });
lbNext.addEventListener('click', e => { e.stopPropagation(); lbStep(1); });
document.addEventListener('keydown', e => { if (!lb.classList.contains('open')) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft' && lbZoom <= 1.001) lbStep(-1); if (e.key === 'ArrowRight' && lbZoom <= 1.001) lbStep(1); });

let lbSuppressClick = false;

// Desktop: wheel zoom
lbImg.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0016);
  setLbZoom(lbZoom * factor, e.clientX, e.clientY, false);
}, { passive: false });

// Desktop: click-drag pan (only when zoomed)
let lbDragging = false, lbDragStartX = 0, lbDragStartY = 0, lbPanStartX = 0, lbPanStartY = 0, lbDragMoved = false;
lbImg.addEventListener('mousedown', e => {
  if (lbZoom <= 1.001) return;
  e.preventDefault();
  lbDragging = true; lbDragMoved = false;
  lbDragStartX = e.clientX; lbDragStartY = e.clientY;
  lbPanStartX = lbPanX; lbPanStartY = lbPanY;
  lbImg.classList.add('lb-panning');
});
window.addEventListener('mousemove', e => {
  if (!lbDragging) return;
  const dx = e.clientX - lbDragStartX, dy = e.clientY - lbDragStartY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) lbDragMoved = true;
  lbPanX = lbPanStartX + dx; lbPanY = lbPanStartY + dy;
  clampPan();
  lbImg.classList.add('lb-nozoomtransition');
  applyLbTransform();
});
window.addEventListener('mouseup', () => {
  if (!lbDragging) return;
  lbDragging = false;
  lbImg.classList.remove('lb-panning');
  lbImg.classList.remove('lb-nozoomtransition');
  if (lbDragMoved) { lbSuppressClick = true; setTimeout(() => { lbSuppressClick = false; }, 50); }
});

// Double-click toggle zoom (desktop)
lbImg.addEventListener('dblclick', e => {
  e.preventDefault();
  if (lbZoom > 1.001) { resetLbZoom(); } else { setLbZoom(DBL_TAP_ZOOM, e.clientX, e.clientY, true); }
});

// Touch: pinch-zoom, single-finger pan when zoomed, swipe when not, double-tap toggle
let lbTouchX = null;
let lbPinchStartDist = 0, lbPinchStartZoom = 1, lbPinchMidX = 0, lbPinchMidY = 0;
let lbLastTap = 0;
let lbTouchPanStartX = 0, lbTouchPanStartY = 0, lbTouchPanOrigX = 0, lbTouchPanOrigY = 0, lbTouchMoved = false;

function touchDist(t0, t1) { return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY); }
function touchMid(t0, t1) { return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 }; }

lb.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    lbTouchX = null;
    lbPinchStartDist = touchDist(e.touches[0], e.touches[1]);
    lbPinchStartZoom = lbZoom;
    const mid = touchMid(e.touches[0], e.touches[1]);
    lbPinchMidX = mid.x; lbPinchMidY = mid.y;
  } else if (e.touches.length === 1) {
    lbTouchMoved = false;
    if (lbZoom > 1.001) {
      lbTouchPanStartX = e.touches[0].clientX; lbTouchPanStartY = e.touches[0].clientY;
      lbTouchPanOrigX = lbPanX; lbTouchPanOrigY = lbPanY;
    } else {
      lbTouchX = e.touches[0].clientX;
    }
    const now = Date.now();
    if (now - lbLastTap < 320) {
      if (lbZoom > 1.001) { resetLbZoom(); } else { setLbZoom(DBL_TAP_ZOOM, e.touches[0].clientX, e.touches[0].clientY, true); }
      lbLastTap = 0;
      lbTouchX = null;
    } else {
      lbLastTap = now;
    }
  }
}, { passive: true });

lb.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dist = touchDist(e.touches[0], e.touches[1]);
    const mid = touchMid(e.touches[0], e.touches[1]);
    const newZoom = lbPinchStartZoom * (dist / lbPinchStartDist);
    setLbZoom(newZoom, mid.x, mid.y, false);
  } else if (e.touches.length === 1 && lbZoom > 1.001) {
    e.preventDefault();
    const dx = e.touches[0].clientX - lbTouchPanStartX, dy = e.touches[0].clientY - lbTouchPanStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) lbTouchMoved = true;
    lbPanX = lbTouchPanOrigX + dx; lbPanY = lbTouchPanOrigY + dy;
    clampPan();
    lbImg.classList.add('lb-nozoomtransition');
    applyLbTransform();
  }
}, { passive: false });

lb.addEventListener('touchend', e => {
  lbImg.classList.remove('lb-nozoomtransition');
  if (lbTouchMoved) { lbSuppressClick = true; setTimeout(() => { lbSuppressClick = false; }, 50); lbTouchMoved = false; return; }
  if (lbTouchX === null) return;
  if (lbZoom > 1.001) { lbTouchX = null; return; }
  const dx = e.changedTouches[0].clientX - lbTouchX;
  lbTouchX = null;
  if (Math.abs(dx) < 40) return;
  haptic('light');
  lbStep(dx < 0 ? 1 : -1);
}, { passive: true });

const headerEl = document.querySelector('header');
setTimeout(() => headerEl.classList.add('visible'), 100);
loadWorks();
</script>
